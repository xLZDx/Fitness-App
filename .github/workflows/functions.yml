# P1b — the backend half of CI, and the first thing here that fails closed.
#
# Before this file, `.github/workflows/` held `flutter.yml` and nothing else:
# the Cloud Functions suite, the Firestore rules and the dependency tree were
# all unverified on every push. That is the state the audit called out — a
# release gate that cannot go red for a backend regression is not a gate.
#
# Every job below is required to pass. None of them tolerate a failure, and
# none use `continue-on-error`; a step that is allowed to fail is a step that
# reports nothing.
name: functions

on:
  push:
    # F008, same reasoning as `flutter.yml`: a working branch got no
    # push-triggered run, so the Firestore rules tests -- the ones that proved
    # G-D -- did not run on the branch G-D was built on.
    branches: ['**']
  pull_request:
  # CI-F1: the `audit` job below is the only check in this repository whose
  # RESULT CHANGES WITHOUT ANYONE COMMITTING -- a CVE against `stripe` or
  # `firebase-admin` is disclosed on someone else's schedule, not ours. It was
  # also the only one that ran solely on a commit. So in a quiet fortnight,
  # the job whose whole purpose is to tell us about something that happened
  # while we were not looking was the job that could not.
  #
  # That is not hypothetical for this file: the comment on `audit` records two
  # real production advisories it caught (`@grpc/grpc-js`, `body-parser`).
  # Both were found on a push that happened to follow the disclosure.
  #
  # The other four jobs are deterministic given the lockfile, so a nightly run
  # of them is redundant rather than noisy -- and it is the cheap way to catch
  # toolchain rot in the runner images, which this project has already been
  # bitten by once (the Firestore emulator's JDK 21 requirement).
  #
  # 04:15 UTC, a quarter-hour after `flutter.yml`'s nightly, so the two do not
  # start into the same runner pool at the same instant.
  schedule:
    - cron: '15 4 * * *'
  # And so it can be run from the Actions tab the moment an advisory lands,
  # instead of pushing an empty commit to ask a question.
  workflow_dispatch:

# A push that supersedes an in-flight run cancels it. The value of these
# checks is on the newest commit, not on a queue of stale ones.
concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: functions

jobs:
  unit:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # `npm ci` rather than `npm install`: it installs exactly the lockfile
      # and fails if package.json and the lock have drifted, which is itself a
      # check worth having.
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests
        run: npm test -- --json --outputFile=jest_result.json
      # MVP1.G3 OBS-1 item 1: `npm test`'s own exit code already fails on a
      # fully-empty suite (no `--passWithNoTests`), but a partial-discovery
      # regression can still exit 0 while running far fewer tests than
      # exist -- exactly the class of gap that let the Jest suite run
      # nothing in this worktree for months (see core/MASTER_PLAN_2026-08-26.md
      # Sec8's OBS-1 history table). This step asserts an explicit minimum
      # suite/test count from Jest's own JSON report, not just a nonzero
      # exit code.
      - name: assert test-suite health
        run: node scripts/assert_test_health.js jest_result.json

  rules:
    name: firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator requires JDK 21+. This is also why the local
      # runner script exists: dev machines here have 17 for the Android build,
      # and moving that would change what the release APK compiles against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: rules tests against the emulator
        run: npm run test:rules

  e2e:
    name: account deletion e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Separate from `rules` rather than folded into it: this one drives the
      # ADMIN SDK against the emulator, where rules do not apply at all. Sharing
      # a job would mean one emulator process holding both suites' fixtures, and
      # a deletion test whose whole subject is "what else got deleted" is the
      # worst possible neighbour for a suite seeding its own documents.
      - name: deletion + multi-account isolation
        run: npm run test:e2e

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # `--omit=dev` on purpose. A vulnerability in jest or ts-jest never
      # reaches a user; one in `stripe` or `firebase-admin` runs in production
      # holding a payment key. Auditing everything at `high` would fail this
      # job on tooling advisories nobody can act on and train people to ignore
      # a red build, which costs more than it buys.
      #
      # `--package-lock-only` is load-bearing, not decoration: without it npm
      # audits the INSTALLED tree, which still contains the dev packages
      # `--omit=dev` was meant to exclude. The first version of this job read
      # green-looking dev advisories as production ones and would have failed
      # on `websocket-driver` reached through `@firebase/rules-unit-testing`.
      # With the lockfile form it found two REAL ones instead — a high in
      # `@grpc/grpc-js` (reached via firebase-admin, so it runs in every
      # deployed function) and a DoS in `body-parser` — both since fixed.
      - name: production dependencies, high and above
        run: npm audit --omit=dev --package-lock-only --audit-level=high

  drift:
    name: deployment drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # The audit's deployment-drift finding was real and expensive: an
      # Acacia/Basil webhook fix sat committed-but-undeployed for three days,
      # and `exportAccountData` was written, tested, recorded as done and never
      # deployed at all. Neither was visible from the repo.
      #
      # This cannot see what is deployed without credentials, so it checks the
      # half it can: that the built output compiles and that every entrypoint
      # in `index.ts` is registered in `scaling.ts`. `scaling.test.ts` already
      # asserts the exact deployed surface, and that tripwire is what caught
      # `exportAccountData` missing its ceiling.
      - name: build the deployable output
        run: npm run build
      - name: entrypoint surface is complete
        run: npx jest scaling

  equipment-registry-parity:
    name: equipment registry parity (CANONICAL_MACHINES vs equipment.json)
    runs-on: ubuntu-latest
    # Overrides the file-level `defaults.run.working-directory: functions` --
    # this check reads both functions/src/ and mobile/assets/data/, so it
    # needs the repo root, not either subtree.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # MVP1.G3 OBS-1 item 4: functions/src/ai_equipment_recognition.ts's
      # CANONICAL_MACHINES is a hand-maintained second source of truth for
      # the same vocabulary mobile/assets/data/equipment.json already owns --
      # the exact drift mechanism the 08-03 kCanonicalMachines fix closed one
      # instance of without closing the recurrence risk (see
      # core/MASTER_PLAN_2026-08-26.md Sec8 item 10). No npm install needed --
      # the script only uses Node's built-in fs/path.
      - name: content-level parity check
        run: node scripts/ci/check_equipment_registry_parity.js

  data-lifecycle-coverage:
    name: data lifecycle coverage drift guard (G3-CI-8)
    runs-on: ubuntu-latest
    # Overrides the file-level `defaults.run.working-directory: functions` --
    # this check reads firestore.rules, functions/src/ and mobile/lib/, so it
    # needs the repo root, not either subtree.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # MVP1.G3-CI-8: deleteAccount can return 200/OK for years while
      # silently missing a new Firestore collection -- coverage was a
      # point-in-time human inventory ("A0", core/DECISION_LOG.md), not an
      # enforced invariant. This discovers every collection actually in use
      # (firestore.rules match-blocks UNION literal .collection() calls in
      # production source) and fails on any collection with no explicit
      # DELETE/EXPORT/BOTH/EXEMPT lifecycle policy entry in
      # scripts/ci/data_lifecycle_policy.json. No npm install needed -- the
      # script only uses Node's built-in fs/path.
      - name: data lifecycle coverage check
        run: node scripts/ci/check_data_lifecycle_coverage.js
