name: flutter

on:
  push:
    # F008: every branch, not just the two that get merged into.
    #
    # `[master, main]` meant a working branch got NO push-triggered run at
    # all, and `pull_request` only covers a branch once someone opens one. So
    # the branch where the work actually happens -- where a regression is
    # cheapest to find -- was the one branch with no CI, and a gate could sit
    # broken for days until its PR went up.
    #
    # The cost is bounded by the `concurrency` group below, which already
    # cancels a superseded run on the same ref.
    branches: ['**']
  pull_request:
  # Daily, so the device job runs even in a week with no pull request. 04:00
  # UTC / 07:00 Europe/Chisinau -- a failure is waiting in the morning rather
  # than arriving mid-session.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          # R-05. `test/ml/model_registry_test.dart` verifies that a manifest's
          # recorded `source_commit` names a commit that exists here, rather
          # than merely looking like a sha. The default shallow checkout has
          # exactly one commit, so that lookup would fail on every build for a
          # reason that has nothing to do with provenance -- and the usual
          # repair for a test that fails for the wrong reason is to weaken it
          # back to a regex.
          #
          # Full history is what makes provenance checkable at all. If this is
          # ever removed, `test/ci/workflow_gates_test.dart` fails, so the
          # decision has to be taken rather than drifted into.
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            mobile/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        # Don't fail the run on warnings-only (we have a few pre-existing
        # ones in the workouts providers); fail on errors.
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: flutter test
        run: flutter test --no-pub --reporter=expanded

  # CI-F2 (backlog row 22). No job anywhere built a real release artifact --
  # analyze-and-test only ever runs `flutter test`, so a break in the actual
  # release path (Gradle assembleRelease/bundleRelease, R8/resource
  # processing, native lib packaging) was invisible to every job in this
  # file. This job runs the project's OWN canonical release-build path
  # (scripts/dev/build_release.ps1, CI-F2) rather than a second, independent
  # `flutter build` invocation -- so CI proves the exact mechanism the
  # operator's own local release/distribute workflow depends on, with the
  # same GIT_SHA/BUILT_AT/monotonic-build-number stamping semantics, instead
  # of a parallel path that could drift from it. Never passes -Distribute:
  # this job proves the build works, it does not publish to testers.
  release-build:
    name: release build (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          # build_release.ps1 derives the build number from
          # `git rev-list --count HEAD` and refuses to run under a shallow
          # clone that would make that number regress -- same reason
          # analyze-and-test needs full history, see R-05 above.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      # Split APK (the operator's own default distribution artifact) and AAB
      # (the Play-console form) both go through the same wrapper -- two
      # separate invocations, not one script with two output claims, so a
      # regression specific to either build type is still caught.
      - name: Build split APK (release)
        run: pwsh scripts/dev/build_release.ps1

      - name: Build AAB (release)
        run: pwsh scripts/dev/build_release.ps1 -Bundle

      # Size floors are real measurements (2026-09-16, this exact HEAD, same
      # split/bundle commands run locally), not guesses -- roughly half the
      # measured 108.9 MB (APK) / 130.5 MB (AAB), loose enough to tolerate
      # legitimate size drift from future dependency/asset changes while
      # still catching the "build exited 0 but produced a near-empty or
      # corrupt file" failure mode a bare existence check would miss.
      - name: Verify artifacts are real, not near-empty
        run: |
          set -euo pipefail
          apk="mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          aab="mobile/build/app/outputs/bundle/release/app-release.aab"
          apk_floor=$((50 * 1024 * 1024))
          aab_floor=$((60 * 1024 * 1024))
          for pair in "$apk:$apk_floor:APK" "$aab:$aab_floor:AAB"; do
            IFS=: read -r path floor label <<< "$pair"
            if [ ! -f "$path" ]; then
              echo "::error::$label missing at $path"
              exit 1
            fi
            size=$(stat -c%s "$path")
            echo "$label: $size bytes ($path)"
            if [ "$size" -lt "$floor" ]; then
              echo "::error::$label is $size bytes, below the $floor-byte floor -- build likely produced a near-empty or corrupt artifact"
              exit 1
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  functions-build:
    name: cloud functions tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run build --if-present

  integration:
    name: integration (emulator)
    # NOT on every push. It costs 10-15 minutes against roughly 4 for the host
    # job, and it catches a class of defect that appears about once a month --
    # so it guards the branch boundary and a nightly, not each commit.
    #
    # Free: GitHub Actions bills nothing for standard runners on a public
    # repository, and this is one (verified 2026-08-06: the API reports
    # `private=false`). A LARGER runner would be billed even here, which is why
    # this stays on `ubuntu-latest`.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The emulator needs nested virtualisation. GitHub's Linux runners expose
      # /dev/kvm but not to the runner user, so without this the emulator falls
      # back to software rendering and times out rather than failing loudly.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      # Gradle is the slow half of this job, and it is the half that caches
      # well. Keyed on the build files so a plugin bump invalidates it.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-gradle-

      # API 34 because that is the level the suite is actually known to pass on
      # -- `Pixel_API_34`, the operator's local AVD, measured 10/10 on
      # 2026-08-06. minSdk is 26, so a lower level would also run, but it would
      # be a level nothing has ever verified.
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: mobile
          # Every file, not one hard-coded name -- a file added to
          # integration_test/ (e.g. workout_completion_persistence_test.dart)
          # must run in CI without a second edit here, or "every run" quietly
          # means "every run of the one file this line happens to name".
          #
          # One file at a time, in its own `flutter test` process, NOT
          # `flutter test integration_test/` on the bare directory --
          # verified live (2026-08-28) that the directory form starts
          # building/installing the NEXT file's APK onto the emulator while
          # the previous file's device session is still mid-suite, which
          # replaces its running app process out from under it. Every test
          # after the point of collision then reports "did not complete",
          # not a real per-test failure. A loop over files gives each one
          # its own process and its own full install/run/teardown before
          # the next begins, which is what avoids that collision.
          # Aggregate, don't fail-fast: `set -e` would abort this loop at the
          # first failing file, and the glob is alphabetical -- a known-red
          # file earlier in the alphabet (e.g. app_test.dart) would then
          # silently prevent every later file (e.g.
          # workout_completion_persistence_test.dart) from ever running.
          # GPT-PM round 3 (2026-08-28) caught this: it made "this test runs
          # on every CI integration job" false exactly while an unrelated
          # earlier file was red. Run every file regardless of prior
          # failures, then fail the job only after all of them have run.
          script: |
            failed=0
            for f in integration_test/*_test.dart; do
              echo "=== $f ==="
              flutter test "$f" --reporter=expanded || failed=1
            done
            exit $failed

  # CT-1. Cheap on purpose: a contract check and a rule set, not a training
  # run. §26 of the CT-1 brief is explicit that expensive training must not
  # ride on every commit, and there is nothing to train here anyway -- the
  # champion is deterministic. What this job protects is the part that CAN
  # rot silently: the label ontology's refusal to train on machine output, and
  # the dataset builder's reproducibility.
  ct1-content-qa:
    name: CT-1 content QA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # Runs FIRST on purpose. It reconciles the project's recorded state
      # against the tree and regenerates core/CURRENT_STATE.md to compare it
      # byte for byte. Everything below tests whether the code works; this
      # tests whether what we SAY about the code is still true, which is the
      # failure that went undetected for weeks and prompted the module.
      - name: Current-state ledger — recorded state against source
        run: python -m pytest scripts/review/test_state_ledger.py -q

      - name: Label contract, baseline, builder, evaluation
        run: python -m pytest scripts/ct1/test_ct1.py -q

      # The human-label acquisition path, in four named steps rather than one.
      #
      # Folded together, a red X says "CT-1 broke". Split, it says which
      # protection stopped working -- and these four fail for entirely
      # different reasons, none of which is recoverable by rerunning.
      - name: Review batch — blindness and sampling
        run: python -m pytest scripts/ct1/test_review_batch.py -q

      - name: Review import — refusals and adjudication
        run: python -m pytest scripts/ct1/test_review_import.py -q

      # The reviewer's page is where blindness either holds or fails, because
      # it is the only artefact a reviewer actually opens. Scanned as rendered
      # bytes, not as intent.
      - name: Review interface — blindness of the generated page
        run: python -m pytest scripts/ct1/test_review_app.py -q

      - name: Leakage guards and the evaluation dataset
        run: python -m pytest scripts/ct1/test_leakage.py scripts/ct1/test_human_eval.py -q

      - name: Post-label pipeline — the gates, and the stage it will not run
        run: python -m pytest scripts/ct1/test_pipeline.py -q

      # Runs the whole IMPORT -> ... -> CHALLENGER_DECISION chain on generated
      # data. It is the only way the seven stages can be seen to work before a
      # human label comes back, and it must keep working while nobody is
      # looking. Exit 0 means GO on the fixture, which is a statement about the
      # WIRING and not about any real model.
      - name: The pipeline runs end to end on synthetic fixtures
        run: python scripts/ct1/pipeline.py --fixtures

      - name: ML lifecycle, dataset registry and training-run manifests
        run: python -m pytest scripts/ml/test_ml_contracts.py -q

      # P0 equipment-identity gates (recognition baseline, ML provenance,
      # source rights registry, functional-type snapshot). Includes the
      # deliberately-broken-input cases T3 of P0.G4 requires: a fixture
      # exact-model referencing a nonexistent primaryTypeId/supportedTypeId
      # must fail the suite, not pass silently.
      - name: Equipment identity — P0 baseline, provenance, rights, type snapshot
        run: python -m pytest scripts/equipment_identity/ -q

      # ML-2a. Runs everywhere; the cases needing D:/tools/equipment-model skip
      # with a stated reason rather than asserting nothing quietly.
      - name: Scanner provenance -- the pin, and what it cannot verify here
        run: python -m pytest scripts/ml/test_scanner_provenance.py -q

      # The model registry quotes measured numbers inline AND names the report
      # they came from. Nothing checked the two agree, and a citation is what
      # makes a hand-copied figure look verified. Exit 1 on drift; an
      # unreadable source is reported, not failed.
      - name: Model registry claims match their cited reports
        run: |
          python -m pytest scripts/ml/test_evaluation_report.py -q
          python scripts/ml/evaluation_report.py

      # Separate from CT-1's suite on purpose. The two review paths are kept
      # apart in the tree because a content reviewer must never be able to
      # produce a clinical claim, and folding their checks into one step would
      # make a clinical regression read as "CT-1 broke".
      - name: Clinical review — structure, provenance and the worklist
        run: python -m pytest scripts/review/test_clinical_import.py -q

      # The clinician-facing sheet must still describe the catalogue. If an
      # exercise is edited and the worklist is not regenerated, a review in
      # flight is reviewing content that moved -- and the refusal distinguishes
      # a stale blank sheet (regenerate) from a RETURNED review committed over
      # it (do not regenerate; that would destroy a clinician's work).
      - name: The checked-in clinical worklist matches the catalogue
        run: python scripts/review/clinical_import.py --verify core/review/worklist

      # Same argument as the dataset check below: a rebuild that does not
      # reproduce the committed batch means the row assignments a reviewer is
      # working from cannot be regenerated, and a lost package would have to be
      # reconstructed from somebody's memory.
      #
      # All FOUR artefacts, not just the two a reviewer opens. `sealed` is the
      # ground truth every precision and recall figure is computed against, and
      # the manifest carries the stratum populations the whole estimator is
      # weighted by -- a drift in either leaves items.json identical and the
      # metrics wrong. Raised in gate review, where the first version of this
      # step compared only items and assignments.
      - name: The committed review batch is the one this code builds
        run: |
          python scripts/ct1/review_batch.py --out /tmp/ct1review
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts/ct1")
          # The batch id comes from the module rather than being spelled here,
          # so renaming it cannot leave this step silently checking a directory
          # that no longer exists.
          from review_batch import BATCH_ID
          root = f"core/ml/review/{BATCH_ID.lower()}"
          rebuilt = f"/tmp/ct1review/{BATCH_ID.lower()}"
          for name in ("items.json", "assignments.json", "manifest.json",
                       "sealed_baseline_labels.json"):
              a = json.load(open(f"{root}/{name}", encoding="utf-8"))
              b = json.load(open(f"{rebuilt}/{name}", encoding="utf-8"))
              if name == "manifest.json":
                  # `source_commit` records the HEAD the batch was built at and
                  # is expected to differ on every rebuild. Everything else in
                  # the manifest is a claim about the batch and must not.
                  a.pop("source_commit", None)
                  b.pop("source_commit", None)
              if a != b:
                  sys.exit(
                      f"{name} drifted. Either the catalogue changed without "
                      "the batch being rebuilt, or selection/assignment stopped "
                      "being deterministic -- and a reviewer's package can no "
                      "longer be regenerated from the batch."
                  )
          print(f"{BATCH_ID} reproduces: items, assignments, manifest, sealed")
          PY

      # A rebuild that does not reproduce the committed hash means the pipeline
      # is not reproducible, whatever the manifest claims. Compared against the
      # checked-in manifest rather than against a second run in the same job:
      # two runs of the same code agreeing proves determinism, not that the
      # artefact in the repository is the one this code produces.
      - name: The committed dataset is the one this code builds
        run: |
          python scripts/ct1/build_dataset.py --out /tmp/ct1
          python - <<'PY'
          import json, sys
          a = json.load(open("core/ml/datasets/content_qa_catalogue_v1/manifest.json", encoding="utf-8"))
          b = json.load(open("/tmp/ct1/content_qa_catalogue_v1/manifest.json", encoding="utf-8"))
          if a["dataset_hash"] != b["dataset_hash"]:
              sys.exit(
                  "dataset_hash drifted: committed %s, rebuilt %s.\n"
                  "Either the catalogue changed without the dataset being "
                  "rebuilt, or the builder stopped being deterministic."
                  % (a["dataset_hash"], b["dataset_hash"])
              )
          print("dataset_hash matches:", a["dataset_hash"])
          PY

  dependency-scan:
    name: dart/flutter dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    # MVP1.G3 OBS-1 item 2: the backend already fails CI on a known-vulnerable
    # npm dependency (`functions.yml`'s `audit` job); the Flutter/Dart side had
    # no equivalent -- an asymmetry flagged by security review in
    # core/MASTER_PLAN_2026-08-26.md Sec8 item 6. OSV-Scanner (Google-maintained,
    # queries the same osv.dev database `npm audit` itself surfaces
    # advisories from) reads `pubspec.lock` directly and exits non-zero on any
    # known vulnerability -- this step is not informational, a failure here
    # fails the job. The binary version is pinned rather than "latest" so a
    # scanner update cannot silently change what this job accepts.
    steps:
      - uses: actions/checkout@v4

      - name: install osv-scanner (pinned v2.5.1)
        run: |
          curl -sL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: scan pubspec.lock for known vulnerabilities
        run: osv-scanner --lockfile=pubspec.lock

  ru-en-drift:
    name: RU/EN translation semantic drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # MVP1.G3 OBS-1 item 7: key parity between app_en.arb/app_ru.arb is
    # already structurally enforced by l10n.yaml's `nullable-getter: false`
    # (Flutter's own codegen fails on a missing key) -- that catches a
    # MISSING translation, not a WRONG one. This job runs the meaning-drift
    # heuristics in scripts/ci/check_ru_en_drift.js: a self-test proves the
    # checker actually distinguishes a semantically acceptable translation
    # from an intentionally meaning-corrupted one first, then the real check
    # runs against the corpus with an expiry-dated grandfather baseline for
    # the ~1200 pre-existing pairs that predate this check
    # (scripts/ci/ru_en_drift_baseline.json) -- see that file's own header
    # for why grandfathering here is not a permanent suppression.
    steps:
      - uses: actions/checkout@v4

      - name: self-test -- acceptable vs. meaning-corrupted fixtures
        run: node scripts/ci/test_check_ru_en_drift.js

      - name: check app_en.arb / app_ru.arb for new semantic drift
        run: node scripts/ci/check_ru_en_drift.js
