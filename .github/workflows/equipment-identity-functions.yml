name: equipment-identity-functions

# Deliberately its own workflow file, not a job inside functions-build in
# flutter.yml -- P0.G6's whole point is that a break in this package must
# never share a pipeline, a job, or a build step with the default Functions
# codebase that stripeWebhook lives in. See
# core/equipment_identity/p0/P0_G6_DEPLOYMENT_ISOLATION.md.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (equipment-identity codebase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions-equipment-identity

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions-equipment-identity/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions-equipment-identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions-equipment-identity/package-lock.json
      - run: npm ci
      # Same pattern as functions.yml's audit job: --omit=dev so a jest/
      # ts-jest advisory doesn't train people to ignore a red build, and
      # --package-lock-only so npm audits the LOCKFILE tree rather than the
      # installed one (which still contains dev packages --omit=dev meant
      # to exclude). This codebase currently pulls in the same two runtime
      # deps as the default codebase (firebase-admin, firebase-functions),
      # so an advisory here would be exactly the kind that runs in a
      # deployed function, same reasoning functions.yml documents.
      - name: production dependencies, high and above
        run: npm audit --omit=dev --package-lock-only --audit-level=high

  deployment-isolation-verification:
    name: deployment isolation proof (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Install functions dependencies (default codebase)
        working-directory: functions
        run: npm ci

      - name: Install functions-equipment-identity dependencies
        working-directory: functions-equipment-identity
        run: npm ci

      # The actual P0.G6 acceptance test: a deliberately-broken identity
      # module must fail to compile while the default (Stripe) codebase
      # still builds clean. See scripts/equipment_identity/
      # verify_deployment_isolation.py and its test suite.
      - name: Deployment isolation -- broken identity module cannot block Stripe
        run: python -m pytest scripts/equipment_identity/test_deployment_isolation.py -q
