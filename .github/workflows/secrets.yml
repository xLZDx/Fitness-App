# MVP1.G3 OBS-1 item 5 -- secret scanning including Git history.
#
# The prior mechanism (scripts/review/state_ledger.py's
# roboflow_key_not_committed) is a narrow, single-pattern check that only
# scans currently-tracked files at HEAD -- a key committed then later removed
# would pass it while still being exposed in history. This job is a
# general-purpose scanner (gitleaks) run against the FULL commit history, not
# just the tip, closing that gap. It stays alongside the Roboflow check
# rather than replacing it -- state_ledger.py's own tests and callers are
# unrelated to this workflow.
name: secrets

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 04:30 UTC -- after functions.yml's 04:15 nightly audit, same reasoning:
    # the OSV/GHSA advisory database gitleaks' own rules draw from updates on
    # its own schedule, not on ours, so a quiet week still needs a run.
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Load-bearing: the whole point of this job is history, not just
          # the tip. A shallow checkout would make this job silently
          # equivalent to a current-tree-only scan.
          fetch-depth: 0

      - name: install gitleaks (pinned v8.30.1)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # .gitleaksignore at the repo root documents every currently-known
      # finding by fingerprint, with a reason per entry (false positive, or a
      # real-but-already-reported exposure awaiting operator action). A
      # fingerprint not in that file fails this job -- new drift, not silent
      # accumulation.
      - name: scan full history for secrets
        run: gitleaks git . --redact
