 on driving through the heel of your front foot to engage your glutes and quadriceps effectively", "Maintain a slight forward lean to help with balance and ensure proper form throughout the exercise"], "equipment_id": "plyo_box", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте в нескольких футах перед скамьей или возвышенной поверхностью, спиной к ней. Поставьте левую стопу позади себя на скамью, верхней частью стопы опираясь на поверхность.", "Поставьте правую стопу твердо на пол, на удобном расстоянии перед скамьей.", "Опустите тело, сгибая правое колено и бедро, сохраняя туловище прямым, пока правое бедро не станет параллельно полу.", "Оттолкнитесь правой пяткой, чтобы вернуться в исходное положение. Повторите желаемое количество повторений, затем поменяйте ноги."], "summary": "Встаньте в нескольких футах перед скамьей или возвышенной поверхностью, спиной к ней. Поставьте левую стопу позади себя на скамью, верхней частью стопы опираясь на поверхность.", "tips": ["Держите переднее колено на одной линии с носками, чтобы избежать ненужной нагрузки на колено.", "Сосредоточьтесь на отталкивании пяткой передней ноги, чтобы эффективно задействовать ягодицы и квадрицепсы.", "Сохраняйте небольшой наклон вперед, чтобы помочь с балансом и обеспечить правильную форму на протяжении всего упражнения."], "title": "Болгарский сплит-присед с собственным весом (правая нога)"}}, {"item_id": "ea_cable_preacher_curl", "source_content_version": "e4d437d7523ed49f6ef5f49ec333eed2", "title": "Cable Preacher Curl", "summary": "Sit on the preacher bench with your feet flat on the floor. Attach a straight bar to the low pulley of a cable machine and grasp the bar with both hands, shoulder-width apart, palms facing upwards", "steps": ["Sit on the preacher bench with your feet flat on the floor. Attach a straight bar to the low pulley of a cable machine and grasp the bar with both hands, shoulder-width apart, palms facing upwards", "Position your upper arms on the preacher bench pad and extend your arms fully, holding the bar", "Curl the bar towards your shoulders by bending your elbows, squeezing your biceps at the top of the movement", "Lower the bar back to the starting position, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Exhale as you curl the bar up and inhale as you lower it back down", "Maintain a neutral wrist position to prevent strain", "Focus on squeezing your biceps at the top of the movement"], "equipment_id": "cable_machine", "muscles": ["biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью Скотта, поставив стопы на пол. Прикрепите прямой гриф к нижнему блоку тросового тренажера и возьмитесь за гриф обеими руками, на ширине плеч, ладонями вверх.", "Расположите предплечья на подушке скамьи Скотта и полностью выпрямите руки, держа гриф.", "Сгибайте гриф к плечам, сгибая локти, сокращая бицепсы в верхней точке движения.", "Опустите гриф обратно в исходное положение, полностью выпрямляя руки. Повторите желаемое количество повторений."], "summary": "Сядьте на скамью Скотта, поставив стопы на пол. Прикрепите прямой гриф к нижнему блоку тросового тренажера и возьмитесь за гриф обеими руками, на ширине плеч, ладонями вверх.", "tips": ["Выдыхайте, когда сгибаете гриф вверх, и вдыхайте, когда опускаете его обратно.", "Сохраняйте нейтральное положение запястья, чтобы избежать напряжения.", "Сосредоточьтесь на сокращении бицепсов в верхней точке движения."], "title": "Сгибание на бицепс на скамье Скотта на блоке"}}, {"item_id": "ea_chair_feet_elevated_glute_bridge", "source_content_version": "5ff3bd4b28c233f87f52fa4a75aacea5", "title": "Chair Feet Elevated Glute Bridge", "summary": "Lie on your back with both heels placed on the edge of a chair, legs bent at a 90-degree angle", "steps": ["Lie on your back with both heels placed on the edge of a chair, legs bent at a 90-degree angle", "Position your arms by your sides with your palms facing down for stability", "Engage your core and glutes, then lift your hips off the floor", "Hold the position briefly at the top, squeezing your glutes, then slowly lower your hips back to the floor. Repeat for the desired number of repetitions"], "tips": ["Ensure your heels remain firmly on the chair to provide a stable base for the movement", "Perform the movement slowly and with control to maximize muscle activation and prevent injury", "Focus on squeezing your glutes at the top of the movement to enhance muscle engagement"], "equipment_id": null, "muscles": ["glutes", "hamstrings", "quads", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, поставив обе пятки на край стула, ноги согнуты под углом 90 градусов.", "Расположите руки вдоль тела ладонями вниз для устойчивости.", "Напрягите мышцы кора и ягодицы, затем поднимите бёдра от пола.", "Задержитесь ненадолго в верхней точке, сжимая ягодицы, затем медленно опустите бёдра обратно на пол. Повторите желаемое количество повторений."], "summary": "Лягте на спину, поставив обе пятки на край стула, ноги согнуты под углом 90 градусов.", "tips": ["Убедитесь, что пятки прочно стоят на стуле, чтобы обеспечить стабильную основу для движения.", "Выполняйте движение медленно и подконтрольно, чтобы максимально задействовать мышцы и предотвратить травмы.", "Сосредоточьтесь на сжатии ягодиц в верхней точке движения для усиления мышечной активации."], "title": "Ягодичный мост со стопами на стуле"}}, {"item_id": "ea_barbell_power_clean", "source_content_version": "3e5aec645032af5b3c133abbb766d0d7", "title": "Barbell Power Clean", "summary": "Begin in a squatted position with your feet hip-width apart, holding a barbell with an overhand grip (palms facing your body), hands slightly wider than shoulder-width apart. The barbell should be resting on the floor", "steps": ["Begin in a squatted position with your feet hip-width apart, holding a barbell with an overhand grip (palms facing your body), hands slightly wider than shoulder-width apart. The barbell should be resting on the floor", "Explosively extend your hips and knees while pulling the barbell up towards your chest, keeping it close to your body. As the barbell passes your knees, shrug your shoulders and continue to pull the barbell upward", "As the bar reaches its highest point, pull yourself under it, re-bending your knees into a partial squat as you rotate your elbows around the bar, and catch it in a front rack position with your elbows pointing forward. Stand up out of the catch to complete the lift", "Lower the barbell back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Focus on an explosive hip extension to generate the necessary force for the clean", "Engage your shoulders and traps during the shrug to assist in lifting the barbell", "Use your legs and hips rather than relying solely on your arms to lift the barbell", "Practice the movement with lighter weights to perfect your form before progressing to heavier loads"], "equipment_id": "barbell", "muscles": ["quads", "glutes", "hamstrings", "traps", "shoulders", "forearms", "biceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Начните из положения приседа, ноги на ширине бедер, держа штангу прямым хватом (ладони обращены к телу), руки чуть шире плеч. Штанга должна лежать на полу.", "Взрывным движением разогните бедра и колени, одновременно подтягивая штангу к груди, держа ее близко к телу. Когда штанга пройдет колени, пожмите плечами и продолжайте тянуть штангу вверх.", "Когда штанга дойдёт до верхней точки, уходите под неё, повторно сгибая колени в полуприсед, и одновременно проведите локти вокруг грифа, принимая штангу во фронтальную стойку локтями вперёд. Встаньте из положения приёма, завершая подъём.", "Контролируемо опустите штангу обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Начните из положения приседа, ноги на ширине бедер, держа штангу прямым хватом (ладони обращены к телу), руки чуть шире плеч. Штанга должна лежать на полу.", "tips": ["Сосредоточьтесь на взрывном разгибании бедер, чтобы создать необходимую силу для подъема на грудь.", "Задействуйте плечи и трапеции во время пожимания плечами, чтобы помочь поднять штангу.", "Используйте ноги и бедра, а не только руки, для подъема штанги.", "Практикуйте движение с более легкими весами, чтобы отточить технику, прежде чем переходить к более тяжелым нагрузкам."], "title": "Силовой подъем штанги на грудь"}}, {"item_id": "ea_straight_bar_cable_row_normal_grip", "source_content_version": "f67dabfbbebbabd217abd59292a81afb", "title": "Straight Bar Cable Row Normal Grip", "summary": "Sit at a cable row machine with your feet placed on the footrests and knees slightly bent. Grasp the straight bar with hands just wider than shoulder-width, palms facing down", "steps": ["Sit at a cable row machine with your feet placed on the footrests and knees slightly bent. Grasp the straight bar with hands just wider than shoulder-width, palms facing down", "Engage your core and maintain a neutral spine. Pull the bar towards your abdomen, squeezing your shoulder blades together and keeping your elbows close to your body", "Hold the contraction for a moment, feeling the muscles in your back activating", "Slowly extend your arms to return the bar to the starting position. Repeat for the desired number of repetitions"], "tips": ["Breathe steadily: exhale as you pull the bar towards you and inhale as you extend your arms", "Adjust the weight on the cable machine to provide enough challenge without compromising form", "Keep your shoulders relaxed and avoid shrugging them towards your ears"], "equipment_id": "seated_row_machine", "muscles": ["lats", "biceps", "forearms", "shoulders", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на тренажер для тяги блока к поясу, поставив стопы на упоры и слегка согнув колени. Возьмитесь за прямой гриф хватом чуть шире плеч, ладонями вниз.", "Напрягите корпус и держите спину в нейтральном положении. Тяните гриф к животу, сводя лопатки вместе и держа локти близко к телу.", "Задержитесь в сокращенном положении на мгновение, чувствуя активацию мышц спины.", "Медленно выпрямите руки, чтобы вернуть гриф в исходное положение. Повторите желаемое количество повторений."], "summary": "Сядьте на тренажер для тяги блока к поясу, поставив стопы на упоры и слегка согнув колени. Возьмитесь за прямой гриф хватом чуть шире плеч, ладонями вниз.", "tips": ["Дышите ровно: выдыхайте, когда тянете гриф к себе, и вдыхайте, когда выпрямляете руки.", "Отрегулируйте вес на блочном тренажере, чтобы обеспечить достаточную нагрузку без ущерба для техники.", "Держите плечи расслабленными и избегайте их подъема к ушам."], "title": "Тяга блока к поясу прямым грифом обычным хватом"}}, {"item_id": "ea_plate_good_morning_anterior", "source_content_version": "a23d9dc6409b7287d3d480fc585f0882", "title": "Plate Good Morning Anterior", "summary": "Hold a light plate with straight arms out in front of your chest", "steps": ["Hold a light plate with straight arms out in front of your chest", "Stand with feet hip width apart and soften the knees", "Push your hips straight back and lower your chest toward the floor", "Keep the arms extended and the back completely flat", "Stop at a strong hamstring stretch, then squeeze the glutes to stand"], "tips": [], "equipment_id": "weight_plates", "muscles": ["quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Блин на вытянутых руках делает тот же наклон гораздо тяжелее для спины, потому что вес находится дальше от таза. Берите лёгкий блин — здесь работает рычаг, а не масса.", "steps": ["Держите лёгкий блин на прямых руках перед грудью", "Стопы на ширине таза, колени слегка согнуты", "Отведите таз строго назад и опускайте грудь к полу", "Руки остаются вытянутыми, спина полностью прямой", "Остановитесь на сильном растяжении задней поверхности бедра и выпрямитесь ягодицами"], "summary": "Держите лёгкий блин на прямых руках перед грудью", "title": "Наклоны «Доброе утро» с диском (передний вариант)"}}, {"item_id": "ea_captains_chair_straight_leg_raise", "source_content_version": "012c95ffecb631c06b74f550be99f6a0", "title": "Captains Chair Straight Leg Raise", "summary": "Stand on the platform of the captain's chair and place your forearms on the arm pads, gripping the handles for stability. Allow your legs to hang straight down", "steps": ["Stand on the platform of the captain's chair and place your forearms on the arm pads, gripping the handles for stability. Allow your legs to hang straight down", "Engage your core and keep your back pressed against the back pad", "Raise your legs straight up in front of you until they are parallel to the floor, keeping them as straight as possible", "Slowly lower your legs back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Keep your back pressed against the back pad to prevent swinging and maintain proper form", "Avoid using momentum; the movement should be controlled and deliberate", "Exhale as you raise your legs and inhale as you lower them back down"], "equipment_id": "captains_chair", "muscles": ["core", "lower_back", "quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте на платформу римского стула, положите предплечья на подлокотники, держась за рукоятки для стабильности. Позвольте ногам свободно свисать вниз.", "Напрягите пресс и держите спину прижатой к спинке.", "Поднимите прямые ноги перед собой, пока они не станут параллельны полу, держа их максимально прямыми.", "Медленно и подконтрольно опустите ноги обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Встаньте на платформу римского стула, положите предплечья на подлокотники, держась за рукоятки для стабильности. Позвольте ногам свободно свисать вниз.", "tips": ["Держите спину прижатой к спинке, чтобы предотвратить раскачивание и сохранить правильную форму.", "Избегайте использования инерции; движение должно быть контролируемым и целенаправленным.", "Выдыхайте, поднимая ноги, и вдыхайте, опуская их обратно."], "title": "Подъём прямых ног в римском стуле"}}, {"item_id": "ea_heavy_bag_sled_drag", "source_content_version": "a8db6d6ef4144ec35055902ce87e8b5f", "title": "Heavy Bag Sled Drag", "summary": "Attach a strap from the bag or sled and hold one end in each hand", "steps": ["Attach a strap from the bag or sled and hold one end in each hand", "Face the load and lean back slightly with your arms straight", "Keep your chest up and your stomach braced", "Walk backwards with short steps, pulling the load toward you", "Cover the set distance, then reset and go again"], "tips": [], "equipment_id": "punching_bag", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Протяжка спиной вперёд нагружает именно переднюю поверхность бёдер, и, поскольку уступающей фазы нет, она позволяет тяжело нагрузить колени с относительно небольшой крепатурой после. Именно поэтому приём иногда включают в программы реабилитации колена под наблюдением — но любое реабилитационное применение должен вести специалист, а не эта страница.", "steps": ["Закрепите лямку на мешке или санях и возьмите по концу в каждую руку", "Встаньте лицом к грузу и слегка отклонитесь назад, руки прямые", "Грудь поднята, живот напряжён", "Идите назад короткими шагами, подтягивая груз к себе", "Пройдите заданное расстояние, вернитесь и повторите"], "summary": "Закрепите лямку на мешке или санях и возьмите по концу в каждую руку", "title": "Перетаскивание саней с тяжелым мешком"}}, {"item_id": "ea_dumbbell_incline_one_arm_lateral_raise", "source_content_version": "ad9be2be0834670900e377f91b4d0699", "title": "Dumbbell Incline One Arm Lateral Raise", "summary": "Set an incline bench to a 45-degree angle and lie on your side with your lower arm resting on the bench. Hold a dumbbell with your upper hand, arm extended at your side with your palm facing your body", "steps": ["Set an incline bench to a 45-degree angle and lie on your side with your lower arm resting on the bench. Hold a dumbbell with your upper hand, arm extended at your side with your palm facing your body", "Raise the dumbbell up in an arc motion until your arm is straight at shoulder level", "Lower the dumbbell back to the starting position with control. Repeat for the desired number of repetitions, then switch to the other side"], "tips": ["Exhale as you lift the dumbbell and inhale as you lower it", "Hold the bench edge with your free hand to supportyour body during the exercise", "Maintain a slight bend in your elbow throughout the movement to reduce strain on the joint"], "equipment_id": "bench_press", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Установите наклонную скамью под углом 45 градусов и лягте на бок, нижняя рука лежит на скамье. Держите гантель верхней рукой, рука вытянута в сторону, ладонь обращена к телу.", "Поднимите гантель вверх дугообразным движением, пока рука не выпрямится на уровне плеча.", "Контролируемо опустите гантель обратно в исходное положение. Повторите желаемое количество повторений, затем поменяйте сторону."], "summary": "Установите наклонную скамью под углом 45 градусов и лягте на бок, нижняя рука лежит на скамье. Держите гантель верхней рукой, рука вытянута в сторону, ладонь обращена к телу.", "tips": ["Выдыхайте, поднимая гантель, и вдыхайте, опуская ее.", "Держитесь свободной рукой за край скамьи, чтобы поддерживать тело во время упражнения.", "Сохраняйте небольшой сгиб в локте на протяжении всего движения, чтобы уменьшить нагрузку на сустав."], "title": "Подъём гантели в сторону одной рукой на наклонной скамье"}}, {"item_id": "ea_chest_dip_weighted_slow", "source_content_version": "5a8443ac6080d65032f917439748c600", "title": "Chest Dip Weighted Slow", "summary": "Grip the dip bars firmly with your palms facing inward and your arms fully extended. Position your body slightly forward, with your legs bent and crossed at the ankles, holding weights", "steps": ["Grip the dip bars firmly with your palms facing inward and your arms fully extended. Position your body slightly forward, with your legs bent and crossed at the ankles, holding weights", "Slowly lower your body by bending your elbows, allowing them to flare out slightly to the sides. Lower yourself in a controlled manner until your upper arms are parallel to the floor", "Push through your palms to slowly extend your elbows and lift your body back to the starting position. Maintain the forward lean throughout the movement to keep the focus on your chest muscles", "Repeat the movement for the desired number of repetitions, maintaining a slow and controlled pace throughout the exercise"], "tips": ["Ensure your body remains slightly forward to maximize chest activation and minimize strain on your shoulders", "Use a weight that allows you to perform the exercise with proper form and control", "Perform both the lowering and lifting phases slowly to increase muscle engagement and control", "Avoid locking your elbows at the top of the movement; maintain a slight bend to keep tension on your muscles"], "equipment_id": "dip_station", "muscles": ["chest", "shoulders", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Крепко возьмитесь за брусья ладонями внутрь, полностью выпрямив руки. Расположите тело слегка вперёд, согнув ноги и скрестив лодыжки, удерживая отягощение.", "Медленно опустите тело, сгибая локти, позволяя им слегка расходиться в стороны. Опускайтесь подконтрольно, пока ваши плечи не станут параллельны полу.", "Оттолкнитесь ладонями, чтобы медленно выпрямить локти и поднять тело обратно в исходное положение. Сохраняйте наклон вперёд на протяжении всего движения, чтобы сосредоточить нагрузку на грудных мышцах.", "Повторите движение желаемое количество повторений, сохраняя медленный и контролируемый темп на протяжении всего упражнения."], "summary": "Крепко возьмитесь за брусья ладонями внутрь, полностью выпрямив руки. Расположите тело слегка вперёд, согнув ноги и скрестив лодыжки, удерживая отягощение.", "tips": ["Убедитесь, что ваше тело остаётся слегка наклонённым вперёд, чтобы максимально задействовать грудные мышцы и минимизировать нагрузку на плечи.", "Используйте такой вес, который позволяет выполнять упражнение с правильной техникой и контролем.", "Выполняйте как фазу опускания, так и фазу подъёма медленно, чтобы увеличить мышечную активацию и контроль.", "Избегайте блокировки локтей в верхней точке движения; сохраняйте лёгкий сгиб, чтобы поддерживать напряжение в мышцах."], "title": "Медленные отжимания на брусьях на грудь с отягощением"}}, {"item_id": "ea_barbell_snatch_pull", "source_content_version": "b080e556311f8239afb2e9df8caec4ff", "title": "Barbell Snatch Pull", "summary": "Start in a squat position with your feet shoulder-width apart, toes pointed slightly outward. Hold the barbell with a wide overhand grip (palms facing down), hands placed wider than shoulder-width apart. The barbell should be on the floor, close to your shins", "steps": ["Start in a squat position with your feet shoulder-width apart, toes pointed slightly outward. Hold the barbell with a wide overhand grip (palms facing down), hands placed wider than shoulder-width apart. The barbell should be on the floor, close to your shins", "Lift the barbell off the floor by extending your hips and knees simultaneously, keeping the barbell close to your body", "As the barbell reaches hip level, explosively extend your hips, knees, and ankles while pulling the barbell upward. Focusing on pulling the barbell up to abdomen height by driving your elbows upward and outward", "Lower the barbell back to the starting position with control, bending your hips and knees. Repeat for the desired number of repetitions"], "tips": ["Keep the barbell close to your body throughout the lift to maximize efficiency and control", "Explode through your hips and knees to generate the power needed for the lift", "Focus on a strong, controlled pull to ensure proper form and muscle engagement"], "equipment_id": "barbell", "muscles": ["quads", "glutes", "shoulders", "hamstrings", "traps", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте в позицию приседа, поставив стопы на ширине плеч, носки слегка разведены в стороны. Возьмите штангу широким хватом сверху (ладони смотрят вниз), руки расположены шире плеч. Штанга должна находиться на полу, близко к голеням.", "Поднимите штангу с пола, одновременно разгибая бёдра и колени, держите штангу близко к телу.", "Когда штанга достигнет уровня бёдер, взрывным движением разогните бёдра, колени и голеностопы, одновременно подтягивая штангу вверх. Сосредоточьтесь на подъёме штанги до уровня живота, направляя локти вверх и в стороны.", "Контролируемо опустите штангу обратно в исходное положение, сгибая бёдра и колени. Повторите желаемое количество повторений."], "summary": "Встаньте в позицию приседа, поставив стопы на ширине плеч, носки слегка разведены в стороны. Возьмите штангу широким хватом сверху (ладони смотрят вниз), руки расположены шире плеч. Штанга должна находиться на полу, близко к голеням.", "tips": ["Держите штангу близко к телу на протяжении всего подъёма для максимальной эффективности и контроля.", "Взрывно разгибайте бёдра и колени, чтобы сгенерировать необходимую для подъёма мощность.", "Сосредоточьтесь на сильной, контролируемой тяге для обеспечения правильной техники и включения мышц."], "title": "Рывковая тяга штанги"}}, {"item_id": "ea_dumbbell_overhead_lunge", "source_content_version": "5278c05dc381e6af092201cc20a12fd8", "title": "Dumbbell Overhead Lunge", "summary": "Stand with your feet hip-width apart, holding a dumbbell in each hand. Extend your arms fully overhead with your palms facing each other", "steps": ["Stand with your feet hip-width apart, holding a dumbbell in each hand. Extend your arms fully overhead with your palms facing each other", "Step forward with your right foot, lowering your hips until both knees are bent at approximately 90 degrees. Your back knee should hover just above the floor", "Push through your front heel to return to the starting position, maintaining the dumbbells overhead throughout the movement", "Alternate legs and repeat the movement for the desired number of repetitions"], "tips": ["Maintain a controlled motion to prevent any wobbling or loss of balance", "Avoid leaning forward; keep your torso upright throughout the exercise", "Inhale as you step forward and lower into the lunge, and exhale as you push back to the starting position"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "shoulders", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширину бёдер, держа по гантели в каждой руке. Полностью вытяните руки над головой, ладонями друг к другу.", "Сделайте шаг вперёд правой ногой, опуская бёдра, пока оба колена не согнутся примерно на 90 градусов. Заднее колено должно находиться чуть выше пола.", "Оттолкнитесь передней пяткой, чтобы вернуться в исходное положение, удерживая гантели над головой на протяжении всего движения.", "Чередуйте ноги и повторите движение желаемое количество повторений."], "summary": "Встаньте, расставив стопы на ширину бёдер, держа по гантели в каждой руке. Полностью вытяните руки над головой, ладонями друг к другу.", "tips": ["Сохраняйте контролируемое движение, чтобы предотвратить шатание или потерю равновесия.", "Избегайте наклона вперёд; держите корпус прямо на протяжении всего упражнения.", "Вдыхайте, делая шаг вперёд и опускаясь в выпад, и выдыхайте, отталкиваясь обратно в исходное положение."], "title": "Выпад с гантелями над головой"}}, {"item_id": "ea_dumbell_burpee", "source_content_version": "16d5722edbc71911c80d8d8234726a78", "title": "Dumbell Burpee", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand. Lower the dumbbells to the floor as you squat down, placing them shoulder-width apart", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand. Lower the dumbbells to the floor as you squat down, placing them shoulder-width apart", "Jump your feet back into a plank position, keeping your body in a straight line from head to heels", "Jump your feet back towards the dumbbells, landing in a squat position. As you stand up, lift the dumbbells off the floor", "Jump up explosively, extending your arms overhead with the dumbbells. Land softly and immediately lower the dumbbells back to the floor to start the next repetition"], "tips": ["Land softly on your feet to minimize impact on your joints", "Keep your feet hip-width apart for stability during the plank and jump phases", "Start with lighter weights to get comfortable with the movement, then gradually increase the weight"], "equipment_id": "dumbbell", "muscles": ["quads", "shoulders", "chest", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа по гантели в каждой руке. Опустите гантели на пол, приседая, расположив их на ширине плеч.", "Отпрыгните ногами назад в положение планки, держа тело в прямой линии от головы до пяток.", "Отпрыгните ногами обратно к гантелям, приземляясь в положение приседа. Вставая, поднимите гантели с пола.", "Взрывно подпрыгните вверх, вытягивая руки с гантелями над головой. Мягко приземлитесь и немедленно опустите гантели обратно на пол, чтобы начать следующее повторение."], "summary": "Встаньте, поставив стопы на ширине плеч, держа по гантели в каждой руке. Опустите гантели на пол, приседая, расположив их на ширине плеч.", "tips": ["Мягко приземляйтесь на стопы, чтобы минимизировать нагрузку на суставы.", "Держите стопы на ширине бёдер для устойчивости во время фаз планки и прыжка.", "Начните с более лёгких весов, чтобы освоиться с движением, затем постепенно увеличивайте вес."], "title": "Бёрпи с гантелями"}}, {"item_id": "ea_ski_ergometer_cross_country_ski_alternating_arm_pulls", "source_content_version": "8dd89d1ff7563ecfca873894dea6c8b2", "title": "Ski Ergometer Cross Country Ski Alternating Arm Pulls", "summary": "Stand in front of the ski ergometer machine with your feet shoulder-width apart, holding the handles above you with both hands", "steps": ["Stand in front of the ski ergometer machine with your feet shoulder-width apart, holding the handles above you with both hands", "Begin by pulling one handle down towards your hip by extending your elbow downward", "Alternate the movement by pulling the opposite handle down towards your hip while bending the other arm upward, mimicking a skiing motion", "Continue alternating the arm pull movements at a steady pace. Repeat for the desired duration or number of repetitions"], "tips": ["Breathe steadily and rhythmically to maintain oxygen flow during the exercise", "Adjust the resistance level if needed to provide a challenging but manageable workout", "Use a full range of motion with the handles to engage your upper body muscles effectively"], "equipment_id": "ski_erg", "muscles": ["shoulders", "traps", "lats", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте перед ски-эргометром, поставив стопы на ширине плеч, держа рукоятки обеими руками над собой.", "Начните тянуть одну рукоятку вниз к бедру, выпрямляя локоть вниз.", "Попеременно тяните противоположную рукоятку вниз к бедру, сгибая другую руку вверх, имитируя лыжный ход.", "Продолжайте попеременные тяги руками в равномерном темпе. Повторяйте в течение желаемого времени или количества повторений."], "summary": "Встаньте перед ски-эргометром, поставив стопы на ширине плеч, держа рукоятки обеими руками над собой.", "tips": ["Дышите ровно и ритмично, чтобы поддерживать приток кислорода во время упражнения.", "При необходимости отрегулируйте уровень сопротивления, чтобы тренировка была сложной, но выполнимой.", "Используйте полную амплитуду движения с рукоятками, чтобы эффективно задействовать мышцы верхней части тела."], "title": "Ски-эргометр: Попеременные тяги руками"}}, {"item_id": "ea_suspension_trainer_with_grips_reverse_push_up", "source_content_version": "171e4b5bf4067ab1b9a7720be88ea723", "title": "Suspension Trainer with Grips Reverse Push-up", "summary": "Adjust the suspension trainer handles close to the floor. Grasp the handles with an underhand grip (palms facing forward) and position your body in a straight line, feet together and arms fully extended", "steps": ["Adjust the suspension trainer handles close to the floor. Grasp the handles with an underhand grip (palms facing forward) and position your body in a straight line, feet together and arms fully extended", "Engage your core and maintain a straight line from your head to your heels", "Lower your chest towards the handles by bending your elbows, keeping your body straight and elbows close to your sides", "Press through your hands to extend your arms and return to the starting position. Repeat for the desired number of repetitions"], "tips": ["Perform the movement with a steady and controlled tempo to maximize muscle engagement and prevent injury", "Breathe steadily: exhale as you push up and inhale as you lower your body", "Ensure your wrists are under your shoulders to maintain proper alignment"], "equipment_id": "trx", "muscles": ["chest", "triceps", "shoulders", "core", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Отрегулируйте рукоятки петель для функционального тренинга близко к полу. Возьмитесь за рукоятки нижним хватом (ладони смотрят вперёд) и расположите тело по прямой линии, стопы вместе, руки полностью выпрямлены.", "Напрягите пресс и сохраняйте прямую линию от головы до пяток.", "Опустите грудь к рукояткам, сгибая локти, сохраняя тело прямым и локти близко к бокам.", "Упритесь руками, чтобы выпрямить руки и вернуться в исходное положение. Повторите желаемое количество повторений."], "summary": "Отрегулируйте рукоятки петель для функционального тренинга близко к полу. Возьмитесь за рукоятки нижним хватом (ладони смотрят вперёд) и расположите тело по прямой линии, стопы вместе, руки полностью выпрямлены.", "tips": ["Выполняйте движение в ровном и контролируемом темпе, чтобы максимально задействовать мышцы и предотвратить травмы.", "Дышите ровно: выдыхайте при отжимании и вдыхайте при опускании тела.", "Убедитесь, что ваши запястья находятся под плечами для поддержания правильного выравнивания."], "title": "Обратные отжимания в петлях для функционального тренинга"}}, {"item_id": "ea_air_bike_version_2", "source_content_version": "d34880591e23c80e4c5e68b42c7f61df", "title": "Air Bike (version 2)", "summary": "Lie on your back with your hands behind your head and your knees bent at a 90-degree angle", "steps": ["Lie on your back with your hands behind your head and your knees bent at a 90-degree angle", "Lift your shoulders off the floor, engaging your core", "Bring your right elbow towards your left knee while extending your right leg straight", "Switch sides, bringing your left elbow towards your right knee while extending your left leg straight. Continue alternating sides in a pedaling motion"], "tips": ["Keep your core engaged throughout the exercise to maximize muscle activation and protect your lower back", "Perform the movement slowly and with control, avoiding the use of momentum to maximize effectiveness", "Breathe steadily, exhaling as you twist and bring your elbow to your knee, and inhaling as you switch sides"], "equipment_id": null, "muscles": ["core", "lower_back", "quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, руки за головой, колени согнуты под углом 90 градусов.", "Поднимите плечи от пола, напрягая мышцы кора.", "Потяните правый локоть к левому колену, выпрямляя правую ногу.", "Поменяйте стороны, потянув левый локоть к правому колену и выпрямляя левую ногу. Продолжайте чередовать стороны, имитируя движение педалей."], "summary": "Лягте на спину, руки за головой, колени согнуты под углом 90 градусов.", "tips": ["Держите мышцы кора напряжёнными на протяжении всего упражнения, чтобы максимально задействовать мышцы и защитить поясницу.", "Выполняйте движение медленно и подконтрольно, избегая использования инерции для максимальной эффективности.", "Дышите ровно, выдыхая при скручивании и подтягивании локтя к колену, и вдыхая при смене сторон."], "title": "Скручивания «велосипед» (вариант 2)"}}, {"item_id": "ea_circles_knee_stretch", "source_content_version": "e3dd407db52c3a093538507b4a3d549a", "title": "Circles Knee Stretch", "summary": "Begin by standing with your feet together and knees slightly bent. Place your hands on your hips for support", "steps": ["Begin by standing with your feet together and knees slightly bent. Place your hands on your hips for support", "Keeping your knees together, bend them together and slowly rotate them in a circular motion to the right, making small controlled circles", "Continue circling your knees for the desired number of repetitions, then reverse the direction of the circles and rotate to the left", "Maintain a steady pace and keep your upper body relaxed throughout the exercise"], "tips": ["Focus on making smooth and controlled movements to avoid straining your knees and joints", "Perform the movement slowly to maintain control and improve knee mobility", "Ensure your knees remain close together to maximize the effectiveness of the stretch"], "equipment_id": null, "muscles": ["quads", "hamstrings", "calves", "lower_back"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте, ноги вместе, колени слегка согнуты. Положите руки на бедра для опоры.", "Держа колени вместе, согните их вместе и медленно вращайте их по кругу вправо, выполняя небольшие подконтрольные круги.", "Продолжайте вращать коленями желаемое количество повторений, затем измените направление кругов и вращайте влево.", "Поддерживайте постоянный темп и держите верхнюю часть тела расслабленной на протяжении всего упражнения."], "summary": "Встаньте, ноги вместе, колени слегка согнуты. Положите руки на бедра для опоры.", "tips": ["Сосредоточьтесь на выполнении плавных и подконтрольных движений, чтобы избежать перенапряжения коленей и суставов.", "Выполняйте движение медленно, чтобы сохранить контроль и улучшить подвижность коленей.", "Убедитесь, что колени остаются близко друг к другу, чтобы максимизировать эффективность растяжки."], "title": "Круговая растяжка коленей"}}, {"item_id": "ea_dumbbell_standing_wide_simultaneous_biceps_curl", "source_content_version": "2cf60dec17eda173fe4a90e9d2ec471c", "title": "Dumbbell Standing Wide Simultaneous Biceps Curl", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing slightly outwards and your arms extended down by your sides. Position your arms slightly wider than your shoulders", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing slightly outwards and your arms extended down by your sides. Position your arms slightly wider than your shoulders", "Curl both dumbbells diagonally upward simultaneously by bending your elbows, keeping your upper arms stationary", "Squeeze your biceps at the top of the movement when the dumbbells reach shoulder height", "Lower the dumbbells back to the starting position with control, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Keep your upper arms stationary; only your forearms should move", "Avoid swinging the dumbbells; use a controlled motion", "Exhale as you curl the dumbbells up and inhale as you lower them"], "equipment_id": "dumbbell", "muscles": ["biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа гантель в каждой руке ладонями слегка наружу, руки выпрямлены вниз по бокам. Расположите руки немного шире плеч.", "Одновременно согните обе гантели по диагонали вверх, сгибая локти, держите плечи неподвижными.", "Сократите бицепсы в верхней точке движения, когда гантели достигнут высоты плеч.", "Контролируемо опустите гантели обратно в исходное положение, полностью выпрямляя руки. Повторите желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, держа гантель в каждой руке ладонями слегка наружу, руки выпрямлены вниз по бокам. Расположите руки немного шире плеч.", "tips": ["Держите плечи неподвижными; двигаться должны только предплечья.", "Избегайте раскачивания гантелей; используйте контролируемое движение.", "Выдыхайте, сгибая гантели вверх, и вдыхайте, опуская их."], "title": "Одновременное широкое сгибание на бицепс с гантелями стоя"}}, {"item_id": "ea_dumbbell_seated_alternate_front_raise", "source_content_version": "ee68c3d990bcf3cd0302fa72c7acdab5", "title": "Dumbbell Seated Alternate Front Raise", "summary": "Sit on a bench with your feet flat on the floor and your spine neutral, holding a dumbbell in each hand with your arms hanging at your sides, palms facing your thighs", "steps": ["Sit on a bench with your feet flat on the floor and your spine neutral, holding a dumbbell in each hand with your arms hanging at your sides, palms facing your thighs", "Raise your right arm straight in front of you to shoulder height while rotating the dumbbell to face down, keeping a slight bend in your elbow", "Lower your right arm back to the starting position", "Repeat by alternating arms for the desired number of repetitions"], "tips": ["Exhale as you raise each dumbbell and inhale as you lower it", "Avoid swinging your body or using momentum; focus on controlled movements", "Keep a slight bend in your elbows to reduce strain on your joints"], "equipment_id": "bench_press", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью, стопы на полу, спина в нейтральном положении, держа гантель в каждой руке, руки опущены по бокам, ладони обращены к бёдрам.", "Поднимите правую руку прямо перед собой до уровня плеч, поворачивая гантель ладонью вниз, сохраняя небольшой сгиб в локте.", "Опустите правую руку обратно в исходное положение.", "Повторите, чередуя руки, желаемое количество повторений."], "summary": "Сядьте на скамью, стопы на полу, спина в нейтральном положении, держа гантель в каждой руке, руки опущены по бокам, ладони обращены к бёдрам.", "tips": ["Выдыхайте при подъёме каждой гантели и вдыхайте при опускании.", "Избегайте раскачивания тела или использования инерции; сосредоточьтесь на контролируемых движениях.", "Сохраняйте небольшой сгиб в локтях, чтобы уменьшить нагрузку на суставы."], "title": "Попеременный подъём гантелей перед собой сидя"}}, {"item_id": "ea_lawnmower_row", "source_content_version": "a2dd22eac80e7a50a690d597aa95e79e", "title": "Lawnmower Row", "summary": "Stand in a split stance with a dumbbell in the hand opposite your front foot", "steps": ["Stand in a split stance with a dumbbell in the hand opposite your front foot", "Rest your free hand on the front thigh and hinge forward with a neutral spine", "Let the dumbbell hang low and slightly across your body", "Pull it up past your ribs while opening the chest toward the working side", "Lower it slowly back across the body, then finish the set and switch sides"], "tips": [], "equipment_id": "dumbbell", "muscles": ["back"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Название от движения при запуске газонокосилки, и польза та же: тренируется тяга с лёгким разворотом всего тела — так вы и тянете вещи в жизни, а не в зале.", "steps": ["Встаньте в разножку, гантель в руке, разноимённой передней ноге", "Свободную ладонь положите на переднее бедро и наклонитесь вперёд, сохраняя нейтральное положение позвоночника", "Гантель висит низко и немного поперёк тела", "Тяните её вверх мимо рёбер, раскрывая грудь в сторону рабочей руки", "Медленно опустите обратно поперёк тела, доделайте подход и смените сторону"], "summary": "Встаньте в разножку, гантель в руке, разноимённой передней ноге", "title": "Тяга гантели в наклоне «газонокосильщик»"}}, {"item_id": "ea_cobra_yoga_pose_hold", "source_content_version": "8ac7c0d618683ddc7a89cea0512c68f1", "title": "Cobra Yoga Pose Hold", "summary": "Begin by lying face down on the floor with your legs extended straight behind you and your hands placed at shoulder level, palms flat on the floor", "steps": ["Begin by lying face down on the floor with your legs extended straight behind you and your hands placed at shoulder level, palms flat on the floor", "Engage your core and press through your palms to lift your chest off the floor, straightening your arms to come into the cobra position, keeping your hips on the floor", "Hold the cobra position, keeping your arms straight and your chest lifted, while breathing steadily"], "tips": ["Perform the movement with control, ensuring a smooth and steady rise into the cobra position", "Ensure your shoulders remain down and away from your ears to avoid unnecessary strain", "Breathe deeply and steadily throughout the exercise, inhaling as you lift your chest and exhaling as you hold the position", "Keep your hips on the floor during the cobra hold to maintain proper form and maximize the stretch in your lower back and abdomen"], "equipment_id": null, "muscles": ["chest", "shoulders", "triceps", "traps", "lower_back"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте лицом вниз на пол, вытянув ноги прямо назад, а руки расположите на уровне плеч, ладонями на полу.", "Напрягите пресс и оттолкнитесь ладонями, чтобы поднять грудь от пола, выпрямляя руки, чтобы принять положение кобры, держа бедра на полу.", "Удерживайте положение кобры, держа руки  прямыми и позволяйте плечам растягиваться по мере опускания.", "Удерживайте растяжку 15-30 секунд, чувствуя растяжение в плечах и груди. Медленно выпрямите ноги, чтобы вернуться в исходное положение."], "summary": "Встаньте прямо, поставив ноги на ширине плеч, спиной к ящику или поверхности на уровне бедер.", "tips": ["Выполняйте растяжку на устойчивой, нескользящей поверхности для обеспечения безопасности и предотвращения скольжения.", "Держите плечи расслабленными и опущенными от ушей, чтобы максимально растянуть мышцы.", "Убедитесь, что ваши руки надежно расположены на ящике, чтобы предотвратить скольжение."], "title": "Растяжка плеч назад"}}, {"item_id": "ea_barbell_standing_back_wrist_curl", "source_content_version": "63781ff86318d40fd921e4cd778d836a", "title": "Barbell Standing Back Wrist Curl", "summary": "Stand with your feet shoulder-width apart, holding a barbell behind your back with an overhand grip (palms facing backward), hands slightly wider than shoulder-width apart. Your arms should be fully extended, and the barbell should rest against your glutes", "steps": ["Stand with your feet shoulder-width apart, holding a barbell behind your back with an overhand grip (palms facing backward), hands slightly wider than shoulder-width apart. Your arms should be fully extended, and the barbell should rest against your glutes", "Flex your wrists to curl the barbell upward, bringing the barbell toward your forearms", "Hold the contraction at the top for a moment, squeezing your forearm muscles", "Slowly lower the barbell back to the starting position by extending your wrists. Repeat for the desired number of repetitions"], "tips": ["Avoid using your arms or shoulders to lift the barbell; focus on your wrist movement", "Breathe steadily, exhaling as you curl the barbell up and inhaling as you lower it back down", "Use a weight that allows for proper form and control throughout the exercise to prevent strain or injury"], "equipment_id": "barbell", "muscles": ["forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, удерживая штангу за спиной хватом сверху (ладони смотрят назад), руки чуть шире плеч. Руки должны быть полностью выпрямлены, а штанга должна лежать на ягодицах.", "Согните запястья, чтобы поднять штангу вверх, приближая её к предплечьям.", "Задержитесь в верхней точке на мгновение, сжимая мышцы предплечий.", "Медленно опустите штангу обратно в исходное положение, разгибая запястья. Повторите желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, удерживая штангу за спиной хватом сверху (ладони смотрят назад), руки чуть шире плеч. Руки должны быть полностью выпрямлены, а штанга должна лежать на ягодицах.", "tips": ["Избегайте использования рук или плеч для подъёма штанги; сосредоточьтесь на движении запястий.", "Дышите ровно, выдыхая при подъёме штанги и вдыхая при её опускании.", "Используйте вес, который позволяет выполнять упражнение с правильной техникой и контролем, чтобы предотвратить напряжение или травму."], "title": "Сгибание запястий со штангой за спиной стоя"}}, {"item_id": "ea_side_bend_standing_lats_stretch", "source_content_version": "4c349b9fe968049280c9b1ee6fa57586", "title": "Side Bend Standing Lats Stretch", "summary": "Stand tall with your feet hip width apart", "steps": ["Stand tall with your feet hip width apart", "Reach one arm straight overhead and hold the wrist with the other hand", "Lengthen upward first, then bend to the opposite side", "Keep both feet flat and your hips facing forward", "Hold for twenty seconds, then come back up and do the other side"], "tips": [], "equipment_id": null, "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "Раскрывает всю боковую поверхность тела от таза до кисти, включая широчайшие и межрёберные мышцы. Занимает десять секунд и не требует инвентаря, поэтому делать легко и часто.", "steps": ["Встаньте прямо, стопы на ширине таза", "Вытяните одну руку над головой и возьмитесь за запястье второй рукой", "Сначала вытянитесь вверх, затем наклонитесь в противоположную сторону", "Обе стопы прижаты к полу, таз развёрнут вперёд", "Удерживайте двадцать секунд, вернитесь и сделайте другую сторону"], "summary": "Встаньте прямо, стопы на ширине таза", "title": "Растяжка широчайших мышц спины в наклоне в сторону стоя"}}, {"item_id": "ea_sled_battle_rope_pull", "source_content_version": "eb5611395139306b8090fe3c11cfe400", "title": "Sled Battle Rope Pull", "summary": "Attach a rope to a loaded sled and sit or stand at the far end", "steps": ["Attach a rope to a loaded sled and sit or stand at the far end", "Take the rope in both hands and set your feet firmly", "Brace your stomach and keep your spine neutral", "Pull the rope hand over hand, drawing the sled toward you", "Keep pulling without pausing until the sled reaches you, then reset"], "tips": [], "equipment_id": "battle_ropes", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Подтягивание саней к себе перехватами нагружает всю спину вообще без уступающей фазы, поэтому на следующий день оно обычно даёт меньше крепатуры, чем упражнения с уступающей фазой, и позволяет выполнять большой объём. Первыми обычно заканчиваются хват и дыхание.", "steps": ["Прикрепите канат к нагруженным саням и сядьте или встаньте на другом конце", "Возьмите канат двумя руками и устойчиво поставьте стопы", "Напрягите живот, спину держите в нейтральном положении", "Тяните канат перехватами, подтягивая сани к себе", "Тяните без пауз, пока сани не дойдут, затем вернитесь в исходное"], "summary": "Прикрепите канат к нагруженным саням и сядьте или встаньте на другом конце", "title": "Тяга саней с канатом"}}, {"item_id": "ea_barbell_good_morning", "source_content_version": "9aee124631ffc99699b67b70e75a5228", "title": "Barbell Good Morning", "summary": "Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with you h through your heels to maximize power and stability", "Ensure your knees track over your toes to prevent knee strain"], "equipment_id": "kettlebell", "muscles": ["quads", "glutes", "adductors", "shoulders", "hamstrings", "traps", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Поставьте гирю на пол между стопами. Встаньте, расставив ноги шире плеч, носки слегка развёрнуты наружу.", "Наклонитесь в тазобедренных суставах и согните колени, чтобы опустить тело, дотянитесь до рукоятки гири обеими руками, сохраняя спину в нейтральном положении и грудь поднятой.", "Оттолкнитесь пятками, чтобы поднять гирю с пола, одновременно разгибая бёдра и колени. Достигнув положения стоя, взрывным движением подтяните гирю вверх к подбородку, сгибая локти и направляя их наружу.", "Подконтрольно опустите гирю обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Поставьте гирю на пол между стопами. Встаньте, расставив ноги шире плеч, носки слегка развёрнуты наружу.", "tips": ["Используйте вес, который позволяет вам сохранять правильную технику на протяжении всего упражнения.", "Отталкивайтесь пятками, чтобы максимизировать мощность и стабильность.", "Убедитесь, что колени двигаются над носками, чтобы предотвратить нагрузку на колени."], "title": "Сумо становая тяга с гирей и протяжкой"}}, {"item_id": "ea_barbell_palm_down_wrist_curl_over_a_bench", "source_content_version": "10b09b873a0280ec0a2b28d36df256af", "title": "Barbell Palm Down Wrist Curl Over a Bench", "summary": "Kneel in front of a flat bench, holding a barbell with both hands, palms facing down (overhand grip). Rest your forearms on the bench with your wrists hanging over the edge and allow them to hang down", "steps": ["Kneel in front of a flat bench, holding a barbell with both hands, palms facing down (overhand grip). Rest your forearms on the bench with your wrists hanging over the edge and allow them to hang down", "Curl your wrists upward, lifting the barbell as high as you can control while keeping your forearms flat on the bench", "Slowly lower the barbell back to the starting position with control", "Repeat for the desired number of repetitions"], "tips": ["Avoid using your forearms or upper arms to lift the weight; the movement should come from your wrists", "Keep your shoulders relaxed and avoid tensing them during the exercise", "Maintain a steady pace to ensure consistent tension in the muscles"], "equipment_id": "bench_press", "muscles": ["forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте на колени перед горизонтальной скамьей, держа штангу обеими руками прямым хватом. Положите предплечья на скамью так, чтобы запястья свисали с края, и позвольте им свободно опуститься.", "Согните запястья вверх, поднимая штангу на максимальную высоту, которую можете контролировать, при этом предплечья должны оставаться плотно прижатыми к скамье.", "Медленно и под контролем опустите штангу обратно в исходное положение.", "Повторите желаемое количество повторений."], "summary": "Встаньте на колени перед горизонтальной скамьей, держа штангу обеими руками прямым хватом. Положите предплечья на скамью так, чтобы запястья свисали с края, и позвольте им свободно опуститься.", "tips": ["Избегайте использования предплечий или плеч для подъема веса; движение должно исходить от запястий.", "Держите плечи расслабленными и избегайте их напряжения во время упражнения.", "Поддерживайте равномерный темп, чтобы обеспечить постоянное напряжение в мышцах."], "title": "Сгибание запястий со штангой прямым хватом на скамье"}}]}</script>
<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const KEY = 'ct1:' + P.batch_id + ':' + P.slot;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
let cur = 0;

// Quotes are escaped too, although no vendor-controlled value currently
// reaches an attribute. Every `="${...}"` slot below interpolates a code
// constant or a loop index, and a test pins those vocabularies to
// `[a-z][a-z0-9_]*` so a quote cannot appear in one -- that is what makes the
// attribute contexts safe. This is the belt: it means the property survives
// somebody adding a catalogue field to an attribute later, rather than
// depending on nobody doing so.
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rec(id) {
  if (!state[id]) state[id] = { answers: {}, reason_codes: [], note: '',
                                needs_domain_review: false, review_status: null };
  return state[id];
}
function complete(id) {
  const r = state[id];
  if (!r) return false;
  if (r.review_status === 'SKIPPED') return true;
  return P.questions.every(q => r.answers[q.id]);
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); paintNav(); }

function paintNav() {
  const n = document.getElementById('nav');
  n.innerHTML = P.items.map((it, i) =>
    `<button data-i="${i}" class="${complete(it.item_id) ? 'done' : ''} ${i === cur ? 'cur' : ''}">`
    + `${i + 1}. ${esc(it.title || it.item_id)}</button>`).join('');
  const done = P.items.filter(it => complete(it.item_id)).length;
  document.getElementById('progress').textContent =
    done + ' / ' + P.items.length + ' answered';
}

function paint() {
  const it = P.items[cur], r = rec(it.item_id);
  const ru = it.ru || {};
  const list = (label, arr) => (arr && arr.length)
    ? `<h3>${label}</h3><ol>${arr.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '';
  document.getElementById('content').innerHTML =
    `<h2>${esc(it.title)}</h2>`
    + `<p class="muted">${esc(it.item_id)}</p>`
    + (it.summary ? `<p>${esc(it.summary)}</p>` : '')
    + list('Steps', it.steps)
    + ((it.tips && it.tips.length)
        ? `<h3>Tips</h3><ul>${it.tips.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '')
    + `<h3>Metadata</h3><dl>`
    + `<dt>Equipment</dt><dd>${esc(it.equipment_id) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Muscles</dt><dd>${esc((it.muscles || []).join(', ')) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Difficulty</dt><dd>${esc(it.difficulty) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Stretch</dt><dd>${it.is_stretch ? 'yes' : 'no'}</dd></dl>`
    + `<h3>Russian</h3>`
    + (Object.keys(ru).length
        ? `<p><b>${esc(ru.title)}</b></p>` + (ru.summary ? `<p>${esc(ru.summary)}</p>` : '')
          + list('', ru.steps)
        : `<p class="muted">no Russian row</p>`);

  document.getElementById('questions').innerHTML = P.questions.map(q =>
    `<div class="q"><p>${esc(q.text)}</p><div class="opts">`
    + P.verdicts.map(v =>
        `<label><input type="radio" name="${q.id}" value="${v.id}"`
        + `${r.answers[q.id] === v.id ? ' checked' : ''}><span>${esc(v.text)}</span></label>`
      ).join('')
    + `</div></div>`).join('');

  document.getElementById('reasons').innerHTML = P.reasons.map(c =>
    `<label><input type="checkbox" value="${c.id}"`
    + `${r.reason_codes.includes(c.id) ? ' checked' : ''}> ${esc(c.text)}</label>`).join('');

  document.getElementById('note').value = r.note || '';
  document.getElementById('domain').checked = !!r.needs_domain_review;
  document.getElementById('pos').textContent = (cur + 1) + ' of ' + P.items.length;
  paintNav();
  window.scrollTo(0, 0);
}

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cur = +b.dataset.i; paint();
});
document.getElementById('questions').addEventListener('change', e => {
  const r = rec(P.items[cur].item_id);
  r.answers[e.target.name] = e.target.value;
  r.review_status = 'COMPLETE';
  save();
});
document.getElementById('reasons').addEventListener('change', () => {
  const r = rec(P.items[cur].item_id);
  r.reason_codes = [...document.querySelectorAll('#reasons input:checked')].map(i => i.value);
  save();
});
document.getElementById('note').addEventListener('input', e => {
  rec(P.items[cur].item_id).note = e.target.value; save();
});
document.getElementById('domain').addEventListener('change', e => {
  rec(P.items[cur].item_id).needs_domain_review = e.target.checked; save();
});
document.getElementById('skip').addEventListener('click', () => {
  const r = rec(P.items[cur].item_id);
  r.review_status = 'SKIPPED'; r.answers = {};
  save(); paint();
});
document.getElementById('prev').addEventListener('click', () => {
  if (cur > 0) { cur--; paint(); }
});
document.getElementById('next').addEventListener('click', () => {
  if (cur < P.items.length - 1) { cur++; paint(); }
});

document.getElementById('export').addEventListener('click', () => {
  const now = new Date().toISOString();
  const reviews = [];
  for (const it of P.items) {
    const r = state[it.item_id];
    if (!r || !r.review_status) continue;   // never opened: stays UNKNOWN
    const status = r.review_status === 'SKIPPED' ? 'SKIPPED'
      : (P.questions.every(q => r.answers[q.id]) ? 'COMPLETE' : null);
    if (!status) continue;                  // partially answered: not a review
    reviews.push({
      item_id: it.item_id,
      source_content_version: it.source_content_version,
      review_timestamp: r.at || now,
      review_status: status,
      answers: status === 'SKIPPED' ? {} : r.answers,
      reason_codes: r.reason_codes || [],
      note: r.note || '',
      needs_domain_review: !!r.needs_domain_review
    });
  }
  const who = document.getElementById('who').value.trim();
  const out = {
    batch_id: P.batch_id,
    review_schema_version: P.review_schema_version,
    reviewer: who,
    reviewer_slot: P.slot,
    reviewer_kind: 'HUMAN',
    submitted_at: now,
    reviews: reviews
  };
  const text = JSON.stringify(out, null, 2);
  const box = document.getElementById('out');
  box.value = text; box.hidden = false; box.select();
  const a = document.getElementById('dl');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = P.batch_id + '.' + (who || P.slot) + '.json';
  a.hidden = false;
  document.getElementById('exportnote').textContent =
    reviews.length + ' of ' + P.items.length + ' rows returned. Rows you did '
    + 'not open are absent from the file and count as NOT REVIEWED, not as clean.';
});

paint();
</script>
</body>
</html>
