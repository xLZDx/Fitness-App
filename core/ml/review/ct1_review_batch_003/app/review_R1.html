:root{--bg:#fbfaf7;--fg:#1c1b19;--muted:#6b6862;--line:#ddd9d1;--card:#fff;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);
border-bottom:1px solid var(--line);padding:10px 16px;display:flex;
gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
.grow{flex:1}
.muted{color:var(--muted)}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;
align-items:start}
nav{border-right:1px solid var(--line);height:calc(100vh - 46px);
overflow:auto;position:sticky;top:46px;background:var(--card)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;
padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;
border-left:3px solid transparent;color:var(--muted)}
nav button.done{color:var(--fg)}
nav button.cur{border-left-color:var(--accent);background:#eef2f6;color:var(--fg)}
main{padding:20px 24px 80px;max-width:74ch}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;
padding:16px 18px;margin:0 0 16px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
color:var(--muted);margin:16px 0 6px;font-weight:650}
ol,ul{margin:0;padding-left:22px}
li{margin:3px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;
font-size:14px}
dt{color:var(--muted)}
dd{margin:0}
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:14px;padding:3px 12px;
cursor:pointer;font-size:14px;user-select:none}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.opts label:has(input[value=ok]:checked){background:var(--ok);color:#fff;
border-color:var(--ok)}
.opts label:has(input[value=problem]:checked){background:var(--prob);color:#fff;
border-color:var(--prob)}
.opts label:has(input[value=unsure]:checked){background:var(--uns);color:#fff;
border-color:var(--uns)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:2px 14px;font-size:14px}
.reasons label{cursor:pointer}
textarea{width:100%;min-height:72px;font:inherit;padding:8px;
border:1px solid var(--line);border-radius:4px;background:var(--bg);
color:var(--fg);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button.act{font:inherit;padding:6px 14px;border-radius:4px;cursor:pointer;
border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme:dark){
:root{--bg:#16181a;--fg:#e8e6e1;--muted:#9a968e;--line:#33363a;--card:#1e2124;
--ok:#4e9a6b;--prob:#c05a45;--uns:#a3894b;--accent:#7aa2c8}
nav button.cur{background:#242a31}
}
</style>
</head>

hem with your hands while keeping your elbows on the floor", "steps": ["Lie on your back and lift your hips off the floor, supporting them with your hands while keeping your elbows on the floor", "Perform a bicycle motion with your legs by extending your right leg straight forward while bending your left knee towards the floor", "Switch legs by extending your left leg straight forward and bending your right knee towards the floor, continuing the bicycle motion", "Maintain a controlled and steady pace throughout the exercise"], "tips": ["Ensure your hands are firmly supporting your lower back to maintain proper alignment and stability", "Focus on engaging your core muscles to control the movement of your legs and prevent lower back strain", "Ensure your movements are smooth and controlled to maximize muscle activation and prevent injury"], "equipment_id": null, "muscles": ["core", "lower_back", "quads", "hamstrings"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на спину и поднимите бёдра от пола, поддерживая их руками, при этом локти остаются на полу.", "Выполняйте движение «велосипед» ногами, выпрямляя правую ногу вперёд и сгибая левое колено к полу.", "Поменяйте ноги, выпрямляя левую ногу вперёд и сгибая правое колено к полу, продолжая движение «велосипед».", "Поддерживайте контролируемый и равномерный темп на протяжении всего упражнения."], "summary": "Лягте на спину и поднимите бёдра от пола, поддерживая их руками, при этом локти остаются на полу.", "tips": ["Убедитесь, что руки надёжно поддерживают поясницу, чтобы сохранить правильное положение и стабильность.", "Сосредоточьтесь на задействовании мышц кора для контроля движения ног и предотвращения нагрузки на поясницу.", "Убедитесь, что ваши движения плавные и подконтрольные, чтобы максимально задействовать мышцы и предотвратить травмы."], "title": "Велосипед ногами в воздухе"}}, {"item_id": "ea_seated_dumbbell_one_arm_shoulder_press", "source_content_version": "291c93849074f465654cee126d940658", "title": "Seated Dumbbell One Arm Shoulder Press", "summary": "Sit on a bench with back support, holding a dumbbell in your right hand at shoulder height, palm facing forward. Keep your spine neutral and feet flat on the floor", "steps": ["Sit on a bench with back support, holding a dumbbell in your right hand at shoulder height, palm facing forward. Keep your spine neutral and feet flat on the floor", "Press the dumbbell upward until your arm is fully extended overhead, keeping your wrist straight", "Lower the dumbbell back to shoulder height with control", "Repeat for the desired number of repetitions, then switch to your left arm and repeat"], "tips": ["Avoid arching your back; keep it pressed against the backrest of the bench", "Move the dumbbell in a straight line to maximize muscle engagement", "Exhale as you press the dumbbell up and inhale as you lower it"], "equipment_id": "bench_press", "muscles": ["shoulders", "triceps", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью со спинкой, держа гантель в правой руке на уровне плеча, ладонью вперёд. Держите спину в нейтральном положении, а стопы — на полу.", "Выжмите гантель вверх, пока рука полностью не выпрямится над головой, держа запястье прямо.", "Медленно опустите гантель обратно до уровня плеча.", "Повторите желаемое количество повторений, затем поменяйте руку и повторите."], "summary": "Сядьте на скамью со спинкой, держа гантель в правой руке на уровне плеча, ладонью вперёд. Держите спину в нейтральном положении, а стопы — на полу.", "tips": ["Избегайте прогиба в спине; держите её прижатой к спинке скамьи.", "Перемещайте гантель по прямой линии, чтобы максимально задействовать мышцы.", "Выдыхайте при жиме гантели вверх и вдыхайте при опускании."], "title": "Жим гантели одной рукой над головой сидя"}}, {"item_id": "ea_dumbbell_ab_crunch", "source_content_version": "2b46443c87a9f5fe71af5c773fb478e4", "title": "Dumbbell Ab Crunch", "summary": "Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Hold a dumbbell with both hands striaght over your chest", "steps": ["Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Hold a dumbbell with both hands striaght over your chest", "Lift your head, shoulders, and upper back off the floor by contracting your abdominal muscles", "Raise the dumbbell towards the ceiling as you perform the crunch, keeping your arms straight. Pause for a moment at the top of the movement, squeezing your abs", "Slowly lower your upper body back to the starting position, keeping control of the movement. Repeat for the desired number of repetitions"], "tips": ["Keep your lower back pressed against the floor throughout the exercise to avoid straining it", "Avoid using your neck muscles to lift your head; focus on using your abdominal muscles", "Breathe out as you lift your upper body and breathe in as you lower it"], "equipment_id": "dumbbell", "muscles": ["core", "shoulders", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, согнув колени, стопы стоят на полу на ширине бёдер. Держите гантель обеими руками прямо над грудью.", "Поднимите голову, плечи и верхнюю часть спины от пола, сокращая мышцы живота.", "Поднимите гантель к потолку, выполняя скручивание, держа руки прямо. Задержитесь на мгновение в верхней точке движения, напрягая пресс.", "Медленно опустите верхнюю часть тела обратно в исходное положение, сохраняя контроль над движением. Повторите желаемое количество повторений."], "summary": "Лягте на спину, согнув колени, стопы стоят на полу на ширине бёдер. Держите гантель обеими руками прямо над грудью.", "tips": ["Держите поясницу прижатой к полу на протяжении всего упражнения, чтобы избежать её перенапряжения.", "Избегайте использования мышц шеи для подъёма головы; сосредоточьтесь на использовании мышц живота.", "Выдыхайте, поднимая верхнюю часть тела, и вдыхайте, опуская её."], "title": "Скручивания с гантелью"}}, {"item_id": "ea_plate_clean", "source_content_version": "3e022435f96beebc85d044451f6c0ddd", "title": "Plate Clean", "summary": "Stand with the plate on the floor between your feet, held at its sides with both hands", "steps": ["Stand with the plate on the floor between your feet, held at its sides with both hands", "Hinge at the hips with a neutral spine and grip the plate low", "Drive through the floor and extend the hips hard, letting the plate float upward", "Pull yourself under it and catch it at chest height with the elbows up", "Lower it back to the floor under control rather than dropping it"], "tips": [], "equipment_id": "weight_plates", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Работа таза как во взятии штанги, но без её технической цены. Блин проще удержать, проще бросить, и он позволяет отрабатывать взрывное разгибание задолго до того, как нагруженный гриф станет разумной идеей.", "steps": ["Поставьте блин на пол между стоп и возьмитесь за него с боков двумя руками", "Наклонитесь в тазобедренном суставе со спиной в нейтральном положении, взявшись за блин снизу", "Оттолкнитесь от пола и резко разогните таз, позволяя блину пойти вверх", "Подсядьте под него и примите на уровне груди, локти вверх", "Опустите блин на пол под контролем, а не бросайте"], "summary": "Поставьте блин на пол между стоп и возьмитесь за него с боков двумя руками", "title": "Взятие диска на грудь"}}, {"item_id": "ea_dumbbell_one_arm_floor_press", "source_content_version": "d2ecc60abdf9cc55ff62362d24fafb0a", "title": "Dumbbell One Arm Floor Press", "summary": "Lie on your back on the floor with your legs straight on the floor. Hold a dumbbell in one hand with your arm extended straight up towards the ceiling, palm facing forward. Keep your free hand on the floor for support", "steps": ["Lie on your back on the floor with your legs straight on the floor. Hold a dumbbell in one hand with your arm extended straight up towards the ceiling, palm facing forward. Keep your free hand on the floor for support", "Lower the dumbbell by bending your elbow until your upper arm touches the floor, bringing your elbow at a 45-degree angle to your body", "Press the dumbbell back up to the starting position by extending your elbow, squeezing your chest at the top of the movement", "Repeat for the desired number of repetitions, then switch to the other arm"], "tips": ["Avoid letting your back arch off the floor; keep it flat and supported", "Focus on using your chest and triceps to lift the dumbbell", "Keep your wrist straight and aligned with your forearm during the exercise"], "equipment_id": "dumbbell", "muscles": ["chest", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину на пол, ноги прямые. Держите гантель в одной руке, рука вытянута прямо вверх к потолку, ладонь смотрит вперёд. Свободную руку держите на полу для опоры.", "Опустите гантель, сгибая локоть, пока плечо не коснётся пола, локоть находится под углом 45 градусов к телу.", "Выжмите гантель обратно в исходное положение, выпрямляя локоть, сжимая грудь в верхней точке движения.", "Повторите желаемое количество повторений, затем поменяйте руку."], "summary": "Лягте на спину на пол, ноги прямые. Держите гантель в одной руке, рука вытянута прямо вверх к потолку, ладонь смотрит вперёд. Свободную руку держите на полу для опоры.", "tips": ["Избегайте прогиба спины от пола; держите её ровной и поддерживаемой.", "Сосредоточьтесь на использовании мышц груди и трицепсов для подъёма гантели.", "Держите запястье прямым и на одной линии с предплечьем во время упражнения."], "title": "Жим гантели одной рукой лёжа на полу"}}, {"item_id": "ea_kettlebell_lateral_lunge", "source_content_version": "79f14305e5f27f7b3660d790037ed46b", "title": "Kettlebell Lateral Lunge", "summary": "Stand tall holding a kettlebell at your chest with both hands, feet together", "steps": ["Stand tall holding a kettlebell at your chest ctiveness of the exercise", "Exhale as you lift into the V-up position and inhale as you lower back down", "Avoid jerking or using momentum; perform the movement in a controlled manner"], "equipment_id": "dumbbell", "muscles": ["core", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, вытяните ноги прямо. Держите гантель обеими руками, вытянув руки на полу.", "Одновременно поднимите ноги, верхнюю часть тела и гантель от пола, сводя ноги и руки вместе, чтобы образовать V-образную форму.", "Тяните гантель к стопам, держа руки и ноги максимально прямыми.", "Медленно опустите ноги, верхнюю часть тела и гантель в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину, вытяните ноги прямо. Держите гантель обеими руками, вытянув руки на полу.", "tips": ["Держите руки и ноги прямыми, чтобы максимизировать эффективность упражнения.", "Выдыхайте при подъёме в V-образное положение и вдыхайте при опускании.", "Избегайте рывков и использования инерции; выполняйте движение контролируемо."], "title": "V-подъёмы с гантелью"}}, {"item_id": "ea_leg_press_wide_high_stance_behind_view", "source_content_version": "59b96a16ce9284a4f7563529246e6ce8", "title": "Leg Press Wide High Stance Behind View", "summary": "Sit on the leg press machine and position your feet just wider than shoulder-width, high in the center of the foot platform, keeping your feet flat and parallel. Adjust the seat so that your knees are bent at about a 90-degree angle", "steps": ["Sit on the leg press machine and position your feet just wider than shoulder-width, high in the center of the foot platform, keeping your feet flat and parallel. Adjust the seat so that your knees are bent at about a 90-degree angle", "Hold the handles on the sides of the seat for stability. Keep your back pressed against the backrest and your core engaged", "Press through your heels to extend your legs, pushing the platform away from you until your legs are fully extended but not locked at the knees", "Slowly return to the starting position by bending your knees with control. Repeat for the desired number of repetitions"], "tips": ["Keep your back pressed against the backrest throughout the exercise", "Ensure both feet remain flat on the platform for better stability and muscle balance", "Exhale as you press the platform away and inhale as you return to the starting position"], "equipment_id": "leg_press", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте в тренажёр для жима ногами и расположите стопы чуть шире плеч, высоко в центре платформы, держа стопы ровно и параллельно. Отрегулируйте сиденье так, чтобы колени были согнуты примерно под углом 90 градусов.", "Держитесь за рукоятки по бокам сиденья для устойчивости. Держите спину прижатой к спинке, а корпус напряжённым.", "Давите пятками, чтобы выпрямить ноги, отталкивая платформу от себя, пока ноги не будут полностью выпрямлены, но не заблокированы в коленях.", "Медленно вернитесь в исходное положение, контролируемо сгибая колени. Повторите желаемое количество повторений."], "summary": "Сядьте в тренажёр для жима ногами и расположите стопы чуть шире плеч, высоко в центре платформы, держа стопы ровно и параллельно. Отрегулируйте сиденье так, чтобы колени были согнуты примерно под углом 90 градусов.", "tips": ["Держите спину прижатой к спинке на протяжении всего упражнения.", "Убедитесь, что обе стопы остаются плотно на платформе для лучшей устойчивости и мышечного баланса.", "Выдыхайте, отталкивая платформу, и вдыхайте, возвращаясь в исходное положение."], "title": "Жим ногами в тренажёре с широкой и высокой постановкой стоп (вид сзади)"}}, {"item_id": "ea_back_extension_machine", "source_content_version": "f64456d07aa1ee40799d3fee28efa371", "title": "Back Extension Machine", "summary": "Fix your feet to the footrests and press your thighs against the padded platform", "steps": ["Fix your nd around the soles of your feet. Hold the handles with both hands, arms extended forward, palms facing each other", "Keep your spine neutral, chest up, and core engaged to stabilize your body", "Pull the handles towards your torso by bending your elbows, keeping your arms close to your body. Focus on squeezing your shoulder blades together at the peak of the movement", "Slowly extend your arms back to the starting position, maintaining control over the resistance band. Repeat for the desired number of repetitions"], "tips": ["Keep your back straight and avoid slouching to maintain proper form", "Engage your core to prevent any rocking or unnecessary movement during the exercise", "Use a controlled motion to pull and release the resistance band, avoiding jerking movements"], "equipment_id": "resistance_bands", "muscles": ["lats", "traps", "biceps", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на пол, полностью вытянув ноги и соединив стопы, закрепив резиновую ленту вокруг подошв стоп. Держите рукоятки обеими руками, вытянув руки вперёд, ладонями друг к другу.", "Держите спину в нейтральном положении, грудь приподнятой, а пресс напряжённым для стабилизации тела.", "Потяните рукоятки к туловищу, сгибая локти и держа руки близко к телу. Сосредоточьтесь на сведении лопаток вместе в верхней точке движения.", "Медленно вытяните руки обратно в исходное положение, сохраняя контроль над резиновой лентой. Повторите желаемое количество повторений."], "summary": "Сядьте на пол, полностью вытянув ноги и соединив стопы, закрепив резиновую ленту вокруг подошв стоп. Держите рукоятки обеими руками, вытянув руки вперёд, ладонями друг к другу.", "tips": ["Держите спину прямо и избегайте сутулости для поддержания правильной техники.", "Напрягите пресс, чтобы предотвратить раскачивание или ненужные движения во время упражнения.", "Используйте контролируемое движение для натяжения и ослабления резиновой ленты, избегая рывков."], "title": "Тяга резиновой ленты сидя"}}, {"item_id": "ea_pull_up_wide_grip_front_view", "source_content_version": "20271b3e9430b05088a995cb59e9a5ba", "title": "Pull Up Wide Grip Front View", "summary": "Stand beneath a pull-up bar and grasp it with an overhand grip (palms facing away from you), hands wider than shoulder-width apart", "steps": ["Stand beneath a pull-up bar and grasp it with an overhand grip (palms facing away from you), hands wider than shoulder-width apart", "Engage your back muscles to pull yourself up towards the bar by bending your elbows", "Continue pulling until your chin is above the bar, focusing on contracting your back muscles", "Lower yourself back to the starting position in a controlled manner, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Use a full range of motion, fully extending your arms at the bottom and pulling up until your chin is above the bar", "Focus on engaging your back muscles, particularly the latissimus dorsi, to perform the pull-up effectively", "Breathe steadily, exhaling as you pull up and inhaling as you lower yourself down", "Avoid using momentum to swing your body; maintain a controlled movement throughout the exercise", "Perform the exercise on a stable, secure pull-up bar to ensure safety"], "equipment_id": "pullup_bar", "muscles": ["lats", "biceps", "shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте под перекладиной и возьмитесь за нее прямым хватом (ладони от себя), руки шире плеч.", "Задействуйте мышцы спины, чтобы подтянуться к перекладине, сгибая локти.", "Продолжайте подтягиваться, пока подбородок не окажется над перекладиной, сосредоточьтесь на сокращении мышц спины.", "Медленно опуститесь в исходное положение, полностью выпрямив руки. Повторите желаемое количество повторений."], "summary": "Встаньте под перекладиной и возьмитесь за нее прямым хватом (ладони от себя), руки шире плеч.", "tips": ["Используйте полную амплитуду движения, полностью вы книтесь пятками, чтобы подняться, скользя спиной вверх по стене, пока не вернётесь в исходное положение.", "Повторите желаемое количество повторений."], "summary": "Встаньте спиной к стене, стопы на ширине плеч, примерно в 60 см от стены.", "tips": ["Убедитесь, что колени не выходят за носки, чтобы избежать излишней нагрузки на суставы.", "Дышите ровно: вдыхайте, опускаясь в присед, и выдыхайте, поднимаясь.", "Плотно прижимайте поясницу к стене для правильного выравнивания и поддержки."], "title": "Присед у стены с паузой"}}, {"item_id": "ea_dumbbell_goblet_split_squat", "source_content_version": "e7a38bae33f74b311dd09bd7728d556c", "title": "Dumbbell Goblet Split Squat", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell vertically against your chest with both hands, between your palms. Keep your elbows pointed downward", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell vertically against your chest with both hands, between your palms. Keep your elbows pointed downward", "Step your right foot forward into a split stance, ensuring your left foot remains stationary and slightly elevated on your forefoot", "Lower your body by bending both knees to approximately 90 degrees, keeping your chest up and spine neutral. Your right knee should be directly above your right ankle, and your left knee should hover just above the floor", "Push through your right heel to return to the starting position. Complete the desired number of repetitions on one side before switching to the other leg"], "tips": ["Ensure your front knee tracks over your toes and does not extend beyond them", "Maintain a straight back and avoid leaning forward or rounding your shoulders", "Focus on keeping your weight distributed evenly between both feet during the squat"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа гантель вертикально у груди обеими руками, между ладонями. Держите локти направленными вниз.", "Сделайте шаг правой ногой вперёд в положение сплит-стойки, убедившись, что левая стопа остаётся неподвижной и слегка приподнятой на носке.", "Опустите тело, согнув оба колена примерно до 90 градусов, держа грудь прямо и спину в нейтральном положении. Правое колено должно находиться прямо над правой лодыжкой, а левое колено — чуть выше пола.", "Оттолкнитесь правой пяткой, чтобы вернуться в исходное положение. Выполните желаемое количество повторений на одной стороне, прежде чем перейти к другой ноге."], "summary": "Встаньте, поставив стопы на ширине плеч, держа гантель вертикально у груди обеими руками, между ладонями. Держите локти направленными вниз.", "tips": ["Убедитесь, что переднее колено движется над носками и не выходит за них.", "Держите спину прямо и избегайте наклонов вперёд или округления плеч.", "Сосредоточьтесь на равномерном распределении веса между обеими стопами во время приседа."], "title": "Сплит-присед с гантелью у груди"}}, {"item_id": "ea_gate_pose_rounding_spine_looking_up", "source_content_version": "75fa4b62b513f065ccca227bd4059645", "title": "Gate Pose Rounding Spine Looking Up", "summary": "Kneel on one knee and extend the other leg straight out to the side, foot flat", "steps": ["Kneel on one knee and extend the other leg straight out to the side, foot flat", "Rest the same-side hand lightly on the extended leg", "Reach the opposite arm up and over toward the extended foot", "Turn your chest slightly upward and lengthen through the top ribs", "Hold for thirty seconds, breathing wide, then change sides"], "tips": [], "equipment_id": null, "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "Наклон в сторону из положения на колене, раскрывающий рёбра и боковую поверхность корпуса, а также внутреннюю поверхность бедра выпрямленной ноги. Напрямую достаёт до дыхательных мышц между рёбрами.", "steps": ["Встаньте на одно колено, вторую ногу вытяните в сторону, стопа на полу", "Одноимённую ладонь легко положите на вытянутую ногу", "Вытяните противоположную руку вверх и в сторону этой стопы", "Слегка разверните грудь вверх и вытянитесь через верхние рёбра", "Удерживайте тридцать секунд, дыша широко, затем смените сторону"], "summary": "Встаньте на одно колено, вторую ногу вытяните в сторону, стопа на полу", "title": "Поза Ворот с округлением спины и взглядом вверх"}}, {"item_id": "ea_barbell_lunges_on_the_spot", "source_content_version": "17183fa3eb00974da67a1a0b8efc336e", "title": "Barbell Lunges on the Spot", "summary": "Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with your hands shoulder-width apart, and keep your elbows pointing forward", "steps": ["Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with your hands shoulder-width apart, and keep your elbows pointing forward", "Step forward with your right leg, lowering your body until your right thigh is parallel to the floor and your left knee nearly touches the floor", "Push through your front heel to return to the starting position. Repeat the movement with the same leg"], "tips": ["Use a weight that allows for proper form and technique throughout the exercise", "Drive through the heel of your front foot to engage your glutes and quadriceps more effectively", "Keep your head up and eyes forward to maintain balance and proper form"], "equipment_id": "barbell", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширине плеч, держа штангу на верхней части спины. Возьмитесь за гриф руками на ширине плеч и держите локти направленными вперед", "Сделайте шаг вперед правой ногой, опуская тело, пока правое бедро не станет параллельно полу, а левое колено почти не коснется пола", "Оттолкнитесь пяткой передней ноги, чтобы вернуться в исходное положение. Повторите движение той же ногой"], "summary": "Встаньте, расставив стопы на ширине плеч, держа штангу на верхней части спины. Возьмитесь за гриф руками на ширине плеч и держите локти направленными вперед", "tips": ["Используйте вес, который позволяет сохранять правильную форму и технику на протяжении всего упражнения", "Отталкивайтесь пяткой передней ноги, чтобы эффективнее задействовать ягодичные мышцы и квадрицепсы", "Держите голову поднятой, а взгляд направленным вперед для поддержания баланса и правильной формы"], "title": "Выпады со штангой на месте"}}, {"item_id": "ea_standing_oblique_crunch", "source_content_version": "26ea7117be73d23d526c4344cbf64432", "title": "Standing Oblique Crunch", "summary": "Stand with your feet shoulder-width apart, placing your hands behind your head with your elbows flared out to the sides. Engage your core and maintain an upright posture", "steps": ["Stand with your feet shoulder-width apart, placing your hands behind your head with your elbows flared out to the sides. Engage your core and maintain an upright posture", "Lift your right knee towards your right elbow while simultaneously bending your torso to the right to bring your elbow and knee closer together", "Return to the starting position by lowering your right leg and straightening your torso", "Repeat the movement on the left side, lifting your left knee towards your left elbow. Continue alternating sides for the desired number of repetitions"], "tips": ["Breathe steadily: exhale as you crunch to the side and inhale as you return to the starting position", "Ensure your standing leg remains slightly bent to maintain balance", "Keep your back straight and avoid leaning forward or backward during the exercise"], "equipment_id": null, "muscles": ["core", "lower_back", "shoulders", "quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, руки за головой, локти разведены в стороны. Напрягите пресс и сохраняйте прямую осанку.", "Поднимите правое колено к правому локтю, одновременно сгибая корпус вправо, чтобы сблизить локоть и колено.", "Вернитесь в исходное положение, опуская правую ногу и выпрямляя корпус.", "Повторите движение на левую сторону, поднимая левое колено к левому локтю. Продолжайте чередовать стороны желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, руки за головой, локти разведены в стороны. Напрягите пресс и сохраняйте прямую осанку.", "tips": ["Дышите ровно: выдыхайте при скручивании в сторону и вдыхайте при возвращении в исходное положение.", "Убедитесь, что опорная нога остается слегка согнутой для сохранения равновесия.", "Держите спину прямо и избегайте наклонов вперед или назад во время упражнения."], "title": "Скручивания на косые мышцы стоя"}}, {"item_id": "ea_kettlebell_single_leg_hip_thrust", "source_content_version": "03870f159eed70f5918232c3151693a8", "title": "Kettlebell Single Leg Hip Thrust", "summary": "Sit with your upper back against a bench and one foot planted, knee bent", "steps": ["Sit with your upper back against a bench and one foot planted, knee bent", "Lift the other foot off the floor and hold that knee bent in the air", "Rest a kettlebell across the hip of the working side", "Drive through the planted heel until your body is straight from knee to shoulder", "Lower under control, keeping the hips level, then swap legs"], "tips": [], "equipment_id": "bench_press", "muscles": ["quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Скамья поднимает лопатки для большей амплитуды, а всю нагрузку несёт одна нога — это одно из самых тяжёлых упражнений на ягодицы без штанги. Удержание таза ровным — половина работы.", "steps": ["Сядьте, упершись верхом спины в скамью, одна стопа на полу, колено согнуто", "Вторую стопу оторвите от пола и удерживайте колено согнутым на весу", "Положите гирю поперёк таза со стороны рабочей ноги", "Оттолкнитесь опорной пяткой до прямой линии от колена до плеча", "Опуститесь под контролем, удерживая таз ровно, затем смените ногу"], "summary": "Сядьте, упершись верхом спины в скамью, одна стопа на полу, колено согнуто", "title": "Ягодичный мост на одной ноге с гирей"}}, {"item_id": "ea_child_pose_lower_back_stretch", "source_content_version": "7e8873d9a66e5c904cbf207c4cb6683e", "title": "Child Pose Lower Back Stretch", "summary": "Kneel on the floor with your big toes together and knees apart", "steps": ["Kneel on the floor with your big toes together and knees apart", "Sit your hips back toward your heels", "Walk your hands forward and lower your chest between your thighs", "Rest your forehead on the mat and let your shoulders relax", "Breathe into your lower back and hold for thirty seconds or longer"], "tips": [], "equipment_id": null, "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "Вытягивает поясницу и таз в положении, полностью снимающем нагрузку с позвоночника, — поэтому это стандартное место отдыха между тяжёлыми движениями или после нагрузочной тренировки.", "steps": ["Встаньте на колени, большие пальцы ног вместе, колени разведены", "Отведите таз назад к пяткам", "Переставьте ладони вперёд и опустите грудь между бёдрами", "Положите лоб на коврик и расслабьте плечи", "Дышите в поясницу и удерживайте тридцать секунд или дольше"], "summary": "Встаньте на колени, большие пальцы ног вместе, колени разведены", "title": "Поза ребенка для растяжки поясницы"}}, {"item_id": "ea_alternate_arm_leg_plank_rest_pause", "source_content_version": "6b2311272759e1d4fe534a4b3d5bdc7c", "title": "Alternate Arm Leg Plank Rest Pause", "summary": "Start in a plank position with your elbows directly under your shoulders and your body forming a straight line from head to heels", "steps": ["Start in a plank position with your elbows directly under your shoulders and your body forming a straight line from head to heels", "Lift your right arm and left leg simultaneously, extending them straight out while maintaining balance. Then lower back to the plank position and pause for a few seconds", "Lift your left arm and right leg simultaneously, extending them straight out and return to the plank position and pause for a few seconds", "Continue alternating sides, lifting opposite arms and legs with a brief pause in the plank position"], "tips": ["Keep your core engaged throughout the exercise to maintain stability and prevent your hips from sagging", "Perform the movement slowly and with control to maximize muscle engagement and maintain balance", "Breathe steadily, exhaling as you lift your arm and leg and inhaling as you pause in the plank position"], "equipment_id": null, "muscles": ["shoulders", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте в планку, расположив локти прямо под плечами, а тело образует прямую линию от головы до пяток.", "Одновременно поднимите правую руку и левую ногу, вытянув их прямо, сохраняя равновесие. Затем опуститесь обратно в планку и сделайте паузу на несколько секунд.", "Одновременно поднимите левую руку и правую ногу, вытянув их прямо, и вернитесь в планку, сделав паузу на несколько секунд.", "Продолжайте чередовать стороны, поднимая противоположные руки и ноги с короткой паузой в планке."], "summary": "Встаньте в планку, расположив локти прямо под плечами, а тело образует прямую линию от головы до пяток.", "tips": ["Держите корпус напряжённым на протяжении всего упражнения, чтобы сохранять стабильность и предотвратить провисание бёдер.", "Выполняйте движение медленно и подконтрольно, чтобы максимально задействовать мышцы и сохранять равновесие.", "Дышите ровно, выдыхая при подъёме руки и ноги и вдыхая во время паузы в планке."], "title": "Планка с попеременным подъёмом руки и ноги с паузой"}}, {"item_id": "ea_ez_barbell_anti_gravity_press", "source_content_version": "da0d37afacb0779141d333e7f296bb6f", "title": "EZ Barbell Anti Gravity Press", "summary": "Lie chest first on an incline bench, holding an EZ barbell with palms facing the floor, hands positioned shoulder-width apart. Hold the barbell close to your shoulders, just under your face, with elbows bent", "steps": ["Lie chest first on an incline bench, holding an EZ barbell with palms facing the floor, hands positioned shoulder-width apart. Hold the barbell close to your shoulders, just under your face, with elbows bent", "Press the barbell forward in a straight line until your arms are fully extended, keeping the bar parallel to the floor", "Pause briefly at the end of the movement, ensuring your arms are straight and the barbell is fully extended forward", "Return the barbell back to the starting position with control, bringing it close to your shoulders. Repeat the exercise"], "tips": ["Avoid using momentum; focus on a controlled and steady motion", "Exhale as you press the barbell forward and inhale as you lower it", "Focus on using your shoulders to press the weight, minimizing lower back involvement"], "equipment_id": "bench_press", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте грудью на наклонную скамью, держа EZ-штангу ладонями к полу, руки расположены на ширине плеч. Держите штангу близко к плечам, чуть ниже лица, локти согнуты.", "Выжмите штангу вперед по прямой линии, пока руки не будут полностью выпрямлены, удерживая гриф параллельно полу.", "Кратковременно задержитесь в конце движения, убедившись, что руки прямые, а штанга полностью вытянута вперед.", "Подконтрольно верните штангу в исходное положение, приближая ее к плечам. Повторите упражнение."], "summary": "Лягте грудью на наклонную скамью, держа EZ-штангу ладонями к полу, руки расположены на ширине плеч. Держите штангу близко к плечам, чуть ниже лица, локти согнуты.", "tips": ["Избегайте использования инерции; сосредоточьтесь на контролируемом и плавном движении.", "Выдыхайте, выжимая штангу вперед, и вдыхайте, опуская ее.", "Сосредоточьтесь на использовании плеч для жима веса, минимизируя нагрузку на поясницу."], "title": "Жим EZ-штанги против гравитации"}}, {"item_id": "ea_barbell_hang_clean", "source_content_version": "73663d533987a8cc4f8fb62ed33cd922", "title": "Barbell Hang Clean", "summary": "Stand holding the bar at arm's length, hands just outside the hips, feet hip-width", "steps": ["Stand holding the bar at arm's length, hands just outside the hips, feet hip-width", "Push the hips back and slide the bar down the thighs to just above the knee, spine neutral, chest up", "Drive the hips forward hard and shrug — the bar is thrown upward by the legs, not pulled by the arms", "As it rises, drop under it and spin the elbows through to catch the bar on the front of the shoulders", "Stand up out of the catch, then lower the bar back to the hang and reset before the next rep"], "tips": [], "equipment_id": "barbell", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Учит тело выдавать усилие быстро, а не просто поднимать много. Старт с виса убирает съём с пола, поэтому всё упражнение — это работа таза, то самое взрывное разгибание, что стоит за прыжком, стартом в спринте и броском.", "steps": ["Встаньте со штангой на прямых руках, кисти чуть шире бёдер, стопы на ширине таза", "Отведите таз назад и опустите гриф по бёдрам чуть выше колена, спина в нейтральном положении, грудь раскрыта", "Резко выведите таз вперёд и подайте плечи вверх — гриф выбрасывают ноги, а не тянут руки", "Пока штанга идёт вверх, подсядьте под неё и прокрутите локти вперёд, приняв гриф на передние дельты", "Встаньте из подседа, опустите штангу обратно в вис и восстановите позицию перед следующим повтором"], "summary": "Встаньте со штангой на прямых руках, кисти чуть шире бёдер, стопы на ширине таза", "title": "Взятие штанги на грудь с виса"}}, {"item_id": "ea_machine_fly", "source_content_version": "c8c7de25462ce341e4dbae94c981ff8d", "title": "Machine Fly", "summary": "Sit on the chest fly machine with your feet flat on the floor and your back pressed firmly against the backrest. Grasp the handles, arms parallel to the floor, with both hands at chest level and palms facing forward", "steps": ["Sit on the chest fly machine with your feet flat on the floor and your back pressed firmly against the backrest. Grasp the handles, arms parallel to the floor, with both hands at chest level and palms facing forward", "Keep a slight bend in your elbows and your arms extended out to your sides", "Bring the handles together in front of your chest by squeezing your chest muscles, keeping your elbows slightly bent", "Slowly return the handles to the starting position with control, bringing them back to your sides. Repeat for the desired number of repetitions"], "tips": ["Keep your back pressed against the backrest throughout the exercise to maintain proper form", "Focus on engaging your chest muscles throughout the movement", "Exhale as you bring the handles together and inhale as you return them to the starting position"], "equipment_id": "pec_deck", "muscles": ["chest", "biceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на тренажёр для разведения рук (бабочка), поставив стопы на пол и плотно прижав спину к спинке. Возьмитесь за рукоятки обеими руками на уровне груди, ладонями вперёд, руки параллельны полу.", "Сохраняйте небольшой сгиб в локтях, руки вытянуты в стороны.", "Сведите рукоятки перед грудью, сжимая грудные мышцы, сохраняя небольшой сгиб в локтях.", "Медленно и подконтрольно верните рукоятки в исходное положение, отведя их обратно в стороны. Повторите желаемое количество повторений."], "summary": "Сядьте на тренажёр для разведения рук (бабочка), поставив стопы на пол и плотно прижав спину к спинке. Возьмитесь за рукоятки обеими руками на уровне груди, ладонями вперёд, руки параллельны полу.", "tips": ["Держите спину прижатой к спинке тренажёра на протяжении всего упражнения, чтобы сохранить правильную технику.", "Сосредоточьтесь на задействовании грудных мышц на протяжении всего движения.", "Выдыхайте, когда сводите рукоятки, и вдыхайте, когда возвращаете их в исходное положение."], "title": "Разведение рук в тренажёре (бабочка)"}}, {"item_id": "ea_cable_goblet_squat", "source_content_version": "c7e98e38cd5ba5c451cebee486e3a77b", "title": "Cable Goblet Squat", "summary": "Stand upright facing the cable machine with your feet shoulder-width apart, holding a bar attachment with both hands at chest level with elbows facing the floor", "steps": ["Stand upright facing the cable machine with your feet shoulder-width apart, holding a bar attachment with both hands at chest level with elbows facing the floor", "Begin squatting by bending your hips and knees, descend into a deep squat until your thighs are parallel to the ground or lower", "Push through your heels to return to the starting position", "Repeat for the desired repetitions"], "tips": ["Keep your elbows pointed down and tucked in to stabilize the bar during the squat", "Engage your core to protect your lower back and maintain balance", "Ensure your knees track in line with your toes as you descend"], "equipment_id": "cable_machine", "muscles": ["quads", "glutes", "hamstrings", "calves", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте прямо лицом к блочному тренажеру, поставив ноги на ширине плеч, держа рукоятку-гриф обеими руками на уровне груди, локти направлены вниз.", "Начните присед, сгибая бедра и колени, опуститесь в глубокий присед, пока бедра не станут параллельны полу или ниже.", "Оттолкнитесь пятками, чтобы вернуться в исходное положение.", "Повторите желаемое количество повторений."], "summary": "Встаньте прямо лицом к блочному тренажеру, поставив ноги на ширине плеч, держа рукоятку-гриф обеими руками на уровне груди, локти направлены вниз.", "tips": ["Держите локти направленными вниз и прижатыми, чтобы стабилизировать гриф во время приседа.", "Напрягите пресс, чтобы защитить поясницу и сохранить равновесие.", "Следите, чтобы колени двигались в одном направлении с носками во время опускания."], "title": "Присед с тросом (гоблет)"}}, {"item_id": "ea_seated_single_leg_hamstring_stretch", "source_content_version": "418b16c180e4c66b26e8df6d6d2a53ce", "title": "Seated Single Leg Hamstring Stretch", "summary": "Sit on the floor with your legs extended straight in front of you", "steps": ["Sit on the floor with your legs extended straight in front of you", "Bend your left knee and place the sole of your left foot against your right inner thigh. Keep your right leg extended and straight", "Reach forward with both hands towards your right foot, keeping your spine neutral. Aim to grasp your toes or reach as far as comfortable", "Hold the stretch for 15-30 seconds, feeling the stretch in your right hamstring. Slowly release and return to the starting position. Repeat on the other side by extending your left leg and bending your right knee"], "tips": ["Keep your extended leg straight and avoid locking your knee to protect the joint", "Ensure your bent knee is relaxed and the sole of your foot is comfortably placed against your inner thigh", "Move into the stretch gradually and with control to prevent muscle strain or injury"], "equipment_id": null, "muscles": ["hamstrings", "calves"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Сядьте на пол, вытянув ноги прямо перед собой.", "Согните левое колено и прижмите подошву левой стопы к внутренней стороне правого бедра. Держите правую ногу вытянутой и прямой.", "Потянитесь вперёд обеими руками к правой стопе, держа спину в нейтральном положении. Старайтесь дотянуться до пальцев ног или насколько это комфортно.", "Удерживайте растяжку 15-30 секунд, чувствуя растяжение в правом подколенном сухожилии. Медленно расслабьтесь и вернитесь в исходное положение. Повторите на другой стороне, вытянув левую ногу и согнув правое колено."], "summary": "Сядьте на пол, вытянув ноги прямо перед собой.", "tips": ["Держите вытянутую ногу прямо и избегайте блокировки колена, чтобы защитить сустав.", "Убедитесь, что согнутое колено расслаблено, а подошва стопы удобно прижата к внутренней стороне бедра.", "Входите в растяжку постепенно и с контролем, чтобы предотвратить мышечное напряжение или травму."], "title": "Растяжка задней поверхности бедра сидя одной ногой"}}, {"item_id": "ea_crab_twist_toe_touch", "source_content_version": "447b385fc640928846aa1ce1e2060dc5", "title": "Crab Twist Toe Touch", "summary": "Begin by sitting on the floor with your legs bent, feet flat on the floor, and hands placed behind you with your fingers pointing towards your body", "steps": ["Begin by sitting on the floor with your legs bent, feet flat on the floor, and hands placed behind you with your fingers pointing towards your body", "Engage your glutes and press through your palms and feet to lift your hips off the floor, creating a tabletop position with your body", "Simultaneously lift your right hand and left foot off the floor and twist your torso to reach your right hand towards your left foot, attempting to touch your left toe", "Return your hand  and leg to the floor and repeat the movement on the opposite side by lifting your left hand and reaching towards your right foot. Continue alternating sides for the desired number of repetitions"], "tips": ["Perform the twist with control to maximize muscle activation and prevent injury", "Ensure your shoulders remain down and away from your ears to avoid unnecessary strain", "Breathe steadily throughout the exercise, exhaling as you twist and reach towards your toe and inhaling as you return to the starting position", "Use a mat or soft surface to support your hands and feet to prevent discomfort during the exercise"], "equipment_id": null, "muscles": ["glutes", "hamstrings", "shoulders", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на пол, согнув ноги, стопы на полу, а руки расположите за спиной пальцами к телу.", "Напрягите ягодицы и оттолкнитесь ладонями и стопами, чтобы поднять бёдра от пола, формируя положение «стол» телом.", "Одновременно поднимите правую руку и левую стопу от пола и скрутите корпус, чтобы дотянуться правой рукой до левой стопы, стараясь коснуться левого носка.", "Верните руку и ногу на пол и повторите движение на противоположной стороне, подняв левую руку и дотянувшись до правой стопы. Продолжайте чередовать стороны желаемое количество повторений."], "summary": "Сядьте на пол, согнув ноги, стопы на полу, а руки расположите за спиной пальцами к телу.", "tips": ["Выполняйте скручивание под контролем, чтобы максимизировать активацию мышц и предотвратить травмы.", "Убедитесь, что плечи опущены и отведены от ушей, чтобы избежать ненужного напряжения.", "Дышите равномерно на протяжении всего упражнения, выдыхая при скручивании и касании носка, и вдыхая при возвращении в исходное положение.", "Используйте коврик или мягкую поверхность для поддержки рук и стоп, чтобы предотвратить дискомфорт во время упражнения."], "title": "Скручивание краба с касанием носка"}}, {"item_id": "ea_lying_bench_internal_rotation_stretch", "source_content_version": "240083cbe6eda76afd85ac6c4db5cb73", "title": "Lying Bench Internal Rotation Stretch", "summary": "Lie on your back on a bench with your arms extended out to the sides, your elbows bent at 90 degrees, and your forearms hanging off the sides of the bench, perpendicular to the floor in line with your torso", "steps": ["Lie on your back on a bench with your arms extended out to the sides, your elbows bent at 90 degrees, and your forearms hanging off the sides of the bench, perpendicular to the floor in line with your torso", "Rotate your shoulders to lift your forearms upward until they are vertical to the floor, maintaining the 90-degree angle at your elbows throughout the movement", "Slowly lower your forearms back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Keep your core engaged and your back flat against the bench to maintain stability", "Move slowly and with control to maximize muscle engagement and prevent injury", "Keep your elbows fixed at a 90-degree angle throughout the movement to isolate the shoulder rotation"], "equipment_id": "bench_press", "muscles": ["shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину на скамью, руки разведены в стороны, локти согнуты под углом 90 градусов, предплечья свисают по бокам скамьи, перпендикулярно полу, на одной линии с корпусом.", "Вращайте плечи, чтобы поднять предплечья вверх, пока они не станут вертикальны полу, сохраняя угол 90 градусов в локтях на протяжении всего движения.", "Медленно и подконтрольно опустите предплечья обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину на скамью, руки разведены в стороны, локти согнуты под углом 90 градусов, предплечья свисают по бокам скамьи, перпендикулярно полу, на одной линии с корпусом.", "tips": ["Держите корпус напряженным, а спину прижатой к скамье для поддержания устойчивости.", "Двигайтесь медленно и подконтрольно, чтобы максимально задействовать мышцы и предотвратить травмы.", "Держите локти зафиксированными под углом 90 градусов на протяжении всего движения, чтобы изолировать вращение плеча."], "title": "Растяжка внутреннего вращения плеча лежа на скамье"}}, {"item_id": "ea_agility_ladder_in_in_out_out_with_knee_lift", "source_content_version": "685569fe23b6267f105bd402ffd9c47a", "title": "Agility Ladder in in Out Out with Knee Lift", "summary": "Stand at the end of the ladder with your feet hip width apart", "steps": ["Stand at the end of the ladder with your feet hip width apart", "Step both feet into the first square in quick succession", "As you step out to the sides, drive one knee up toward your chest", "Land and repeat, alternating which knee lifts each time", "Work the length of the ladder, then walk back and go again"], "tips": [], "equipment_id": "agility_ladder", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Подъём колена повышает требования к сгибателям бедра и равновесию, поэтому упражнение становится ещё и кардио, а не только работой стоп. Хорошо в конце разминки, когда пульс уже должен быть поднят.", "steps": ["Встаньте у края лестницы, стопы на ширине таза", "Быстро поставьте обе стопы в первый квадрат одну за другой", "Выходя стопами в стороны, поднимите одно колено к груди", "Приземлитесь и повторите, чередуя поднимаемое колено", "Пройдите всю лестницу, вернитесь и повторите"], "summary": "Встаньте у края лестницы, стопы на ширине таза", "title": "Координационная лестница: «внутрь-внутрь, наружу-наружу» с подъёмом коленей"}}, {"item_id": "ea_reverse_plank", "source_content_version": "7f39e44351036e7da761b917f8bfbe4c", "title": "Reverse Plank", "summary": "Sit on the floor with your legs straight and your hands behind your hips, fingers forward", "steps": ["Sit on the floor with your legs straight and your hands behind your hips, fingers forward", "Press through your hands and heels to lift your hips off the floor", "Squeeze your glutes until your body forms a straight line from heels to shoulders", "Open your chest and pull your shoulders down away from your ears", "Hold for the set time, breathing steadily, then lower under control"], "tips": [], "equipment_id": null, "muscles": ["core"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Противоположность обычной планке: нагружает заднюю поверхность тела — ягодицы, заднюю поверхность бёдер и мышцы между лопатками. Может помочь компенсировать день, проведённый согнувшись за столом.", "steps": ["Сядьте на пол, ноги прямые, ладони на полу за тазом, пальцы вперёд", "Оттолкнитесь ладонями и пятками, поднимая таз над полом", "Напрягите ягодицы до прямой линии от пяток до плеч", "Раскройте грудь, плечи опустите подальше от ушей", "Держите заданное время, дыша ровно, затем опуститесь под контролем"], "summary": "Сядьте на пол, ноги прямые, ладони на полу за тазом, пальцы вперёд", "title": "Обратная планка"}}, {"item_id": "ea_resistance_band_glute_bridge_abduction", "source_content_version": "f93ebfb5ed19e7cb09e01d46ee93162c", "title": "Resistance Band Glute Bridge Abduction", "summary": "Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Place a loop resistance band just above your knees. Keep your hands extended by your sides with hands firm on the floor", "steps": ["Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Place a loop resistance band just above your knees. Keep your hands extended by your sides with hands firm on the floor", "Engage your core and glutes, and lift your hips towards the ceiling, forming a straight line from your shoulders to your knees", "While holding the bridge position, press your knees outward against the resistance band to stretch them as far as you can control", "Slowly bring your knees back together, then lower your hips back to the starting position. Repeat for the desired number of repetitions"], "tips": ["Avoid arching your lower back; keep a straight line from your shoulders to your knees", "Focus on engaging your glutes and hip abductors throughout the movement", "Exhale as you lift your hips and press your knees outward, and inhale as you bring your knees back together and lower your hips"], "equipment_id": "resistance_bands", "muscles": ["glutes", "core", "hamstrings"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на спину, колени согнуты, стопы плотно прижаты к полу, на ширине бедер. Поместите петлевую резиновую ленту чуть выше коленей. Держите руки вытянутыми вдоль тела, ладони плотно прижаты к полу.", "Напрягите корпус и ягодицы, и поднимите бедра к потолку, образуя прямую линию от плеч до коленей.", "Удерживая положение моста, разведите колени в стороны против сопротивления резиновой ленты настолько, насколько уверенно контролируете разведение.", "Медленно сведите колени обратно, затем опустите бедра обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину, колени согнуты, стопы плотно прижаты к полу, на ширине бедер. Поместите петлевую резиновую ленту чуть выше коленей. Держите руки вытянутыми вдоль тела, ладони плотно прижаты к полу.", "tips": ["Избегайте прогиба в пояснице; держите прямую линию от плеч до коленей.", "Сосредоточьтесь на задействовании ягодичных мышц и отводящих мышц бедра на протяжении всего движения.", "Выдыхайте, когда поднимаете бедра и разводите колени в стороны, и вдыхайте, когда сводите колени обратно и опускаете бедра."], "title": "Ягодичный мост с отведением бедер с резиновой лентой"}}, {"item_id": "ea_hammer_strength_mts_iso_lateral_decline_press_single_arm", "source_content_version": "6324001cbea52240e4e6ec97b6e9843b", "title": "Hammer Strength MTS Iso-lateral Decline Press Single Arm", "summary": "Sit on the Hammer Strength MTS Iso-Lateral Decline Press, back pressed against the backrest and feet flat on the floor. Grasp the handles with both hands, palms facing down", "steps": ["Sit on the Hammer Strength MTS Iso-Lateral Decline Press, back pressed against the backrest and feet flat on the floor. Grasp the handles with both hands, palms facing down", "Press the right handle forward by extending your arm, keeping the other arm stationary", "Squeeze your chest muscles at the bottom of the movement and slowly return the handle to the starting position with control", "Repeat with the same arm for the desired number of repetitions and then switch to your left arm and repeat"], "tips": ["Exhale as you press the handle and inhale as you return it to the starting position", "Keep your back pressed against the backrest throughout the exercise", "Focus on engaging your chest muscles throughout the movement"], "equipment_id": "chest_press_machine", "muscles": ["chest", "shoulders", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["С
