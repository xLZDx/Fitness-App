:root{--bg:#fbfaf7;--fg:#1c1b19;--muted:#6b6862;--line:#ddd9d1;--card:#fff;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);
border-bottom:1px solid var(--line);padding:10px 16px;display:flex;
gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
.grow{flex:1}
.muted{color:var(--muted)}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;
align-items:start}
nav{border-right:1px solid var(--line);height:calc(100vh - 46px);
overflow:auto;position:sticky;top:46px;background:var(--card)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;
padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;
border-left:3px solid transparent;color:var(--muted)}
nav button.done{color:var(--fg)}
nav button.cur{border-left-color:var(--accent);background:#eef2f6;color:var(--fg)}
main{padding:20px 24px 80px;max-width:74ch}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;
padding:16px 18px;margin:0 0 16px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
color:var(--muted);margin:16px 0 6px;font-weight:650}
ol,ul{margin:0;padding-left:22px}
li{margin:3px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;
font-size:14px}
dt{color:var(--muted)}
dd{margin:0}
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:14px;padding:3px 12px;
cursor:pointer;font-size:14px;user-select:none}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.opts label:has(input[value=ok]:checked){background:var(--ok);color:#fff;
border-color:var(--ok)}
.opts label:has(input[value=problem]:checked){background:var(--prob);color:#fff;
border-color:var(--prob)}
.opts label:has(input[value=unsure]:checked){background:var(--uns);color:#fff;
border-color:var(--uns)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:2px 14px;font-size:14px}
.reasons label{cursor:pointer}
textarea{width:100%;min-height:72px;font:inherit;padding:8px;
border:1px solid var(--line);border-radius:4px;background:var(--bg);
color:var(--fg);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button.act{font:inherit;padding:6px 14px;border-radius:4px;cursor:pointer;
border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme:dark){
:root{--bg:#16181a;--fg:#e8e6e1;--muted:#9a968e;--line:#33363a;--card:#1e2124;
--ok:#4e9a6b;--prob:#c05a45;--uns:#a3894b;--accent:#7aa2c8}
nav button.cur{background:#242a31}
}
</style>
</head>

itions"], "tips": ["Focus on using your leg muscles to generate the jump, avoiding excessive strain on your knees", "Ensure your knees are slightly bent as you land to absorb the impact and prevent injury", "Start with smaller jumps to perfect your form before increasing the height"], "equipment_id": null, "muscles": ["quads", "hamstrings", "glutes", "calves", "shoulders", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы вместе, руки по бокам, сохраняя прямую осанку.", "Слегка согните колени и опуститесь в полуприсед, чтобы подготовиться к прыжку.", "Взрывно выпрыгните вверх, разводя ноги в стороны и вытягивая руки над головой, чтобы образовать форму звезды в воздухе.", "Мягко приземлитесь, поставив стопы вместе и руки по бокам, немедленно сгибая колени, чтобы поглотить удар. Повторите движение желаемое количество повторений."], "summary": "Встаньте, поставив стопы вместе, руки по бокам, сохраняя прямую осанку.", "tips": ["Сосредоточьтесь на использовании мышц ног для выполнения прыжка, избегая чрезмерной нагрузки на колени.", "Убедитесь, что колени слегка согнуты при приземлении, чтобы поглотить удар и предотвратить травмы.", "Начните с меньших прыжков, чтобы отточить технику, прежде чем увеличивать высоту."], "title": "Прыжок «Звезда»"}}, {"item_id": "ea_dumbbell_frog_jumps", "source_content_version": "d5dc22bc1e2fd2b416d8ecb8dedf5cdc", "title": "Dumbbell Frog Jumps", "summary": "Bend your knees and lower into a deep squat while keeping your chest up, with your feet wider than shoulder-width, holding a dumbbell in each hand hanging between your legs", "steps": ["Bend your knees and lower into a deep squat while keeping your chest up, with your feet wider than shoulder-width, holding a dumbbell in each hand hanging between your legs", "Push through your heels and extend your legs to stand upright, bringing the dumbbells to your sides", "Explosively jump straight up from the squat position, extending through your hips, knees, and ankles", "Land softly back into the squat position with control and immediately go into the next rep"], "tips": ["Use explosive power from your legs to jump up", "Land with soft knees to reduce impact on joints", "Engage your core throughout the movement"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "calves", "hamstrings", "core", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Согните колени и опуститесь в глубокий присед, держа грудь прямо, стопы шире плеч, с гантелью в каждой руке, свисающей между ног.", "Оттолкнитесь пятками и выпрямите ноги, чтобы встать, поднося гантели к бокам.", "Взрывным движением выпрыгните вверх из положения приседа, разгибаясь в бёдрах, коленях и лодыжках.", "Мягко и контролируемо приземлитесь обратно в положение приседа и немедленно переходите к следующему повторению."], "summary": "Согните колени и опуститесь в глубокий присед, держа грудь прямо, стопы шире плеч, с гантелью в каждой руке, свисающей между ног.", "tips": ["Используйте взрывную силу ног для прыжка вверх.", "Приземляйтесь на мягкие колени, чтобы уменьшить нагрузку на суставы.", "Держите корпус напряжённым на протяжении всего движения."], "title": "Прыжки лягушкой с гантелями"}}, {"item_id": "ea_seated_dumbbell_one_arm_shoulder_press", "source_content_version": "291c93849074f465654cee126d940658", "title": "Seated Dumbbell One Arm Shoulder Press", "summary": "Sit on a bench with back support, holding a dumbbell in your right hand at shoulder height, palm facing forward. Keep your spine neutral and feet flat on the floor", "steps": ["Sit on a bench with back support, holding a dumbbell in your right hand at shoulder height, palm facing forward. Keep your spine neutral and feet flat on the floor", "Press the dumbbell upward until your arm is fully extended overhead, keeping your wrist straight", "Lower the dumbbell back to shoulder height with control", "Repeat for the desired number of repetitions, then switch to your left arm and repeat"], "tips": ["Avoid arching your back; keep it pressed against the backrest of the bench", "Move the dumbbell in a straight line to maximize muscle engagement", "Exhale as you press the dumbbell up and inhale as you lower it"], "equipment_id": "bench_press", "muscles": ["shoulders", "triceps", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью со спинкой, держа гантель в правой руке на уровне плеча, ладонью вперёд. Держите спину в нейтральном положении, а стопы — на полу.", "Выжмите гантель вверх, пока рука полностью не выпрямится над головой, держа запястье прямо.", "Медленно опустите гантель обратно до уровня плеча.", "Повторите желаемое количество повторений, затем поменяйте руку и повторите."], "summary": "Сядьте на скамью со спинкой, держа гантель в правой руке на уровне плеча, ладонью вперёд. Держите спину в нейтральном положении, а стопы — на полу.", "tips": ["Избегайте прогиба в спине; держите её прижатой к спинке скамьи.", "Перемещайте гантель по прямой линии, чтобы максимально задействовать мышцы.", "Выдыхайте при жиме гантели вверх и вдыхайте при опускании."], "title": "Жим гантели одной рукой над головой сидя"}}, {"item_id": "ea_dumbbell_ab_crunch", "source_content_version": "2b46443c87a9f5fe71af5c773fb478e4", "title": "Dumbbell Ab Crunch", "summary": "Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Hold a dumbbell with both hands striaght over your chest", "steps": ["Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Hold a dumbbell with both hands striaght over your chest", "Lift your head, shoulders, and upper back off the floor by contracting your abdominal muscles", "Raise the dumbbell towards the ceiling as you perform the crunch, keeping your arms straight. Pause for a moment at the top of the movement, squeezing your abs", "Slowly lower your upper body back to the starting position, keeping control of the movement. Repeat for the desired number of repetitions"], "tips": ["Keep your lower back pressed against the floor throughout the exercise to avoid straining it", "Avoid using your neck muscles to lift your head; focus on using your abdominal muscles", "Breathe out as you lift your upper body and breathe in as you lower it"], "equipment_id": "dumbbell", "muscles": ["core", "shoulders", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, согнув колени, стопы стоят на полу на ширине бёдер. Держите гантель обеими руками прямо над грудью.", "Поднимите голову, плечи и верхнюю часть спины от пола, сокращая мышцы живота.", "Поднимите гантель к потолку, выполняя скручивание, держа руки прямо. Задержитесь на мгновение в верхней точке движения, напрягая пресс.", "Медленно опустите верхнюю часть тела обратно в исходное положение, сохраняя контроль над движением. Повторите желаемое количество повторений."], "summary": "Лягте на спину, согнув колени, стопы стоят на полу на ширине бёдер. Держите гантель обеими руками прямо над грудью.", "tips": ["Держите поясницу прижатой к полу на протяжении всего упражнения, чтобы избежать её перенапряжения.", "Избегайте использования мышц шеи для подъёма головы; сосредоточьтесь на использовании мышц живота.", "Выдыхайте, поднимая верхнюю часть тела, и вдыхайте, опуская её."], "title": "Скручивания с гантелью"}}, {"item_id": "ea_standing_side_slope_stretch", "source_content_version": "2dc6f7a65db6b0641902441848dacb63", "title": "Standing Side Slope Stretch", "summary": "Stand with your feet shoulder-width apart, keeping your posture upright. Raise your right arm overhead and allow your left hand to hang by your side", "steps": ["Stand with your feet shoulder-width apart, keeping your posture upright. Raise your right arm overhead and allow your left hand to hang by your side", "Gently lean your torso to the left, reaching your right arm over your head and feeling a stretch along the right side of your torso", "Hold the stretch for 20-30 seconds, and slowly return to the starting position", "Perform the stretch for the desired number of repetitions on each side"], "tips": ["Ensure your shoulders remain relaxed and avoid tensing them up towards your ears", "Use a gentle motion to avoid over-stretching and potential muscle strain", "Gradually increase the depth of the stretch as your flexibility improves"], "equipment_id": null, "muscles": ["core", "traps"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, сохраняя прямую осанку. Поднимите правую руку над головой, а левую руку оставьте висеть вдоль тела.", "Аккуратно наклоните корпус влево, вытягивая правую руку над головой и чувствуя растяжение по правой стороне корпуса.", "Удерживайте растяжку 20-30 секунд и медленно вернитесь в исходное положение.", "Выполните растяжку желаемое количество повторений на каждую сторону."], "summary": "Встаньте, поставив стопы на ширине плеч, сохраняя прямую осанку. Поднимите правую руку над головой, а левую руку оставьте висеть вдоль тела.", "tips": ["Убедитесь, что плечи остаются расслабленными, и избегайте их напряжения к ушам.", "Используйте плавное движение, чтобы избежать перерастяжения и возможного растяжения мышц.", "Постепенно увеличивайте глубину растяжки по мере улучшения гибкости."], "title": "Растяжка боковых мышц стоя с наклоном"}}, {"item_id": "ea_hands_clapped_forearms_stretch", "source_content_version": "fd020dce807befa377e62801f0bcac25", "title": "Hands Clapped Forearms Stretch", "summary": "Stand or sit tall and press your palms together in front of your chest", "steps": ["Stand or sit tall and press your palms together in front of your chest", "Keep the palms touching along their whole length", "Lower the hands slowly toward your stomach, keeping the elbows out", "Stop when you feel the stretch across the wrists and forearms", "Hold for twenty to thirty seconds, breathing normally"], "tips": [], "equipment_id": null, "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "Сжатые ладони, опускаемые вниз, растягивают оба предплечья и запястья равномерно — это важно для отжиманий, фронтальных приседов и стойки на руках, где запястье должно отгибаться назад.", "steps": ["Встаньте или сядьте прямо и сожмите ладони перед грудью", "Ладони должны соприкасаться по всей длине", "Медленно опускайте кисти к животу, локти держите разведёнными", "Остановитесь на ощущении растяжения в запястьях и предплечьях", "Удерживайте двадцать-тридцать секунд, дыша ровно"], "summary": "Встаньте или сядьте прямо и сожмите ладони перед грудью", "title": "Растяжка предплечий со сцепленными руками"}}, {"item_id": "ea_chair_bulgarian_split_squats_bodyweight_right", "source_content_version": "2ee11e6a0829fe8b88e3637c45c93282", "title": "Chair Bulgarian Split Squats Bodyweight Right", "summary": "Stand a few feet in front of a chair, facing away from it. Place your right foot on the chair behind you, with the top of your foot resting on the seat", "steps": ["Stand a few feet in front of a chair, facing away from it. Place your right foot on the chair behind you, with the top of your foot resting on the seat", "Position your left foot firmly on the floor, a comfortable distance in front of the chair", "Lower your body by bending your left knee and hip, keeping your torso upright, until your left thigh is parallel to the floor and your right knee is close to the floor", "Push through your left heel to return to the starting position. Repeat for the desired number of repetitions, then switch legs"], "tips": ["Keep your front knee aligned with your toes to avoid putting unnecessary strain on your knee", "Focus on driving through the heel of your front foot to engage your glutes and quadriceps effectively", "Perform the movement slowly and with control to maximize muscle activation and prevent injury", "Ensure your back foot remains stable on the chair to maintain proper alignment"], "equipment_id": null, "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте в нескольких футах перед стулом, спиной к нему. Поставьте правую стопу на стул позади себя, верхней частью стопы на сиденье.", "Поставьте левую стопу плотно на пол, на удобном расстоянии перед стулом.", "Опустите тело, сгибая левое колено и бедро, сохраняя туловище прямым, пока левое бедро не станет параллельно полу, а правое колено не окажется близко к полу.", "Оттолкнитесь левой пяткой, чтобы вернуться в исходное положение. Повторите желаемое количество повторений, затем поменяйте ноги."], "summary": "Встаньте в нескольких футах перед стулом, спиной к нему. Поставьте правую стопу на стул позади себя, верхней частью стопы на сиденье.", "tips": ["Держите переднее колено на одной линии с носками, чтобы избежать ненужной нагрузки на колено.", "Сосредоточьтесь на отталкивании пяткой передней ноги, чтобы эффективно задействовать ягодичные мышцы и квадрицепсы.", "Выполняйте движение медленно и подконтрольно, чтобы максимизировать активацию мышц и предотвратить травмы.", "Убедитесь, что задняя стопа остаётся стабильной на стуле, чтобы сохранить правильное выравнивание."], "title": "Болгарские сплит-приседания на одной ноге с опорой на стул, правая нога"}}, {"item_id": "ea_pull_up_wide_grip_front_view", "source_content_version": "20271b3e9430b05088a995cb59e9a5ba", "title": "Pull Up Wide Grip Front View", "summary": "Stand beneath a pull-up bar and grasp it with an overhand grip (palms facing away from you), hands wider than shoulder-width apart", "steps": ["Stand beneath a pull-up bar and grasp it with an overhand grip (palms facing away from you), hands wider than shoulder-width apart", "Engage your back muscles to pull yourself up towards the bar by bending your elbows", "Continue pulling until your chin is above the bar, focusing on contracting your back muscles", "Lower yourself back to the starting position in a controlled manner, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Use a full range of motion, fully extending your arms at the bottom and pulling up until your chin is above the bar", "Focus on engaging your back muscles, particularly the latissimus dorsi, to perform the pull-up effectively", "Breathe steadily, exhaling as you pull up and inhaling as you lower yourself down", "Avoid using momentum to swing your body; maintain a controlled movement throughout the exercise", "Perform the exercise on a stable, secure pull-up bar to ensure safety"], "equipment_id": "pullup_bar", "muscles": ["lats", "biceps", "shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте под перекладиной и возьмитесь за нее прямым хватом (ладони от себя), руки шире плеч.", "Задействуйте мышцы спины, чтобы подтянуться к перекладине, сгибая локти.", "Продолжайте подтягиваться, пока подбородок не окажется над перекладиной, сосредоточьтесь на сокращении мышц спины.", "Медленно опуститесь в исходное положение, полностью выпрямив руки. Повторите желаемое количество повторений."], "summary": "Встаньте под перекладиной и возьмитесь за нее прямым хватом (ладони от себя), руки шире плеч.", "tips": ["Используйте полную амплитуду движения, полностью выпрямляя руки в нижней точке и подтягиваясь до тех пор, пока подбородок не окажется над перекладиной.", "Сосредоточьтесь на задействовании мышц спины, особенно широчайших, для эффективного выполнения подтягивания.", "Дышите ровно, выдыхая при подтягивании и вдыхая при опускании.", "Избегайте использования инерции для раскачивания тела; сохраняйте контролируемое движение на протяжении всего упражнения.", "Выполняйте упражнение на устойчивой, надежной перекладине для обеспечения безопасности."], "title": "Подтягивание широким хватом (вид спереди)"}}, {"item_id": "ea_dumbbell_incline_fly_on_exercise_ball", "source_content_version": "7c9d24e09d5ac477b908eb9cbab8da04", "title": "Dumbbell Incline Fly on in each hand at shoulder height. Your palms should be facing each other, and your elbows should be bent at a 60-degree angle and facing downward", "Press the right dumbbell overhead and slightly lean to the opposite side until your arm is fully extended", "Lower the right dumbbell back to shoulder height in a controlled manner and press the left dumbbell overhead and slightly to the side", "Continue alternating arms for the desired number of repetitions, ensuring a smooth and controlled movement"], "tips": ["Breathe out as you press the dumbbell overhead and breathe in as you lower it", "Maintain a controlled pace to maximize muscle engagement and avoid using momentum", "Ensure your wrists remain straight and aligned with your forearms throughout the exercise"], "equipment_id": "dumbbell", "muscles": ["shoulders", "triceps", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ноги на ширине плеч, держа по гантели в каждой руке на уровне плеч. Ладони должны быть обращены друг к другу, а локти согнуты под углом 60 градусов и направлены вниз.", "Выжмите правую гантель над головой и слегка наклонитесь в противоположную сторону, пока рука не будет полностью выпрямлена.", "Опустите правую гантель обратно на уровень плеч контролируемым движением и выжмите левую гантель над головой и слегка в сторону.", "Продолжайте чередовать руки в течение желаемого количества повторений, обеспечивая плавное и контролируемое движение."], "summary": "Встаньте, поставив ноги на ширине плеч, держа по гантели в каждой руке на уровне плеч. Ладони должны быть обращены друг к другу, а локти согнуты под углом 60 градусов и направлены вниз.", "tips": ["Выдыхайте, когда выжимаете гантель над головой, и вдыхайте, когда опускаете её.", "Сохраняйте контролируемый темп, чтобы максимизировать вовлечение мышц и избежать использования инерции.", "Убедитесь, что ваши запястья остаются прямыми и на одной линии с предплечьями на протяжении всего упражнения."], "title": "Жим гантелей поочерёдно в сторону"}}, {"item_id": "ea_intermediate_hip_flexor_and_quad_stretch", "source_content_version": "c7709e4f1b5ad3316ed0e4cd76c09f4b", "title": "Intermediate Hip Flexor and Quad Stretch", "summary": "Lie on your stomach with your legs extended and your arms at your sides. Position an elastic cable around your right ankle", "steps": ["Lie on your stomach with your legs extended and your arms at your sides. Position an elastic cable around your right ankle", "Bend your right knee to bring your foot towards your glutes, holding the elastic cable in your both hands", "Gently pull on the cable to bring your foot closer to your glutes, feeling the stretch in your quadriceps. Hold this position for a moment", "Extend your right leg lightly backwards, allowing the cable to provide resistance and deepen the stretch in your hip flexor and quadriceps. Repeat the movement for the desired number of repetitions, then switch to the left leg"], "tips": ["Focus on deep, steady breathing, inhaling as you extend your leg and exhaling as you pull your foot towards your glutes", "If you find it difficult to reach the cable, use a longer strap or adjust the tension to ensure a comfortable stretch", "Ensure your head and neck remain in a neutral position, looking down towards the floor to avoid strain", "Perform the stretch on a comfortable surface, such as a yoga mat, to prevent discomfort or injury"], "equipment_id": "resistance_bands", "muscles": ["quads", "lower_back", "glutes"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на живот, вытянув ноги и расположив руки по бокам. Закрепите резиновую ленту вокруг правой лодыжки.", "Согните правое колено, чтобы подтянуть стопу к ягодицам, держа резиновую ленту обеими руками.", "Аккуратно потяните за ленту, чтобы подтянуть стопу ближе к ягодицам, чувствуя растяжение в квадрицепсах. Удерживайте это положение на мгновение.", "Слегка вытяните правую ногу назад, позволяя ленте создавать сопротивление и углублять растяжку сгибателей бедра и квадрицепсов. Повторите движение желаемое количество повторений, затем переключитесь на левую ногу."], "summary": "Лягте на живот, вытянув ноги и расположив руки по бокам. Закрепите резиновую ленту вокруг правой лодыжки.", "tips": ["Сосредоточьтесь на глубоком, ровном дыхании, вдыхая при вытягивании ноги и выдыхая при подтягивании стопы к ягодицам.", "Если вам трудно дотянуться до ленты, используйте более длинный ремень или отрегулируйте натяжение, чтобы обеспечить комфортную растяжку.", "Убедитесь, что голова и шея остаются в нейтральном положении, смотрите вниз на пол, чтобы избежать напряжения.", "Выполняйте растяжку на удобной поверхности, например, на коврике для йоги, чтобы предотвратить дискомфорт или травмы."], "title": "Растяжка сгибателей бедра и квадрицепсов (средний уровень)"}}, {"item_id": "ea_gate_pose_rounding_spine_looking_up", "source_content_version": "75fa4b62b513f065ccca227bd4059645", "title": "Gate Pose Rounding Spine Looking Up", "summary": "Kneel on one knee and extend the other leg straight out to the side, foot flat", "steps": ["Kneel on one knee and extend the other leg straight out to the side, foot flat", "Rest the same-side hand lightly on the extended leg", "Reach the opposite arm up and over toward the extended foot", "Turn your chest slightly upward and lengthen through the top ribs", "Hold for thirty seconds, breathing wide, then change sides"], "tips": [], "equipment_id": null, "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "Наклон в сторону из положения на колене, раскрывающий рёбра и боковую поверхность корпуса, а также внутреннюю поверхность бедра выпрямленной ноги. Напрямую достаёт до дыхательных мышц между рёбрами.", "steps": ["Встаньте на одно колено, вторую ногу вытяните в сторону, стопа на полу", "Одноимённую ладонь легко положите на вытянутую ногу", "Вытяните противоположную руку вверх и в сторону этой стопы", "Слегка разверните грудь вверх и вытянитесь через верхние рёбра", "Удерживайте тридцать секунд, дыша широко, затем смените сторону"], "summary": "Встаньте на одно колено, вторую ногу вытяните в сторону, стопа на полу", "title": "Поза Ворот с округлением спины и взглядом вверх"}}, {"item_id": "ea_dumbbell_single_leg_hip_thrust", "source_content_version": "5a211d1aa76472365496c5d819f5631d", "title": "Dumbbell Single Leg Hip Thrust", "summary": "Sit on the floor with your upper back against a bench and knees bent", "steps": ["Sit on the floor with your upper back against a bench and knees bent", "Lift one foot off the floor and hold that knee bent in the air", "Rest a dumbbell across the hips and hold it steady with both hands", "Drive through the whole foot of the planted leg, keeping the heel grounded, until your body is straight from knee to shoulder", "Lower slowly under control, then finish the set and change legs"], "tips": [], "equipment_id": "bench_press", "muscles": ["quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Одна нога и лопатки на скамье для большой амплитуды — это самое выгодное положение для нагрузки ягодицы. Заодно видно, какая сторона работала меньше.", "steps": ["Сядьте на пол, упритесь верхом спины в скамью, колени согнуты", "Оторвите одну стопу от пола и удерживайте это колено согнутым на весу", "Положите гантель поперёк таза и придерживайте её двумя руками", "Оттолкнитесь всей стопой опорной ноги, не отрывая пятку от пола, до прямой линии от колена до плеча", "Медленно опуститесь, доделайте подход и смените ногу"], "summary": "Сядьте на пол, упритесь верхом спины в скамью, колени согнуты", "title": "Ягодичный мост на одной ноге с гантелью"}}, {"item_id": "ea_dumbbell_standing_alternate_raise", "source_content_version": "7796c5a60e6d114c51b5a495a76fc023", "title": "Dumbbell Standing Alternate Raise", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms hanging by your sides and palms facing backward", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms hanging by your sides and palms facing backward", "Raise the right dumbbell in front of you until your arm is parallel to the floor, keeping a slight bend in your elbow", "Lower the right dumbbell back to the starting position and then raise the left dumbbell in front of you until your arm is parallel to the floor", "Continue alternating the raise between your right and left arms for the desired number of repetitions"], "tips": ["Use a controlled motion to avoid swinging the weights and maintain proper form", "Keep your head and neck in a neutral position, looking straight ahead", "Avoid locking your elbows at the top of the movement to reduce joint strain"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа гантель в каждой руке, руки свисают по бокам, ладони обращены назад.", "Поднимите правую гантель перед собой, пока рука не станет параллельна полу, сохраняя лёгкий сгиб в локте.", "Опустите правую гантель обратно в исходное положение, затем поднимите левую гантель перед собой, пока рука не станет параллельна полу.", "Продолжайте попеременно выполнять подъёмы правой и левой рукой желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, держа гантель в каждой руке, руки свисают по бокам, ладони обращены назад.", "tips": ["Используйте контролируемое движение, чтобы избежать раскачивания веса и сохранить правильную технику.", "Держите голову и шею в нейтральном положении, смотря прямо перед собой.", "Избегайте блокировки локтей в верхней точке движения, чтобы уменьшить нагрузку на суставы."], "title": "Подъёмы гантелей перед собой стоя попеременно"}}, {"item_id": "ea_dumbbell_knee_lawnmower_row", "source_content_version": "17355e4d234118afb12136ad334bc6e2", "title": "Dumbbell Knee Lawnmower Row", "summary": "Take a staggered stance with one foot forward and rest the free hand on that thigh", "steps": ["Take a staggered stance with one foot forward and rest the free hand on that thigh", "Hold a dumbbell in the other hand and let it hang toward the inside of the front foot", "Hinge forward with a neutral spine so the weight starts low and across your body", "Pull the dumbbell up and back toward your ribs, letting the torso open slightly", "Reverse the path slowly to the low starting point, then finish the set and switch sides"], "tips": [], "equipment_id": "dumbbell", "muscles": ["back"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Тяга по диагонали от низкого положения к рёбрам нагружает спину так, как вы её и используете, — с элементом разворота, а не по прямой. Это связывает широчайшую с противоположным бедром, что переносится на броски и удары.", "steps": ["Встаньте в разножку, одна нога впереди, свободную ладонь положите на это бедро", "Гантель во второй руке опустите к внутренней стороне передней стопы", "Наклонитесь вперёд, сохраняя спину в нейтральном положении, вес в нижней точке идёт поперёк тела", "Тяните гантель вверх и назад к рёбрам, слегка раскрывая корпус", "Медленно верните по той же траектории вниз, доделайте подход и смените сторону"], "summary": "Встаньте в разножку, одна нога впереди, свободную ладонь положите на это бедро", "title": "Тяга гантели в наклоне одной рукой (поза косаря)"}}, {"item_id": "ea_hammer_strength_plate_loaded_combination_iso_lateral_chest_chest_press_single_arm", "source_content_version": "f494310fca80d45ceec660afd01115bc", "title": "Hammer Strength Plate-loaded Combination Iso-lateral Chest - Chest Press_single Arm", "summary": "Sit on the Hammer Strength Plate-Loaded Iso-Lateral Chest Press machine, back pressed against the backrest and feet flat on the floor. Grasp the handles with both hands, palms facing down", "steps": ["Sit on the Hammer Strength Plate-Loaded Iso-Lateral Chest Press machine, back pressed against the backrest and feet flat on the floor. Grasp the handles with both hands, palms facing down", "Press the right handle forward by extending your arm, keeping your elbow slightly bent at the end of the movement", "Squeeze your chest muscles at the top of the movement and slowly return the handle to the starting position with control", "Repeat with the same arm for the desired number of repetitions and then switch to your left arm and repeat"], "tips": ["Keep your back pressed against the backrest throughout the exercise", "Focus on engaging your chest muscles throughout the movement", "Exhale as you press the handle forward and inhale as you return it to the starting position"], "equipment_id": "chest_press_machine", "muscles": ["chest", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на тренажер Hammer Strength Iso-Lateral для жима груди с дисками, прижав спину к спинке и поставив стопы на пол. Возьмитесь за рукоятки обеими руками, ладони направлены вниз.", "Выжмите правую рукоятку вперед, выпрямляя руку, при этом локоть остается слегка согнутым в конце движения.", "Сократите мышцы груди в верхней точке движения и медленно, подконтрольно верните рукоятку в исходное положение.", "Повторите то же самое правой рукой для желаемого количества повторений, затем переключитесь на левую руку и повторите."], "summary": "Сядьте на тренажер Hammer Strength Iso-Lateral для жима груди с дисками, прижав спину к спинке и поставив стопы на пол. Возьмитесь за рукоятки обеими руками, ладони направлены вниз.", "tips": ["Держите спину прижатой к спинке на протяжении всего упражнения.", "Сосредоточьтесь на работе мышц груди на протяжении всего движения.", "Выдыхайте, когда выжимаете рукоятку вперед, и вдыхайте, когда возвращаете ее в исходное положение."], "title": "Hammer Strength Жим груди Iso-Lateral с дисками одной рукой"}}, {"item_id": "ea_crescent_moon_pose_quad_stretch_with_block", "source_content_version": "ab49c486437645b01bcac51b194dfb31", "title": "Crescent Moon Pose Quad Stretch with Block", "summary": "Kneel on one knee with the other foot forward and a block beside the front foot", "steps": ["Kneel on one knee with the other foot forward and a block beside the front foot", "Rest one or both hands on the block to steady yourself", "Push the hip of the kneeling leg forward by squeezing that glute", "Keep your torso upright and your ribs pulled down", "Hold for thirty seconds, then swap legs"], "tips": [], "equipment_id": "yoga_blocks", "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "То же растяжение таза и бедра, но с блоком под руками: положение можно удерживать, не требуя баланса полной версии. Этот вариант используют, пока таз ещё зажат.", "steps": ["Встаньте на одно колено, вторая стопа впереди, блок рядом с передней стопой", "Обопритесь одной или обеими ладонями на блок для устойчивости", "Подайте таз опорной ноги вперёд, напрягая её ягодицу", "Корпус держите прямым, рёбра опущенными", "Удерживайте тридцать секунд и смените ногу"], "summary": "Встаньте на одно колено, вторая стопа впереди, блок рядом с передней стопой", "title": "Растяжка квадрицепса в позе полумесяца с блоком"}}, {"item_id": "ea_dumbbell_scott_press_360_degrees", "source_content_version": "6b44212997ee9379aa0e1a6f0ca820ee", "title": "Dumbbell Scott Press (360 Degrees)", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand in front of your face, arms bent at 90 degrees, upper arms parallel to the floor", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand in front of your face, arms bent at 90 degrees, upper arms parallel to the floor", "Move the dumbbells outward in an arc motion, keeping your elbows bent and slightly raised, until your arms are extended to your sides just higher than shoulder height", "Bring the dumbbells back to the starting position in front of your face, maintaining the 90-degree bend in your elbows", "Repeat the arc motion for the desired number of repetitions"], "tips": ["Keep your wrists straight and aligned with your forearms", "Focus on using your shoulder muscles to move the weights", "Avoid using excessive weights that compromise your form"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, ноги на ширине плеч, держа гантель в каждой руке перед лицом, руки согнуты под углом 90 градусов, плечи параллельны полу.", "Разведите гантели в стороны по дуге, держа локти согнутыми и слегка приподнятыми, пока руки не будут вытянуты в стороны чуть выше уровня плеч.", "Верните гантели в исходное положение перед лицом, сохраняя сгиб в локтях под углом 90 градусов.", "Повторите движение по дуге желаемое количество повторений."], "summary": "Встаньте, ноги на ширине плеч, держа гантель в каждой руке перед лицом, руки согнуты под углом 90 градусов, плечи параллельны полу.", "tips": ["Держите запястья прямыми и на одной линии с предплечьями.", "Сосредоточьтесь на использовании мышц плеч для перемещения веса.", "Избегайте использования чрезмерного веса, который может нарушить технику выполнения."], "title": "Жим Скотта с гантелями (360 градусов)"}}, {"item_id": "ea_good_mornings_barbell", "source_content_version": "1615afe8aa34ffa3c16eeb357422431c", "title": "Good Mornings Barbell", "summary": "Stand with your feet shoulder-width apart, holding a barbell across your upper back with an overhand grip", "steps": ["Stand with your feet shoulder-width apart, holding a barbell across your upper back with an overhand grip", "Begin to hinge at your hips, pushing your hips back while lowering your torso towards the floor", "Continue to lower your torso until it is almost parallel to the floor", "Return to the starting position by driving your hips forward and raising your torso back up. Repeat for the desired number of repetitions"], "tips": ["Maintain a straight back and avoid rounding your spine", "Focus on hinging at the hips rather than bending at the waist", "Keep a slight bend in your knees to reduce stress on your lower back"], "equipment_id": "barbell", "muscles": ["lower_back", "hamstrings", "glutes"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа штангу на верхней части спины прямым хватом.", "Начните наклоняться в тазобедренных суставах, отводя бёдра назад и опуская туловище к полу.", "Продолжайте опускать туловище, пока оно не станет почти параллельно полу.", "Вернитесь в исходное положение, подавая бёдра вперёд и поднимая туловище. Повторите желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, держа штангу на верхней части спины прямым хватом.", "tips": ["Держите спину прямо и избегайте округления позвоночника.", "Сосредоточьтесь на сгибании в тазобедренных суставах, а не в пояснице.", "Держите колени слегка согнутыми, чтобы уменьшить нагрузку на поясницу."], "title": "Наклоны «Доброе утро» со штангой"}}, {"item_id": "ea_kettlebell_decline_skull_crusher", "source_content_version": "4684296e42987518e31eaad62d062bcb", "title": "Kettlebell Decline Skull Crusher", "summary": "Set a bench to a slight decline and lie down with your feet hooked under the pads", "steps": ["Set a bench to a slight decline and lie down with your feet hooked under the pads", "Hold a kettlebell in each hand and press them up so your arms point straight at the ceiling", "Keep the upper arms fixed and vertical", "Bend the elbows to lower the bells toward the top of your head", "Straighten the arms back up, stopping just before the elbows lock"], "tips": [], "equipment_id": "kettlebell", "muscles": ["triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Наклон вниз сохраняет напряжение в трицепсе в верхней точке, где на горизонтальной скамье руки отдыхают под весом. Гиря, висящая под кистью, дополнительно уводит локоть назад и добавляет растяжение внизу.", "steps": ["Поставьте скамью в небольшой отрицательный наклон и лягте, зацепив ноги за валики", "Возьмите по гире в каждую руку и выжмите их так, чтобы руки смотрели строго в потолок", "Плечи держите зафиксированными и вертикально", "Согните локти, опуская гири к макушке", "Разогните руки обратно, останавливаясь перед выключением локтей"], "summary": "Поставьте скамью в небольшой отрицательный наклон и лягте, зацепив ноги за валики", "title": "Разгибание рук с гирями на наклонной скамье"}}, {"item_id": "ea_bodyweight_triceps_extension", "source_content_version": "c9b67502e10e5ad34fcde377aba8cc40", "title": "Bodyweight Triceps Extension", "summary": "Begin in a plank position on your toes and elbows, with your hands positioned at shoulder-width apart, palms on the floor", "steps": ["Begin in a plank position on your toes and elbows, with your hands positioned at shoulder-width apart, palms on the floor", "Push through your palms to extend your arms straight, keeping your palms in place", "Lower your forearms to the floor back to the starting plank position", "Repeat the movement for the desired number of repetitions"], "tips": ["Keep your body in a straight line from head to heels to maintain proper form", "Engage your core to stabilize your body and prevent your hips from sagging", "Focus on your breathing; inhale as you lower your forearms and exhale as you extend your arms back to the plank position"], "equipment_id": null, "muscles": ["triceps", "shoulders", "chest"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Примите положение планки на носках и локтях, руки расположены на ширине плеч, ладони на полу.", "Оттолкнитесь ладонями, чтобы выпрямить руки, удерживая ладони на месте.", "Опустите предплечья на пол, возвращаясь в исходное положение планки.", "Повторите движение желаемое количество повторений."], "summary": "Примите положение планки на носках и локтях, руки расположены на ширине плеч, ладони на полу.", "tips": ["Держите тело в прямой линии от головы до пяток для поддержания правильной техники.", "Напрягите мышцы кора, чтобы стабилизировать тело и предотвратить провисание бёдер.", "Сосредоточьтесь на дыхании; вдыхайте при опускании предплечий и выдыхайте при выпрямлении рук обратно в положение планки."], "title": "Разгибания на трицепс с собственным весом"}}, {"item_id": "ea_45_degree_bicycle_twisting_crunch", "source_content_version": "37eb8a7a9753ccaec357d34c43877c7d", "title": "45 Degree Bicycle Twisting Crunch", "summary": "Align yourself to 45 degrees to the floor by fixing your left foot into the footrest and supporting your thigh against the padded platform", "steps": ["Align yourself to 45 degrees to the floor by fixing your left foot into the footrest and supporting your thigh against the padded platform", "Place your left hand behind your head and your right hand on your waist", "Straighten your upper leg wide and bend your knee while twisting your torso and bringing the opposite elbow towards it", "Return to the initial position, and repeat"], "tips": ["Ensure your feet are securely positioned on the hyperextension bench to maintain stability throughout the exercise", "Focus on engaging your core muscles to lift and twist, avoiding pulling on your neck with your hands", "Perform the exercise with controlled movements to maximize muscle engagement and reduce the risk of strain"], "equipment_id": "back_extension", "muscles": ["core", "lower_back", "quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Расположитесь под углом 45 градусов к полу, зафиксировав левую стопу в упоре для ног и оперев бедро на мягкую платформу.", "Положите левую руку за голову, а правую — на талию.", "Широко выпрямите верхнюю ногу и согните колено, одновременно скручивая корпус и подтягивая к нему противоположный локоть.", "Вернитесь в исходное положение и повторите."], "summary": "Расположитесь под углом 45 градусов к полу, зафиксировав левую стопу в упоре для ног и оперев бедро на мягкую платформу.", "tips": ["Убедитесь, что стопы надёжно зафиксированы на скамье для гиперэкстензии, чтобы сохранить стабильность на протяжении всего упражнения.", "Сосредоточьтесь на задействовании мышц кора для подъёма и скручивания, избегая тянуть шею руками.", "Выполняйте упражнение контролируемыми движениями, чтобы максимизировать задействование мышц и снизить риск растяжений."], "title": "Скручивания «велосипед» с поворотом под углом 45 градусов"}}, {"item_id": "ea_adductor_dynamic_stretch", "source_content_version": "d9cc57b7813bbaac2446e6975ddf793d", "title": "Adductor Dynamic Stretch", "summary": "Lie on your back on a mat with both legs extended upwards", "steps": ["Lie on your back on a mat with both legs extended upwards", "Open your legs wide apart, stretching your inner thighs", "Bring your legs back together to the starting position", "Continue the movement in a dynamic manner, opening and closing your legs"], "tips": ["Keep your core engaged to maintain stability and control throughout the movement", "Perform the movement with controlled and smooth transitions to maximize the stretch and prevent injury", "Breathe steadily, exhaling as you open your legs and inhaling as you bring them back together"], "equipment_id": null, "muscles": ["adductors", "lower_back", "quads"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на спину на коврик, обе ноги вытянуты вверх.", "Широко разведите ноги в стороны, растягивая внутреннюю поверхность бедер.", "Сведите ноги обратно в исходное положение.", "Продолжайте движение в динамичной манере, разводя и сводя ноги."], "summary": "Лягте на спину на коврик, обе ноги вытянуты вверх.", "tips": ["Держите мышцы кора напряженными для поддержания стабильности и контроля на протяжении всего движения.", "Выполняйте движение с контролируемыми и плавными переходами, чтобы максимизировать растяжку и предотвратить травмы.", "Дышите ровно, выдыхая при разведении ног и вдыхая при их сведении."], "title": "Динамическая растяжка приводящих мышц"}}, {"item_id": "ea_barbell_hang_clean", "source_content_version": "73663d533987a8cc4f8fb62ed33cd922", "title": "Barbell Hang Clean", "summary": "Stand holding the bar at arm's length, hands just outside the hips, feet hip-width", "steps": ["Stand holding the bar at arm's length, hands just outside the hips, feet hip-width", "Push the hips back and slide the bar down the thighs to just above the knee, spine neutral, chest up", "Drive the hips forward hard and shrug — the bar is thrown upward by the legs, not pulled by the arms", "As it rises, drop under it and spin the elbows through to catch the bar on the front of the shoulders", "Stand up out of the catch, then lower the bar back to the hang and reset before the next rep"], "tips": [], "equipment_id": "barbell", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Учит тело выдавать усилие быстро, а не просто поднимать много. Старт с виса убирает съём с пола, поэтому всё упражнение — это работа таза, то самое взрывное разгибание, что стоит за прыжком, стартом в спринте и броском.", "steps": ["Встаньте со штангой на прямых руках, кисти чуть шире бёдер, стопы на ширине таза", "Отведите таз назад и опустите гриф по бёдрам чуть выше колена, спина в нейтральном положении, грудь раскрыта", "Резко выведите таз вперёд и подайте плечи вверх — гриф выбрасывают ноги, а не тянут руки", "Пока штанга идёт вверх, подсядьте под неё и прокрутите локти вперёд, приняв гриф на передние дельты", "Встаньте из подседа, опустите штангу обратно в вис и восстановите позицию перед следующим повтором"], "summary": "Встаньте со штангой на прямых руках, кисти чуть шире бёдер, стопы на ширине таза", "title": "Взятие штанги на грудь с виса"}}, {"item_id": "ea_horizontal_leg_press_calf_raise_single_leg", "source_content_version": "bb1bc95674e934359c430820b660389b", "title": "Horizontal Leg Press Calf Raise Single Leg", "summary": "Sit in the leg press and place the ball of one foot on the bottom
