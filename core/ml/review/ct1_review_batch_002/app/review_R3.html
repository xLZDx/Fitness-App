 together in the center of the foot platform, keeping your feet flat and parallel. Adjust the seat so that your knees are bent at about a 90-degree angle", "Hold the handles on the sides of the seat for stability. Keep your back pressed against the backrest and your core engaged", "Press through your heels to extend your legs, pushing the platform away from you until your legs are fully extended but not locked at the knees", "Slowly return to the starting position by bending your knees with control. Repeat for the desired number of repetitions"], "tips": ["Keep your back pressed against the backrest throughout the exercise", "Ensure both feet remain flat on the platform for better stability and muscle balance", "Exhale as you press the platform away and inhale as you return to the starting position"], "equipment_id": "leg_press", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте в тренажёр для жима ногами и расположите стопы близко друг к другу в центре платформы, держа стопы ровно и параллельно. Отрегулируйте сиденье так, чтобы колени были согнуты примерно под углом 90 градусов.", "Держитесь за рукоятки по бокам сиденья для устойчивости. Держите спину прижатой к спинке, а корпус напряжённым.", "Давите пятками, чтобы выпрямить ноги, отталкивая платформу от себя, пока ноги не будут полностью выпрямлены, но не заблокированы в коленях.", "Медленно вернитесь в исходное положение, контролируемо сгибая колени. Повторите желаемое количество повторений."], "summary": "Сядьте в тренажёр для жима ногами и расположите стопы близко друг к другу в центре платформы, держа стопы ровно и параллельно. Отрегулируйте сиденье так, чтобы колени были согнуты примерно под углом 90 градусов.", "tips": ["Держите спину прижатой к спинке на протяжении всего упражнения.", "Убедитесь, что обе стопы остаются плотно на платформе для лучшей устойчивости и мышечного баланса.", "Выдыхайте, отталкивая платформу, и вдыхайте, возвращаясь в исходное положение."], "title": "Жим ногами в тренажёре с узкой постановкой стоп"}}, {"item_id": "ea_crab_twist_toe_touch", "source_content_version": "447b385fc640928846aa1ce1e2060dc5", "title": "Crab Twist Toe Touch", "summary": "Begin by sitting on the floor with your legs bent, feet flat on the floor, and hands placed behind you with your fingers pointing towards your body", "steps": ["Begin by sitting on the floor with your legs bent, feet flat on the floor, and hands placed behind you with your fingers pointing towards your body", "Engage your glutes and press through your palms and feet to lift your hips off the floor, creating a tabletop position with your body", "Simultaneously lift your right hand and left foot off the floor and twist your torso to reach your right hand towards your left foot, attempting to touch your left toe", "Return your hand  and leg to the floor and repeat the movement on the opposite side by lifting your left hand and reaching towards your right foot. Continue alternating sides for the desired number of repetitions"], "tips": ["Perform the twist with control to maximize muscle activation and prevent injury", "Ensure your shoulders remain down and away from your ears to avoid unnecessary strain", "Breathe steadily throughout the exercise, exhaling as you twist and reach towards your toe and inhaling as you return to the starting position", "Use a mat or soft surface to support your hands and feet to prevent discomfort during the exercise"], "equipment_id": null, "muscles": ["glutes", "hamstrings", "shoulders", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на пол, согнув ноги, стопы на полу, а руки расположите за спиной пальцами к телу.", "Напрягите ягодицы и оттолкнитесь ладонями и стопами, чтобы поднять бёдра от пола, формируя положение «стол» телом.", "Одновременно поднимите правую руку и левую стопу от пола и скрутите корпус, чтобы дотянуться правой рукой до левой стопы, стараясь коснуться левого носка.", "Верните руку и ногу на пол и повторите движение на противоположной стороне, подняв левую руку и дотянувшись до правой стопы. Продолжайте чередовать стороны желаемое количество повторений."], "summary": "Сядьте на пол, согнув ноги, стопы на полу, а руки расположите за спиной пальцами к телу.", "tips": ["Выполняйте скручивание под контролем, чтобы максимизировать активацию мышц и предотвратить травмы.", "Убедитесь, что плечи опущены и отведены от ушей, чтобы избежать ненужного напряжения.", "Дышите равномерно на протяжении всего упражнения, выдыхая при скручивании и касании носка, и вдыхая при возвращении в исходное положение.", "Используйте коврик или мягкую поверхность для поддержки рук и стоп, чтобы предотвратить дискомфорт во время упражнения."], "title": "Скручивание краба с касанием носка"}}, {"item_id": "ea_abdominal_crunches_with_hold", "source_content_version": "8b13e7b6a638a6b697f23fd291e46936", "title": "Abdominal Crunches with Hold", "summary": "Lie on your back with knees slightly bent and feet placed on the floor", "steps": ["Lie on your back with knees slightly bent and feet placed on the floor", "Inhale and try reaching forward with straight arms while lifting your upper back off the floor", "Hold the end position for a second and slowly return to the starting position"], "tips": ["Keep your neck relaxed and avoid pulling on it with your hands to prevent strain", "Focus on engaging your core muscles throughout the movement to maximize effectiveness", "Hold the crunch position for a count of two to five seconds to increase muscle activation and endurance"], "equipment_id": null, "muscles": ["core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, колени слегка согнуты и стопы на полу.", "Вдохните и попробуйте потянуться вперед прямыми руками, отрывая верхнюю часть спины от пола.", "Задержитесь в конечном положении на секунду и медленно вернитесь в исходное положение."], "summary": "Лягте на спину, колени слегка согнуты и стопы на полу.", "tips": ["Держите шею расслабленной и избегайте тянуть ее руками, чтобы предотвратить напряжение.", "Сосредоточьтесь на задействовании мышц кора на протяжении всего движения, чтобы максимизировать эффективность.", "Удерживайте положение скручивания в течение двух-пяти секунд, чтобы увеличить активацию мышц и выносливость."], "title": "Скручивания на пресс с удержанием"}}, {"item_id": "ea_barbell_stiff_leg_deadlift", "source_content_version": "1f77dd61a5214e50f186f58f75206834", "title": "Barbell Stiff Leg Deadlift", "summary": "Stand with your feet shoulder-width apart, holding a barbell with an overhand grip (palms facing down), hands placed slightly wider than shoulder-width apart. Your arms should be fully extended, and the barbell should rest against your thighs", "steps": ["Stand with your feet shoulder-width apart, holding a barbell with an overhand grip (palms facing down), hands placed slightly wider than shoulder-width apart. Your arms should be fully extended, and the barbell should rest against your thighs", "Slightly bend your knees and hinge at your hips to lower the barbell toward your feet. Keep your legs mostly straight but not locked", "Lower the barbell down the front of your legs until you feel a stretch in your hamstrings. Your back should remain straight throughout the movement", "Lift the barbell back up to the starting position by extending your hips, squeezing your glutes at the top. Repeat for the desired number of repetitions"], "tips": ["Keep your back straight throughout the movement to avoid rounding your spine", "Focus on hinging at your hips rather than bending your lower back", "Ensure your knees are slightly bent to avoid locking them and putting stress on your joints"], "equipment_id": "barbell", "muscles": ["hamstrings", "glutes", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, ноги на ширине плеч, держите штангу верхним хватом (ладони смотрят вниз), руки расположены чуть шире плеч. Руки должны быть полностью выпрямлены, штанга лежит на бёдрах.", "Слегка согните колени и наклонитесь в тазобедренных суставах, опуская штангу к стопам. Ноги держите по большей части прямыми, но не заблокированными.", "Опускайте штангу вдоль передней поверхности ног, пока не почувствуете растяжение в подколенных сухожилиях. Спина должна оставаться прямой на протяжении всего движения.", "Поднимите штангу обратно в исходное положение, разгибая бёдра, сжимая ягодицы в верхней точке. Повторите необходимое количество повторений."], "summary": "Встаньте, ноги на ширине плеч, держите штангу верхним хватом (ладони смотрят вниз), руки расположены чуть шире плеч. Руки должны быть полностью выпрямлены, штанга лежит на бёдрах.", "tips": ["Держите спину прямо на протяжении всего движения, чтобы избежать округления позвоночника.", "Сосредоточьтесь на сгибании в тазобедренных суставах, а не в пояснице.", "Убедитесь, что колени слегка согнуты, чтобы избежать их блокировки и нагрузки на суставы."], "title": "Становая тяга на прямых ногах со штангой"}}, {"item_id": "ea_dumbbell_fly_flat_bench_slow", "source_content_version": "c6525daffdb1e28e2ed427a2ab3f6cf4", "title": "Dumbbell Fly Flat Bench Slow", "summary": "Begin by lying on a flat bench with your feet flat on the floor for stability. Hold a dumbbell in each hand with your arms extended straight above your chest, palms facing each other", "steps": ["Begin by lying on a flat bench with your feet flat on the floor for stability. Hold a dumbbell in each hand with your arms extended straight above your chest, palms facing each other", "Slowly lower the dumbbells out to your sides in a wide arc, maintaining a slight bend in your elbows. Lower until your upper arms are parallel to the floor or slightly below chest level", "Slowly bring the dumbbells back up to the starting position by squeezing your chest muscles, keeping the slight bend in your elbows throughout the movement"], "tips": ["Avoid allowing the dumbbells to touch at the top to maintain tension in the chest muscles", "Keep your feet flat on the floor to provide stability and support", "Ensure your wrists remain straight and aligned with your forearms"], "equipment_id": "bench_press", "muscles": ["chest", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на горизонтальную скамью, поставив стопы на пол для стабильности. Возьмите по гантели в каждую руку, вытянув руки прямо над грудью, ладони смотрят друг на друга.", "Медленно опустите гантели в стороны по широкой дуге, сохраняя небольшой сгиб в локтях. Опускайте, пока ваши плечи не станут параллельны полу или чуть ниже уровня груди.", "Медленно верните гантели в исходное положение, сжимая грудные мышцы, сохраняя небольшой сгиб в локтях на протяжении всего движения."], "summary": "Лягте на горизонтальную скамью, поставив стопы на пол для стабильности. Возьмите по гантели в каждую руку, вытянув руки прямо над грудью, ладони смотрят друг на друга.", "tips": ["Избегайте соприкосновения гантелей в верхней точке, чтобы поддерживать напряжение в грудных мышцах.", "Держите стопы на полу для обеспечения стабильности и поддержки.", "Убедитесь, что ваши запястья остаются прямыми и выровненными с предплечьями."], "title": "Разведение гантелей лёжа на горизонтальной скамье (медленно)"}}, {"item_id": "ea_dumbbell_side_lunge_single_leg", "source_content_version": "688363ed733e26031eaa4a6d100659aa", "title": "Dumbbell Side Lunge Single Leg", "summary": "Stand with your feet together, holding a dumbbell with both hands close to your chest", "steps": ["Stand with your feet together, holding a dumbbell with both hands close to your chest", "Take a large step to your left with your left foot, bending your left knee and lowering your hips down and back as if you are sitting into a chair. Keep your right leg straight", "Lower yourself until your left thigh is parallel to the floor", "Push through your left heel to return to the starting position. Perform all repetitions on the left side before switching to the right side and repeating the exercise"], "tips": ["Keep your back straight and avoid leaning forward excessively", "Keep your feet facing forward and your weight distributed evenly", "Make sure your knee stays aligned with your toes during the lunge to prevent strain"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "hamstrings", "adductors"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ноги вместе. Держите гантель обеими руками близко к груди.", "Сделайте широкий шаг влево левой ногой, сгибая левое колено и опуская бёдра вниз и назад, как будто садитесь на стул. Держите правую ногу прямо.", "Опускайтесь до тех пор, пока левое бедро не станет параллельно полу.", "Оттолкнитесь левой пяткой, чтобы вернуться в исходное положение. Выполните все повторения на левой стороне, прежде чем переключиться на правую сторону и повторить упражнение."], "summary": "Встаньте, поставив ноги вместе. Держите гантель обеими руками близко к груди.", "tips": ["Держите спину прямо и избегайте чрезмерного наклона вперёд.", "Держите стопы направленными вперёд, а вес распределённым равномерно.", "Убедитесь, что колено остаётся на одной линии с носком во время выпада, чтобы предотвратить напряжение."], "title": "Выпад в сторону на одной ноге с гантелью"}}, {"item_id": "ea_walking", "source_content_version": "338ad9848a7e3bb90ebad06d09443170", "title": "Walking", "summary": "Stand upright with your feet hip-width apart and your arms relaxed by your sides", "steps": ["Stand upright with your feet hip-width apart and your arms relaxed by your sides", "Step forward with your right foot, rolling through the heel to the ball of your foot while swinging your left arm forward and right arm back", "Push off with your right foot, bringing your left foot forward to step, swinging your right arm forward and left arm back", "Continue this alternating pattern, maintaining a natural stride and rhythm. Repeat for the desired distance or time"], "tips": ["Swing your arms naturally in opposition to your legs to help with balance and momentum", "Maintain a steady and comfortable pace that allows you to walk efficiently", "Wear comfortable, supportive shoes to prevent injury and enhance your walking experience"], "equipment_id": null, "muscles": ["quads", "hamstrings", "glutes", "calves", "core", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте прямо, поставив стопы на ширине бёдер, руки расслаблены по бокам.", "Сделайте шаг вперёд правой ногой, перекатываясь с пятки на носок, одновременно вынося левую руку вперёд и отводя правую руку назад.", "Оттолкнитесь правой ногой, вынося левую ногу вперёд для шага, одновременно вынося правую руку вперёд и отводя левую руку назад.", "Продолжайте этот чередующийся паттерн, сохраняя естественный шаг и ритм. Повторяйте в течение желаемого расстояния или времени."], "summary": "Встаньте прямо, поставив стопы на ширине бёдер, руки расслаблены по бокам.", "tips": ["Естественно размахивайте руками в противофазе с ногами, чтобы помочь с балансом и импульсом.", "Поддерживайте ровный и комфортный темп, который позволяет эффективно ходить.", "Носите удобную, поддерживающую обувь, чтобы предотвратить травмы и улучшить опыт ходьбы."], "title": "Ходьба"}}, {"item_id": "ea_barbell_bulgarian_split_squat_left_side_view", "source_content_version": "2cebbaa2e5b540fc6b45067cacda5146", "title": "Barbell Bulgarian Split Squat Left Side View", "summary": "Stand with your back turned to a box, holding a barbell across your upper back. Grip the bar with your hands slightly wider than shoulder-width apart", "steps": ["Stand with your back turned to a box, holding a barbell across your upper back. Grip the bar with your hands slightly wider than shoulder-width apart", "Place one foot behind you on the box, ensuring the top of your foot is resting on the box", "Keep your chest up, and maintain a neutral spine. Begin the squat by bending your front knee and lowering your body until your back knee nearly touches the floor", "Push through the heel of your front foot to return to the starting position, extending your hip and knee fully. Repeat for the desired number of repetitions, then switch legs"], "tips": ["Ensure your front knee tracks over your toes to prevent knee injuries and ensure proper form", "Lower your body slowly and with control to maximize muscle engagement and prevent injury", "Breathe steadily, exhaling as you push up and inhaling as you lower down"], "equipment_id": "barbell", "muscles": ["quads", "glutes", "hamstrings", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте спиной к ящику, держа штангу на верхней части спины. Возьмите гриф руками чуть шире плеч.", "Поставьте одну ступню позади себя на ящик, убедившись, что верхняя часть ступни лежит на ящике.", "Держите грудь поднятой и сохраняйте нейтральное положение позвоночника. Начните приседание, сгибая переднее колено и опуская тело, пока заднее колено почти не коснётся пола.", "Оттолкнитесь пяткой передней ступни, чтобы вернуться в исходное положение, полностью выпрямив бедро и колено. Повторите желаемое количество повторений, затем поменяйте ноги."], "summary": "Встаньте спиной к ящику, держа штангу на верхней части спины. Возьмите гриф руками чуть шире плеч.", "tips": ["Убедитесь, что переднее колено движется над носком, чтобы предотвратить травмы коленей и обеспечить правильную технику.", "Опускайте тело медленно и подконтрольно, чтобы максимально задействовать мышцы и предотвратить травмы.", "Дышите ровно, выдыхая при подъёме и вдыхая при опускании."], "title": "Болгарские приседания со штангой, левая нога впереди (вид сбоку)"}}, {"item_id": "ea_dumbbell_standing_single_leg_calf_raise", "source_content_version": "6346b5b819d62a1c1ffc10901b91e8dc", "title": "Dumbbell Standing Single Leg Calf Raise", "summary": "Stand with your left foot on the floor, keeping your right foot a few inches off the floor, holding a dumbbell in both hands with your arms hanging by your sides", "steps": ["Stand with your left foot on the floor, keeping your right foot a few inches off the floor, holding a dumbbell in both hands with your arms hanging by your sides", "Press through the ball of your left foot to raise your heel off the floor as high as you can control by extending your ankle", "Hold the position briefly at the top, squeezing your calf muscle", "Lower your heel back down to the starting position with control. Repeat for the desired number of repetitions, then switch to the right leg"], "tips": ["Use a full range of motion, lifting your heel as high as possible", "Avoid bouncing; focus on a slow and controlled movement", "Maintain a steady pace and avoid using momentum"], "equipment_id": "dumbbell", "muscles": ["calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив левую стопу на пол, держа правую стопу на несколько сантиметров от пола, держа гантель обеими руками, руки свободно свисают по бокам.", "Оттолкнитесь подушечкой левой стопы, чтобы поднять пятку от пола на максимальную высоту, которую можете контролировать, выпрямляя голеностоп.", "Задержитесь в верхней точке на короткое мгновение, сокращая икроножную мышцу.", "Контролируемо опустите пятку обратно в исходное положение. Повторите желаемое количество повторений, затем поменяйте ногу."], "summary": "Встаньте, поставив левую стопу на пол, держа правую стопу на несколько сантиметров от пола, держа гантель обеими руками, руки свободно свисают по бокам.", "tips": ["Используйте полную амплитуду движения, поднимая пятку максимально высоко.", "Избегайте подпрыгиваний; сосредоточьтесь на медленном и контролируемом движении.", "Поддерживайте равномерный темп и избегайте использования инерции."], "title": "Подъём на носки с гантелью стоя на одной ноге"}}, {"item_id": "ea_chair_feet_elevated_glute_bridge", "source_content_version": "5ff3bd4b28c233f87f52fa4a75aacea5", "title": "Chair Feet Elevated Glute Bridge", "summary": "Lie on your back with both heels placed on the edge of a chair, legs bent at a 90-degree angle", "steps": ["Lie on your back with both heels placed on the edge of a chair, legs bent at a 90-degree angle", "Position your arms by your sides with your palms facing down for stability", "Engage your core and glutes, then lift your hips off the floor", "Hold the position briefly at the top, squeezing your glutes, then slowly lower your hips back to the floor. Repeat for the desired number of repetitions"], "tips": ["Ensure your heels remain firmly on the chair to provide a stable base for the movement", "Perform the movement slowly and with control to maximize muscle activation and prevent injury", "Focus on squeezing your glutes at the top of the movement to enhance muscle engagement"], "equipment_id": null, "muscles": ["glutes", "hamstrings", "quads", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, поставив обе пятки на край стула, ноги согнуты под углом 90 градусов.", "Расположите руки вдоль тела ладонями вниз для устойчивости.", "Напрягите мышцы кора и ягодицы, затем поднимите бёдра от пола.", "Задержитесь ненадолго в верхней точке, сжимая ягодицы, затем медленно опустите бёдра обратно на пол. Повторите желаемое количество повторений."], "summary": "Лягте на спину, поставив обе пятки на край стула, ноги согнуты под углом 90 градусов.", "tips": ["Убедитесь, что пятки прочно стоят на стуле, чтобы обеспечить стабильную основу для движения.", "Выполняйте движение медленно и подконтрольно, чтобы максимально задействовать мышцы и предотвратить травмы.", "Сосредоточьтесь на сжатии ягодиц в верхней точке движения для усиления мышечной активации."], "title": "Ягодичный мост со стопами на стуле"}}, {"item_id": "ea_straight_bar_cable_row_normal_grip", "source_content_version": "f67dabfbbebbabd217abd59292a81afb", "title": "Straight Bar Cable Row Normal Grip", "summary": "Sit at a cable row machine with your feet placed on the footrests and knees slightly bent. Grasp the straight bar with hands just wider than shoulder-width, palms facing down", "steps": ["Sit at a cable row machine with your feet placed on the footrests and knees slightly bent. Grasp the straight bar with hands just wider than shoulder-width, palms facing down", "Engage your core and maintain a neutral spine. Pull the bar towards your abdomen, squeezing your shoulder blades together and keeping your elbows close to your body", "Hold the contraction for a moment, feeling the muscles in your back activating", "Slowly extend your arms to return the bar to the starting position. Repeat for the desired number of repetitions"], "tips": ["Breathe steadily: exhale as you pull the bar towards you and inhale as you extend your arms", "Adjust the weight on the cable machine to provide enough challenge without compromising form", "Keep your shoulders relaxed and avoid shrugging them towards your ears"], "equipment_id": "seated_row_machine", "muscles": ["lats", "biceps", "forearms", "shoulders", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на тренажер для тяги блока к поясу, поставив стопы на упоры и слегка согнув колени. Возьмитесь за прямой гриф хватом чуть шире плеч, ладонями вниз.", "Напрягите корпус и держите спину в нейтральном положении. Тяните гриф к животу, сводя лопатки вместе и держа локти близко к телу.", "Задержитесь в сокращенном положении на мгновение, чувствуя активацию мышц спины.", "Медленно выпрямите руки, чтобы вернуть гриф в исходное положение. Повторите желаемое количество повторений."], "summary": "Сядьте на тренажер для тяги блока к поясу, поставив стопы на упоры и слегка согнув колени. Возьмитесь за прямой гриф хватом чуть шире плеч, ладонями вниз.", "tips": ["Дышите ровно: выдыхайте, когда тянете гриф к себе, и вдыхайте, когда выпрямляете руки.", "Отрегулируйте вес на блочном тренажере, чтобы обеспечить достаточную нагрузку без ущерба для техники.", "Держите плечи расслабленными и избегайте их подъема к ушам."], "title": "Тяга блока к поясу прямым грифом обычным хватом"}}, {"item_id": "ea_jumping_jack", "source_content_version": "fe93e2046c5bbea5d152f07704aae714", "title": "Jumping Jack", "summary": "Stand with your feet together and your arms at your sides", "steps": ["Stand with your feet together and your arms at your sides", "Jump your feet out to the sides while simultaneously raising your arms overhead, forming an \"X\" shape with your body", "Quickly jump back to the starting position with your feet together and your arms at your sides", "Repeat the movement for the desired duration or number of repetitions, maintaining a steady rhythm"], "tips": ["Maintain a slight bend in your knees throughout the exercise to absorb impact and reduce strain on your joints", "Keep your movements light and quick to enhance cardiovascular benefits", "Engage your shoulders and back muscles when raising your arms to ensure full range of motion", "Keep your gaze forward and your head in a neutral position to maintain alignment"], "equipment_id": null, "muscles": ["calves", "quads", "hamstrings", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы вместе и опустив руки по бокам.", "Разведите стопы в стороны прыжком, одновременно поднимая руки над головой, образуя телом форму буквы «X».", "Быстро вернитесь в исходное положение, сведя стопы вместе и опустив руки по бокам.", "Повторяйте движение в течение желаемого времени или количества повторений, поддерживая ровный ритм."], "summary": "Встаньте, поставив стопы вместе и опустив руки по бокам.", "tips": ["Сохраняйте лёгкий сгиб в коленях на протяжении всего упражнения, чтобы поглощать удары и уменьшать нагрузку на суставы.", "Держите движения лёгкими и быстрыми, чтобы улучшить сердечно-сосудистые преимущества.", "Задействуйте мышцы плеч и спины при подъёме рук, чтобы обеспечить полный диапазон движения.", "Держите взгляд направленным вперёд, а голову в нейтральном положении, чтобы сохранять выравнивание."], "title": "Прыжки с разведением рук и ног"}}, {"item_id": "ea_dumbbell_prone_incline_curl", "source_content_version": "b83c2ccc3c7c7a95478da3995aff2974", "title": "Dumbbell Prone Incline Curl", "summary": "Set an incline bench to a 45-degree angle and lie chest first on the bench. Hold a dumbbell in each hand with your arms fully extended down and palms facing forward", "steps": ["Set an incline bench to a 45-degree angle and lie chest first on the bench. Hold a dumbbell in each hand with your arms fully extended down and palms facing forward", "Keeping your upper arms stationary, curl the dumbbells towards your shoulders by bending your elbows", "Squeeze your biceps at the top of the movement, ensuring the dumbbells reach shoulder height", "Lower the dumbbells back to the starting position with control, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Focus on a slow and controlled motion to maximize bicep engagement", "Keep your wrists straight and aligned with your forearms", "Avoid swinging the weights to isolate the biceps during the curl"], "equipment_id": "bench_press", "muscles": ["biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Установите наклонную скамью под углом 45 градусов и лягте на неё грудью. Держите по гантели в каждой руке, полностью вытянув руки вниз, ладонями вперёд.", "Удерживая плечи неподвижными, согните гантели к плечам, сгибая локти.", "Сожмите бицепсы в верхней точке движения, убедившись, что гантели достигают уровня плеч.", "Контролируемо опустите гантели обратно в исходное положение, полностью выпрямив руки. Повторите желаемое количество повторений."], "summary": "Установите наклонную скамью под углом 45 градусов и лягте на неё грудью. Держите по гантели в каждой руке, полностью вытянув руки вниз, ладонями вперёд.", "tips": ["Сосредоточьтесь на медленном и контролируемом движении для максимального вовлечения бицепсов.", "Держите запястья прямыми и на одной линии с предплечьями.", "Избегайте раскачивания веса, чтобы изолировать бицепсы во время сгибания."], "title": "Сгибание на бицепс с гантелями лёжа на наклонной скамье"}}, {"item_id": "ea_abdominal_stretch", "source_content_version": "0023f45a09e6d7e232c586e383480b81", "title": "Abdominal Stretch", "summary": "Sit on the floor with your knees bent and drawn towards your chest", "steps": ["Sit on the floor with your knees bent and drawn towards your chest", "Wrap your arms around your knees, hugging them tightly", "Hold the stretch in this position, allowing your back to round slightly and your head to relax forward", "After holding the stretch for the desired amount of time, release your arms and return to a neutral sitting position"], "tips": ["Keep your shoulders relaxed and avoid hunching them up towards your ears", "Breathe deeply and steadily throughout the stretch to help relax your muscles", "Perform the stretch slowly and avoid any sudden movements to prevent strain"], "equipment_id": null, "muscles": ["core", "lower_back"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Сядьте на пол, колени согнуты и подтянуты к груди.", "Обхватите колени руками, крепко прижимая их к себе.", "Удерживайте растяжку в этом положении, позволяя спине слегка округлиться, а голове расслабленно опуститься вперед.", "После удержания растяжки в течение желаемого времени, расслабьте руки и вернитесь в нейтральное сидячее положение."], "summary": "Сядьте на пол, колени согнуты и подтянуты к груди.", "tips": ["Держите плечи расслабленными и избегайте поднимать их к ушам.", "Дышите глубоко и ровно на протяжении всей растяжки, чтобы помочь расслабить мышцы.", "Выполняйте растяжку медленно и избегайте резких движений, чтобы предотвратить напряжение."], "title": "Растяжка мышц живота"}}, {"item_id": "ea_box_jump_squats", "source_content_version": "47af82493057af6c0b1bc84d6726e7e9", "title": "Box Jump Squats", "summary": "Stand with your feet shoulder-width apart in front of a box", "steps": ["Stand with your feet shoulder-width apart in front of a box", "Bend your knees and hips, swinging your arms back to prepare for the jump", "Explosively jump onto the box, landing softly in a squat position", "Jump back down to the floor, returning to the starting position and repeat"], "tips": ["Focus on landing softly to reduce impact on your joints", "Engage your core throughout the jump to maintain stability and control", "Use your arms to generate momentum and help propel your body upward"], "equipment_id": "plyo_box", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, перед коробкой.", "Согните колени и бёдра, отводя руки назад, чтобы подготовиться к прыжку.", "Взрывным движением запрыгните на коробку, мягко приземляясь в положение приседа.", "Спрыгните обратно на пол, возвращаясь в исходное положение, и повторите."], "summary": "Встаньте, поставив стопы на ширине плеч, перед коробкой.", "tips": ["Сосредоточьтесь на мягком приземлении, чтобы уменьшить нагрузку на суставы.", "Держите мышцы кора напряжёнными на протяжении всего прыжка для поддержания стабильности и контроля.", "Используйте руки для создания импульса и помощи в подъёме тела вверх."], "title": "Приседания с прыжком на коробку"}}, {"item_id": "ea_lying_glute_stretch", "source_content_version": "66a9feefb74c0548e406d1bb4fb3c6b8", "title": "Lying Glute Stretch", "summary": "Lie on your back with your knees bent and feet flat on the floor", "steps": ["Lie on your back with your knees bent and feet flat on the floor", "Cross your right ankle over your left knee, forming a figure-four position", "Grasp the back of your left thigh with both hands and gently pull your left leg towards your chest. Hold the stretch for 15-30 seconds, feeling the stretch in your right glute and hip", "Slowly release your left leg and return to the starting position. Repeat the stretch with your left ankle crossed over your right knee. Alternate sides for the desired number of repetitions"], "tips": ["Keep your head and shoulders relaxed on the floor to avoid tension in your neck and upper back", "Avoid pulling too hard; go as far as your flexibility allows without causing pain", "Use a towel or strap if needed to assist in pulling your leg towards your chest"], "equipment_id": null, "muscles": ["glutes", "lower_back"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на спину, согнув колени и поставив стопы на пол.", "Положите правую лодыжку на левое колено, образуя позу «четвёрки» (figure-four).", "Возьмитесь обеими руками за заднюю часть левого бедра и осторожно потяните левую ногу к груди. Удерживайте растяжку в течение 15-30 секунд, чувствуя растяжение в правой ягодичной мышце и бедре.", "Медленно отпустите левую ногу и вернитесь в исходное положение. Повторите растяжку, положив левую лодыжку на правое колено. Чередуйте стороны для желаемого количества повторений."], "summary": "Лягте на спину, согнув колени и поставив стопы на пол.", "tips": ["Держите голову и плечи расслабленными на полу, чтобы избежать напряжения в шее и верхней части спины.", "Избегайте слишком сильного натяжения; идите настолько далеко, насколько позволяет ваша гибкость, не вызывая боли.", "Используйте полотенце или ремень, если необходимо, чтобы помочь подтянуть ногу к груди."], "title": "Растяжка ягодичных мышц лёжа"}}, {"item_id": "ea_dumbbell_incline_one_arm_lateral_raise", "source_content_version": "ad9be2be0834670900e377f91b4d0699", "title": "Dumbbell Incline One Arm Lateral Raise", "summary": "Set an incline bench to a 45-degree angle and lie on your side with your lower arm resting on the bench. Hold a dumbbell with your upper hand, arm extended at your side with your palm facing your body", "steps": ["Set an incline bench to a 45-degree angle and lie on your side with your lower arm resting on the bench. Hold a dumbbell with your upper hand, arm extended at your side with your palm facing your body", "Raise the dumbbell up in an arc motion until your arm is straight at shoulder level", "Lower the dumbbell back to the starting position with control. Repeat for the desired number of repetitions, then switch to the other side"], "tips": ["Exhale as you lift the dumbbell and inhale as you lower it", "Hold the bench edge with your free hand to supportyour body during the exercise", "Maintain a slight bend in your elbow throughout the movement to reduce strain on the joint"], "equipment_id": "bench_press", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Установите наклонную скамью под углом 45 градусов и лягте на бок, нижняя рука лежит на скамье. Держите гантель верхней рукой, рука вытянута в сторону, ладонь обращена к телу.", "Поднимите гантель вверх дугообразным движением, пока рука не выпрямится на уровне плеча.", "Контролируемо опустите гантель обратно в исходное положение. Повторите желаемое количество повторений, затем поменяйте сторону."], "summary": "Установите наклонную скамью под углом 45 градусов и лягте на бок, нижняя рука лежит на скамье. Держите гантель верхней рукой, рука вытянута в сторону, ладонь обращена к телу.", "tips": ["Выдыхайте, поднимая гантель, и вдыхайте, опуская ее.", "Держитесь свободной рукой за край скамьи, чтобы поддерживать тело во время упражнения.", "Сохраняйте небольшой сгиб в локте на протяжении всего движения, чтобы уменьшить нагрузку на сустав."], "title": "Подъём гантели в сторону одной рукой на наклонной скамье"}}, {"item_id": "ea_elbow_back_stretch", "source_content_version": "529dde99d79144e7d3fc588429370d9d", "title": "Elbow Back Stretch", "summary": "Stand with your feet shoulder-width apart and your arms at your sides", "steps": ["Stand with your feet shoulder-width apart and your arms at your sides", "Bring both hands behind you and place them on your lower back, fingers pointing downward", "Gently push your hips forward and lean your upper body backward, feeling a stretch in your chest and shoulders", "Hold the stretch for a few seconds, then return to the starting position. Repeat the movement for the desired number of repetitions"], "tips": ["Engage your core muscles to support your lower back as you lean backward", "Avoid overextending your lower back; only lean back as far as comfortable without causing pain", "Breathe deeply throughout the exercise, inhaling as you prepare to stretch and exhaling as you lean back"], "equipment_id": null, "muscles": ["chest", "shoulders", "traps"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, руки вдоль тела.", "Заведите обе руки за спину и положите их на поясницу, пальцы направлены вниз.", "Аккуратно толкните бёдра вперёд и отклоните верхнюю часть тела назад, чувствуя растяжение в груди и плечах.", "Удерживайте растяжку несколько секунд, затем вернитесь в исходное положение. Повторите движение желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, руки вдоль тела.", "tips": ["Напрягите мышцы кора, чтобы поддержать поясницу при наклоне назад.", "Избегайте чрезмерного прогиба в пояснице; наклоняйтесь назад только до комфортного уровня без боли.", "Глубоко дышите на протяжении всего упражнения, вдыхая при подготовке к растяжке и выдыхая при наклоне назад."], "title": "Растяжка спины с локтями"}}, {"item_id": "ea_lunging_straight_leg_calf_stretch", "source_content_version": "2d0c984594fff8bd00baad70c42b8d48", "title": "Lunging Straight Leg Calf Stretch", "summary": "Stand upright with your feet hip-width apart and your arms at your sides", "steps": ["Stand upright with your feet hip-width apart and your arms at your sides", "Step your right foot back into a lunge position, keeping your right leg straight and your heel on the floor. Bend your left knee slightly, keeping your left foot flat on the floor", "Lean forward slightly, pressing your hips downward and feeling the stretch in your right calf. Hold this position for 15-30 seconds", "Return to the starting position and switch legs, stepping your left foot back and repeating the stretch"], "tips": ["Ensure your back leg remains straight and your heel stays on the floor to maximize the stretch in your calf", "Keep your front knee aligned with your ankle to avoid unnecessary strain on your joints", "Perform the stretch on a stable, non-slip surface to prevent slipping or discomfort"], "equipment_id": null, "muscles": ["calves", "hamstrings"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте прямо, ноги на ширине бедер, руки вдоль тела.", "Шагните правой ногой назад в положение выпада, держите правую ногу прямо, а пятку на полу. Слегка согните левое колено, левая стопа прижата к полу.", "Слегка наклонитесь вперед, надавливая бедрами вниз и чувствуя растяжение в правой икроножной мышце. Удерживайте это положение 15-30 секунд.", "Вернитесь в исходное положение и поменяйте ноги, отводя левую ногу назад и повторяя растяжку."], "summary": "Встаньте прямо, ноги на ширине бедер, руки вдоль тела.", "tips": ["Убедитесь, что задняя нога остается прямой, а пятка прижата к полу, чтобы максимально растянуть икроножную мышцу.", "Держите переднее колено на одной линии с лодыжкой, чтобы избежать ненужного напряжения суставов.", "Выполняйте растяжку на устойчивой, нескользящей поверхности, чтобы предотвратить скольжение или дискомфорт."], "title": "Растяжка икроножной мышцы в выпаде с прямой ногой"}}, {"item_id": "ea_band_kneeling_rear_kick", "source_content_version": "88114750a9fb8a24e3d70ee689d8e305", "title": "Band Kneeling Rear Kick", "summary": "Kneel on all fours, on your knees and elbows, with your hands holding the handles of the band and the band looped around your right foot", "steps": ["Kneel on all fours, on your knees and elbows, with your hands holding the handles of the band and the band looped around your right foot", "Extend your right leg straight back, keeping your foot flexed and your leg in level with your body", "Squeeze your glutes at the top of the movement, ensuring a full contraction", "Slowly return your right leg to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Exhale as you extend your leg back and inhale as you return to the starting position", "Maintain a neutral spine to avoid strain on your lower back", "Avoid rotating your hips outward; maintain square hips to the floor"], "equipment_id": "resistance_bands", "muscles": ["glutes", "hamstrings", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте на четвереньки, на колени и локти, руки держат ручки ленты, а лента обёрнута вокруг правой стопы.", "Выпрямите правую ногу прямо назад, удерживая стопу согнутой и ногу на уровне тела.", "Сожмите ягодичные мышцы в верхней точке движения, обеспечивая полное сокращение.", "Медленно и подконтрольно верните правую ногу в исходное положение. Повторите желаемое количество повторений."], "summary": "Встаньте на четвереньки, на колени и локти, руки держат ручки ленты, а лента обёрнута вокруг правой стопы.", "tips": ["Выдыхайте, когда отводите ногу назад, и вдыхайте, когда возвращаетесь в исходное положение.", "Сохраняйте нейтральное положение позвоночника, чтобы избежать нагрузки на поясницу.", "Избегайте вращения бёдер наружу; держите бёдра ровно по отношению к полу."], "title": "Отведение ноги назад на коленях с резиновой лентой"}}, {"item_id": "ea_ez_bar_standing_front_raise", "source_content_version": "7358ae403b0ad7aa7ae8a3ac309cf49b", "title": "EZ Bar Standing Front Raise", "summary": "Stand with your feet shoulder-width apart, holding an EZ bar with an overhand grip (palms facing down), hands placed slightly wider than shoulder-width apart. Let the bar hang in front of your thighs", "steps": ["Stand with your feet shoulder-width apart, holding an EZ bar with an overhand grip (palms facing down), hands placed slightly wider than shoulder-width apart. Let the bar hang in front of your thighs", "Raise the EZ bar directly in front of you to shoulder height until parallel to the floor", "Pause briefly at the top of the movement, squeezing your shoulder muscles", "Lower the bar back to the starting position in a controlled manner"], "tips": ["Avoid using momentum to lift the bar; focus on a controlled motion", "Exhale as you lift the bar and inhale as you lower it", "Keep your wrists in a neutral position to avoid strain"], "equipment_id": "ez_curl_bar", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив ноги на ширину плеч, держа EZ-гриф верхним хватом (ладони смотрят вниз), руки расположены чуть шире плеч. Позвольте грифу свободно свисать перед бедрами.", "Поднимите EZ-гриф прямо перед собой до уровня плеч, пока он не станет параллелен полу.", "Кратковременно задержитесь в верхней точке движения, сжимая мышцы плеч.", "Подконтрольно опустите гриф обратно в исходное положение."], "summary": "Встаньте, расставив ноги на ширину плеч, держа EZ-гриф верхним хватом (ладони смотрят вниз), руки расположены чуть шире плеч. Позвольте грифу свободно свисать перед бедрами.", "tips": ["Избегайте использования инерции для подъема грифа; сосредоточьтесь на контролируемом движении.", "Выдыхайте, поднимая гриф, и вдыхайте, опуская его.", "Держите запястья в нейтральном положении, чтобы избежать напряжения."], "title": "Подъём EZ-грифа перед собой стоя"}}, {"item_id": "ea_in_and_out_squats_jump_bodyweight_2", "source_content_version": "eaa5b5b23264fc02c49832fc229fbfa7", "title": "In and Out Squats Jump Bodyweight (2)", "summary": "Stand tall with your spine neutral, feet shoulder-width apart, and clasp your hands in front of your chest", "steps": ["Stand tall with your spine neutral, feet shoulder-width apart, and clasp your hands in front of your chest", "Lower your hips, jump up and land into a squat position with your knees bent, thighs parallel to the floor, and feet placed wider than your shoulder width", "Then lower your hips again, jump up, and land into a squat position with your knees bent, thighs parallel to the floor, and feet placed hip-width apart this time", "Repeat by jumping in and out alternately"], "tips": ["Land softly on your forefeet to reduce impact on your joints", "Ensure your knees are aligned with your toes when you squat to avoid strain", "Move quickly but with control to maximize the effectiveness of the exercise and prevent injury"], "equipment_id": null, "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте прямо, спина в нейтральном положении, стопы на ширине плеч, руки сцеплены перед грудью.", "Опустите бедра, выпрыгните вверх и приземлитесь в положение приседа с согнутыми коленями, бедрами параллельно полу и стопами шире плеч.", "Затем снова опустите бедра, выпрыгните вверх и приземлитесь в положение приседа с согнутыми коленями, бедрами параллельно полу, но на этот раз стопы на ширине бедер.", "Повторяйте, чередуя прыжки внутрь и наружу."], "summary": "Встаньте прямо, спина в нейтральном положении, стопы на ширине плеч, руки сцеплены перед грудью.", "tips": ["Приземляйтесь мягко на переднюю часть стопы, чтобы уменьшить нагрузку на суставы.", "Убедитесь, что колени находятся на одной линии с носками при приседании, чтобы избежать перенапряжения.", "Двигайтесь быстро, но подконтрольно, чтобы максимизировать эффективность упражнения и предотвратить травмы."], "title": "Приседания с прыжками внутрь и наружу (собственный вес) (2)"}}, {"item_id": "ea_band_incline_alternate_hammer_curl", "source_content_version": "019ccf84f9cad115db462e3c57a24b7d", "title": "Band Incline Alternate Hammer Curl", "summary": "Sit on an incline bench with your feet flat on the floor. Place the resistance band under the bench and hold one handle of the band in each hand using a hammer grip (palms facing each other), letting your arms hang straight down", "steps": ["Sit on an incline bench with your feet flat on the floor. Place the resistance band under the bench and hold one handle of the band in each hand using a hammer grip (palms facing each other), letting your arms hang straight down", "Curl the right handle towards your shoulder, keeping your elbow stationary and close to your body until your hand is near your shoulder", "Slowly lower your right hand back to the starting position with control and repeat the movement with your left hand", "Continue alternating between right and left arms for the desired number of repetitions"], "tips": ["Ensure the resistance band is securely placed under the bench to avoid slipping", "Exhale as you curl the band handle towards your shoulder and inhale as you lower it back down", "Focus on squeezing your biceps at the top of the movement"], "equipment_id": "bench_press", "muscles": ["biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на наклонную скамью, поставив ступни на пол. Поместите резиновую ленту под скамью и держите по одной ручке ленты в каждой руке молотковым хватом (ладони смотрят друг на друга), позволив рукам свободно свисать вниз.", "Согните правую руку с ручкой к плечу, удерживая локоть неподвижным и прижатым к телу, пока кисть не окажется около плеча.", "Медленно и подконтрольно опустите правую руку обратно в исходное положение и повторите движение левой рукой.", "Продолжайте чередовать правую и левую руки желаемое количество повторений."], "summary": "Сядьте на наклонную скамью, поставив ступни на пол. Поместите резиновую ленту под скамью и держите по одной ручке ленты в каждой руке молотковым хватом (ладони смотрят друг на друга), позволив рукам свободно свисать вниз.", "tips": ["Убедитесь, что резиновая лента надёжно закреплена под скамьёй, чтобы избежать соскальзывания.", "Выдыхайте, когда сгибаете руку с ручкой ленты к плечу, и вдыхайте, когда опускаете её обратно.", "Сосредоточьтесь на сжатии бицепсов в верхней точке движения."], "title": "Попеременное сгибание рук с резиновой лентой на наклонной скамье молотковым хватом"}}, {"item_id": "ea_dumbbell_hammer_curl_simultaneous_arms", "source_content_version": "99a6502786f83871437320bf9b7f9aeb", "title": "Dumbbell Hammer Curl Simultaneous Arms", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand with a neutral grip (palms facing your torso). Let your arms hang straight down at your sides", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with a neutral grip (palms facing your torso). Let your arms hang straight down at your sides", "Simultaneously curl both dumbbells upward towards your shoulders by bending your elbows, focusing on engaging your biceps and forearms", "Squeeze your biceps at the top of the movement, ensuring the dumbbells reach shoulder height", "Lower the dumbbells back to the starting position with control, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Avoid using momentum; focus on a controlled motion", "Keep your back straight and core engaged to prevent swaying", "Maintain a neutral wrist position to reduce strain on your joints"], "equipment_id": "dumbbell", "muscles": ["biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ноги на ширине плеч, держа по гантели в каждой руке нейтральным хватом (ладони обращены к корпусу). Руки свободно опущены по бокам.", "Одновременно согните обе гантели вверх к плечам, сгибая локти, сосредоточьтесь на работе бицепсов и предплечий.", "Сожмите бицепсы в верхней точке движения, убедившись, что гантели достигают уровня плеч.", "Контролируемо опустите гантели обратно в исходное положение, полностью выпрямив руки. Повторите нужное количес ения в шее.", "Используйте лёгкое давление при скрещивании рук за спиной, чтобы постепенно углубить растяжку.", "Убедитесь, что верхняя часть тела расслаблена, и избегайте форсирования растяжки, чтобы предотвратить дискомфорт или травму."], "title": "Растяжка сгибателей плеча с руками за спиной"}}, {"item_id": "ea_assault_airbike_fast_speed", "source_content_version": "31c297f886261a6a4692a32c963be2c2", "title": "Assault Airbike Fast Speed", "summary": "Sit on the Assault AirBike's seat and adjust it to a comfortable height. Place your feet on the pedals and your hands on the handles", "steps": ["Sit on the Assault AirBike's seat and adjust it to a comfortable height. Place your feet on the pedals and your hands on the handles", "Begin pedaling at a moderate pace. Simultaneously, push and pull the handles back and forth in a coordinated motion with your legs", "Gradually increase your pedaling speed and the intensity of your arm movements to achieve a fast pace", "Continue pedaling and moving the handles at a fast pace for the desired duration or number of intervals"], "tips": ["Breathe steadily and maintain a consistent pace throughout the exercise", "Focus on using both your legs and arms to distribute the effort evenly and prevent fatigue", "Perform the movement with control to maximize efficiency and reduce injury risk"], "equipment_id": "air_bike", "muscles": ["quads", "hamstrings", "glutes", "calves", "shoulders", "traps", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на сиденье Assault AirBike и отрегулируйте его на удобную высоту. Поставьте ноги на педали, а руки на рукоятки", "Начните крутить педали в умеренном темпе. Одновременно толкайте и тяните рукоятки вперёд-назад в скоординированном движении с ногами", "Постепенно увеличивайте скорость вращения педалей и интенсивность движений руками, чтобы достичь быстрого темпа", "Продолжайте крутить педали и двигать рукоятки в быстром темпе в течение желаемой продолжительности ил squat by bending your knees and lowering your hips until your thighs are parallel to the floor", "Stand back up and tap the balloon again as it comes down, repeating the process"], "tips": ["Start with a shallow squat if you are new to the exercise and gradually increase the depth as you become more comfortable", "Focus on keeping your back straight and your knees aligned with your toes during the squat", "Perform the movement smoothly and with control to maximize muscle activation and coordination"], "equipment_id": null, "muscles": ["quads", "glutes", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширину плеч, держа воздушный шар перед собой.", "Подбросьте воздушный шар в воздух и легко постукивайте по нему, чтобы он оставался в воздухе.", "Пока воздушный шар находится в воздухе, выполните присед, сгибая колени и опуская бедра, пока бедра не станут параллельны полу.", "Встаньте и снова постучите по воздушному шару, когда он опускается, повторяя процесс."], "summary": "Встаньте, расставив стопы на ширину плеч, держа воздушный шар перед собой.", "tips": ["Начните с неглубокого приседа, если вы новичок в этом упражнении, и постепенно увеличивайте глубину по мере привыкания.", "Сосредоточьтесь на том, чтобы держать спину прямо, а колени на одной линии с носками во время приседа.", "Выполняйте движение плавно и контролируемо для максимальной активации мышц и координации."], "title": "Упражнение с воздушным шаром"}}, {"item_id": "ea_side_wrist_pull_stretch", "source_content_version": "a40e9a59f3ce13d29a853711afcfa60a", "title": "Side Wrist Pull Stretch", "summary": "Stand upright with your feet shoulder-width apart", "steps": ["Stand upright with your feet shoulder-width apart", "Extend your right arm across your torso at chest height, keeping it bent and your forearm parallel to the floor", "Bend your left arm and use your left hand to grasp your right hand, gently pulling your right wrist backward to feel a  and controlled motion for the desired duration or number of repetitions"], "tips": ["Focus on quick, controlled movements, keeping your jumps low to minimize impact on your joints", "Use your wrists to swing the rope, rather than your arms, to maintain a smooth and efficient motion", "Wear supportive footwear to protect your feet and ankles during the exercise"], "equipment_id": "skipping_rope", "muscles": ["calves", "quads", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы вместе, держа скакалку рукоятками в каждой руке. Расположите скакалку за собой, готовясь перекинуть её через голову.", "Перекиньте скакалку через голову и, когда она пройдёт под стопами, выполните небольшой прыжок, приземляясь на переднюю часть стопы.", "Немедленно выполните второй, меньший отскок, продолжая движение скакалки и готовясь к следующему перекидыванию.", "Продолжайте в ритме двойного отскока, поддерживая плавное и контролируемое движение в течение желаемого времени или количества повторений."], "summary": "Встаньте, поставив стопы вместе, держа скакалку рукоятками в каждой руке. Расположите скакалку за собой, готовясь перекинуть её через голову.", "tips": ["Сосредоточьтесь на быстрых, контролируемых движениях, делая низкие прыжки, чтобы минимизировать нагрузку на суставы.", "Используйте запястья для вращения скакалки, а не руки, чтобы поддерживать плавное и эффективное движение.", "Носите поддерживающую обувь, чтобы защитить стопы и лодыжки во время упражнения."], "title": "Прыжки со скакалкой с двойным отскоком"}}, {"item_id": "ea_suspension_trainer_with_grips_hanging_leg_hip_raise", "source_content_version": "81b927ccdcbf8f7b60411ec774418de7", "title": "Suspension Trainer with Grips Hanging Leg Hip Raise", "summary": "Adjust the suspension trainer handles to an overhead position. Grasp the handles with an overhand grip (palms facing forward) and hang with your arms fully extended and feet off the floor", "steps": ["Adjust the suspension trainer handles to an overhead position. Grasp the handles with an overhand grip (palms facing forward) and hang with your arms fully extended and feet off the floor", "Engage your core and lift your knees up towards the ceiling to hip height, then pull your hips up to raise your legs to chest height", "Slowly lower your legs back to the starting position with control, keeping your core engaged", "Repeat for the desired number of repetitions"], "tips": ["Maintain a controlled motion to prevent swinging", "Focus on using your core muscles to lift your legs and hips, avoiding excessive use of your hip flexors", "Breathe steadily: exhale as you lift your legs and inhale as you lower them"], "equipment_id": "trx", "muscles": ["core", "lower_back", "shoulders", "traps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Отрегулируйте рукоятки петель TRX в верхнее положение. Возьмитесь за рукоятки верхним хватом (ладони обращены вперед) и повисните, полностью выпрямив руки и оторвав стопы от пола.", "Напрягите корпус и поднимите колени вверх к потолку до уровня бедер, затем подтяните бедра вверх, чтобы поднять ноги до уровня груди.", "Медленно и подконтрольно опустите ноги обратно в исходное положение, сохраняя напряжение в корпусе.", "Повторите желаемое количество повторений."], "summary": "Отрегулируйте рукоятки петель TRX в верхнее положение. Возьмитесь за рукоятки верхним хватом (ладони обращены вперед) и повисните, полностью выпрямив руки и оторвав стопы от пола.", "tips": ["Сохраняйте контролируемое движение, чтобы избежать раскачивания.", "Сосредоточьтесь на использовании мышц корпуса для подъема ног и бедер, избегая чрезмерного использования сгибателей бедра.", "Дышите ровно: выдыхайте, когда поднимаете ноги, и вдыхайте, когда опускаете их."], "title": "Подъём ног и таза в висе на петлях TRX"}}, {"item_id": "ea_resistance_band_hip_thrust_version_2", "source_content_version": "e222275264a5bd0f9cb52c25c23f57bc", "title": "Resistance Band Hip Thrust (version 2)", "summary": "Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Place a loop resistance band firmly under your heels and pass it over your thighs close to your hips. Keep your hands extended by your sides with hands firm on the floor", "steps": ["Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Place a loop resistance band firmly under your heels and pass it over your thighs close to your hips. Keep your hands extended by your sides with hands firm on the floor", "Engage your core and glutes, and lift your hips towards the ceiling, forming a straight line from your shoulders to your knees", "Hold the bridge position for a moment, squeezing your glutes at the top", "Slowly lower your hips back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Avoid arching your lower back; keep a straight line from your shoulders to your knees", "Focus on engaging your glutes throughout the movement", "Exhale as you lift your hips and press your knees outward, and inhale as you bring your knees back together and lower your hips"], "equipment_id": "resistance_bands", "muscles": ["glutes", "core", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, колени согнуты, стопы плотно прижаты к полу, на ширине бедер. Поместите петлевую резиновую ленту плотно под пятки и пропустите ее через бедра близко к тазу. Держите руки вытянутыми вдоль тела, ладони плотно прижаты к полу.", "Напрягите корпус и ягодицы, и поднимите бедра к потолку, образуя прямую линию от плеч до коленей.", "Удерживайте положение моста на мгновение, сжимая ягодицы в верхней точке.", "Медленно и контролируемо опустите бедра обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину, колени согнуты, стопы плотно прижаты к полу, на ширине бедер. Поместите петлевую резиновую ленту плотно под пятки и пропустите ее через бедра близко к тазу. Держите руки вытянутыми вдоль тела, ладони плотно прижаты к полу.", "tips": ["Избегайте прогиба в пояснице; держите прямую линию от плеч до коленей.", "Сосредоточьтесь на задействовании ягодичных мышц на протяжении всего движения.", "Выдыхайте, когда поднимаете бедра и разводите колени в стороны, и вдыхайте, когда сводите колени обратно и опускаете бедра."], "title": "Ягодичный мост с резиновой лентой (вариант 2)"}}, {"item_id": "ea_cable_upright_row_with_straight_bar", "source_content_version": "8ad00c2ba8c7b9940df2cc32b9049844", "title": "Cable Upright Row with Straight Bar", "summary": "Stand with your feet shoulder-width apart, facing the cable machine with a straight bar attached to the low pulley. Grasp the bar with both hands using an overhand grip (palms facing down), hands shoulder-width apart", "steps": ["Stand with your feet shoulder-width apart, facing the cable machine with a straight bar attached to the low pulley. Grasp the bar with both hands using an overhand grip (palms facing down), hands shoulder-width apart", "Pull the bar upwards only as high as stays comfortable for your shoulders by bending your elbows and raising your upper arms, leading with your elbows, keeping the bar close to your body. Stop earlier if you feel pinching or pain in the shoulder", "Slowly lower the bar back to the starting position with control", "Repeat for the desired number of repetitions"], "tips": ["Keep your back straight and avoid using momentum", "Keep your elbows higher than your wrists throughout the movement", "Exhale as you pull the straight bar up and inhale as you lower it back down"], "equipment_id": "cable_machine", "muscles": ["shoulders", "traps", "biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ноги на ширине плеч, лицом к блочному тренажеру с прямым грифом, прикрепленным к нижнему блоку. Возьмитесь за гриф обеими руками верхним хватом (ладони вниз), поставив руки на ширине плеч.", "Тяните гриф вверх только на ту высоту, которая остаётся комфортной для плеч, сгибая локти и поднимая плечи, ведя локтями вверх, держа гриф близко к телу. Остановитесь раньше, если чувствуете защемление или боль в плече.", "Медленно и подконтрольно опустите гриф обратно в исходное положение.", "Повторите желаемое количество повторений."], "summary": "Встаньте, поставив ноги на ширине плеч, лицом к блочному тренажеру с прямым грифом, прикрепленным к нижнему блоку. Возьмитесь за гриф обеими руками верхним хватом (ладони вниз), поставив руки на ширине плеч.", "tips": ["Держите спину прямо и избегайте использования инерции.", "Держите локти выше запястий на протяжении всего движения.", "Выдыхайте, поднимая прямой гриф вверх, и вдыхайте, опуская его обратно вниз."], "title": "Тяга прямого грифа к подбородку на блоке"}}, {"item_id": "ea_dumbbell_face_down_lying_shoulder_press", "source_content_version": "3937778afc687ee506e1a27f3ec5cb70", "title": "Dumbbell Face Down Lying Shoulder Press", "summary": "Lie face down on a flat bench with your legs bent at 90 degrees and crossed together. Hold a dumbbell in each hand, with your arms bent and elbows pointing outwards at shoulder height", "steps": ["Lie face down on a flat bench with your legs bent at 90 degrees and crossed together. Hold a dumbbell in each hand, with your arms bent and elbows pointing outwards at shoulder height", "Begin with the dumbbells at shoulder level, palms facing the floor. Press the dumbbells forward by extending your arms until your arms are fully extended but not locked out", "Slowly bring the dumbbells back to the starting position at shoulder level, maintaining control throughout the movement", "Repeat for the desired number of repetitions"], "tips": ["Ensure your wrists remain straight and aligned with your forearms", "Keep your chest and abdomen firmly against the bench to avoid arching your back", "Use a weight that allows you to maintain proper form throughout the e . Rest your forearms on the bench with your wrists hanging over the edge and allow them to hang down", "steps": ["Kneel in front of a flat bench, holding a barbell with both hands, palms facing down (overhand grip). Rest your forearms on the bench with your wrists hanging over the edge and allow them to hang down", "Curl your wrists upward, lifting the barbell as high as you can control while keeping your forearms flat on the bench", "Slowly lower the barbell back to the starting position with control", "Repeat for the desired number of repetitions"], "tips": ["Avoid using your forearms or upper arms to lift the weight; the movement should come from your wrists", "Keep your shoulders relaxed and avoid tensing them during the exercise", "Maintain a steady pace to ensure consistent tension in the muscles"], "equipment_id": "bench_press", "muscles": ["forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте на колени перед горизонтальной скамьей, держа штангу обеими руками прямым хватом. Положите предплечья на скамью так, чтобы запястья свисали с края, и позвольте им свободно опуститься.", "Согните запястья вверх, поднимая штангу на максимальную высоту, которую можете контролировать, при этом предплечья должны оставаться плотно прижатыми к скамье.", "Медленно и под контролем опустите штангу обратно в исходное положение.", "Повторите желаемое количество повторений."], "summary": "Встаньте на колени перед горизонтальной скамьей, держа штангу обеими руками прямым хватом. Положите предплечья на скамью так, чтобы запястья свисали с края, и позвольте им свободно опуститься.", "tips": ["Избегайте использования предплечий или плеч для подъема веса; движение должно исходить от запястий.", "Держите плечи расслабленными и избегайте их напряжения во время упражнения.", "Поддерживайте равномерный темп, чтобы обеспечить постоянное напряжение в мышцах."], "title": "Сгибание запястий со штангой прямым хватом на скамье"}}]}</script>
<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const KEY = 'ct1:' + P.batch_id + ':' + P.slot;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
let cur = 0;

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function rec(id) {
  if (!state[id]) state[id] = { answers: {}, reason_codes: [], note: '',
                                needs_domain_review: false, review_status: null };
  return state[id];
}
function complete(id) {
  const r = state[id];
  if (!r) return false;
  if (r.review_status === 'SKIPPED') return true;
  return P.questions.every(q => r.answers[q.id]);
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); paintNav(); }

function paintNav() {
  const n = document.getElementById('nav');
  n.innerHTML = P.items.map((it, i) =>
    `<button data-i="${i}" class="${complete(it.item_id) ? 'done' : ''} ${i === cur ? 'cur' : ''}">`
    + `${i + 1}. ${esc(it.title || it.item_id)}</button>`).join('');
  const done = P.items.filter(it => complete(it.item_id)).length;
  document.getElementById('progress').textContent =
    done + ' / ' + P.items.length + ' answered';
}

function paint() {
  const it = P.items[cur], r = rec(it.item_id);
  const ru = it.ru || {};
  const list = (label, arr) => (arr && arr.length)
    ? `<h3>${label}</h3><ol>${arr.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '';
  document.getElementById('content').innerHTML =
    `<h2>${esc(it.title)}</h2>`
    + `<p class="muted">${esc(it.item_id)}</p>`
    + (it.summary ? `<p>${esc(it.summary)}</p>` : '')
    + list('Steps', it.steps)
    + ((it.tips && it.tips.length)
        ? `<h3>Tips</h3><ul>${it.tips.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '')
    + `<h3>Metadata</h3><dl>`
    + `<dt>Equipment</dt><dd>${esc(it.equipment_id) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Muscles</dt><dd>${esc((it.muscles || []).join(', ')) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Difficulty</dt><dd>${esc(it.difficulty) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Stretch</dt><dd>${it.is_stretch ? 'yes' : 'no'}</dd></dl>`
    + `<h3>Russian</h3>`
    + (Object.keys(ru).length
        ? `<p><b>${esc(ru.title)}</b></p>` + (ru.summary ? `<p>${esc(ru.summary)}</p>` : '')
          + list('', ru.steps)
        : `<p class="muted">no Russian row</p>`);

  document.getElementById('questions').innerHTML = P.questions.map(q =>
    `<div class="q"><p>${esc(q.text)}</p><div class="opts">`
    + P.verdicts.map(v =>
        `<label><input type="radio" name="${q.id}" value="${v.id}"`
        + `${r.answers[q.id] === v.id ? ' checked' : ''}><span>${esc(v.text)}</span></label>`
      ).join('')
    + `</div></div>`).join('');

  document.getElementById('reasons').innerHTML = P.reasons.map(c =>
    `<label><input type="checkbox" value="${c.id}"`
    + `${r.reason_codes.includes(c.id) ? ' checked' : ''}> ${esc(c.text)}</label>`).join('');

  document.getElementById('note').value = r.note || '';
  document.getElementById('domain').checked = !!r.needs_domain_review;
  document.getElementById('pos').textContent = (cur + 1) + ' of ' + P.items.length;
  paintNav();
  window.scrollTo(0, 0);
}

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cur = +b.dataset.i; paint();
});
document.getElementById('questions').addEventListener('change', e => {
  const r = rec(P.items[cur].item_id);
  r.answers[e.target.name] = e.target.value;
  r.review_status = 'COMPLETE';
  save();
});
document.getElementById('reasons').addEventListener('change', () => {
  const r = rec(P.items[cur].item_id);
  r.reason_codes = [...document.querySelectorAll('#reasons input:checked')].map(i => i.value);
  save();
});
document.getElementById('note').addEventListener('input', e => {
  rec(P.items[cur].item_id).note = e.target.value; save();
});
document.getElementById('domain').addEventListener('change', e => {
  rec(P.items[cur].item_id).needs_domain_review = e.target.checked; save();
});
document.getElementById('skip').addEventListener('click', () => {
  const r = rec(P.items[cur].item_id);
  r.review_status = 'SKIPPED'; r.answers = {};
  save(); paint();
});
document.getElementById('prev').addEventListener('click', () => {
  if (cur > 0) { cur--; paint(); }
});
document.getElementById('next').addEventListener('click', () => {
  if (cur < P.items.length - 1) { cur++; paint(); }
});

document.getElementById('export').addEventListener('click', () => {
  const now = new Date().toISOString();
  const reviews = [];
  for (const it of P.items) {
    const r = state[it.item_id];
    if (!r || !r.review_status) continue;   // never opened: stays UNKNOWN
    const status = r.review_status === 'SKIPPED' ? 'SKIPPED'
      : (P.questions.every(q => r.answers[q.id]) ? 'COMPLETE' : null);
    if (!status) continue;                  // partially answered: not a review
    reviews.push({
      item_id: it.item_id,
      source_content_version: it.source_content_version,
      review_timestamp: r.at || now,
      review_status: status,
      answers: status === 'SKIPPED' ? {} : r.answers,
      reason_codes: r.reason_codes || [],
      note: r.note || '',
      needs_domain_review: !!r.needs_domain_review
    });
  }
  const who = document.getElementById('who').value.trim();
  const out = {
    batch_id: P.batch_id,
    review_schema_version: P.review_schema_version,
    reviewer: who,
    reviewer_slot: P.slot,
    reviewer_kind: 'HUMAN',
    submitted_at: now,
    reviews: reviews
  };
  const text = JSON.stringify(out, null, 2);
  const box = document.getElementById('out');
  box.value = text; box.hidden = false; box.select();
  const a = document.getElementById('dl');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = P.batch_id + '.' + (who || P.slot) + '.json';
  a.hidden = false;
  document.getElementById('exportnote').textContent =
    reviews.length + ' of ' + P.items.length + ' rows returned. Rows you did '
    + 'not open are absent from the file and count as NOT REVIEWED, not as clean.';
});

paint();
</script>
</body>
</html>
