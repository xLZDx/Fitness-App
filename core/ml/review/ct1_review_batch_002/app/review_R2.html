achine", "muscles": ["biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью Скотта, поставив стопы на пол. Прикрепите прямой гриф к нижнему блоку тросового тренажера и возьмитесь за гриф обеими руками, на ширине плеч, ладонями вверх.", "Расположите предплечья на подушке скамьи Скотта и полностью выпрямите руки, держа гриф.", "Сгибайте гриф к плечам, сгибая локти, сокращая бицепсы в верхней точке движения.", "Опустите гриф обратно в исходное положение, полностью выпрямляя руки. Повторите желаемое количество повторений."], "summary": "Сядьте на скамью Скотта, поставив стопы на пол. Прикрепите прямой гриф к нижнему блоку тросового тренажера и возьмитесь за гриф обеими руками, на ширине плеч, ладонями вверх.", "tips": ["Выдыхайте, когда сгибаете гриф вверх, и вдыхайте, когда опускаете его обратно.", "Сохраняйте нейтральное положение запястья, чтобы избежать напряжения.", "Сосредоточьтесь на сокращении бицепсов в верхней точке движения."], "title": "Сгибание на бицепс на скамье Скотта на блоке"}}, {"item_id": "ea_barbell_landmine_side_bend", "source_content_version": "fa243b9683c3410cdeb8085162e7813e", "title": "Barbell Landmine Side Bend", "summary": "Stand side-on to the landmine and hold the loaded bar end in the outside hand", "steps": ["Stand side-on to the landmine and hold the loaded bar end in the outside hand", "Stand tall with your feet hip width apart and your free hand on your head", "Keep both shoulders facing forward, not rotating", "Bend sideways toward the weight, letting it travel down your leg", "Pull yourself back upright using the opposite side, then swap sides"], "tips": [], "equipment_id": "barbell", "muscles": ["core"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Нагружает мышцы по боковой поверхности корпуса, которые держат вас прямо, когда вес только с одной стороны. Сила там не даёт заваливаться при переноске тяжёлой сумки или ребёнка на одном боку.", "steps": ["Встаньте боком к лендмайну и возьмите нагруженный конец грифа дальней рукой", "Стойте прямо, стопы на ширине таза, свободная ладонь у головы", "Оба плеча смотрят вперёд, без разворота", "Наклонитесь вбок к весу, позволяя ему уйти вдоль ноги", "Выпрямитесь усилием противоположной стороны и смените сторону"], "summary": "Встаньте боком к лендмайну и возьмите нагруженный конец грифа дальней рукой", "title": "Наклоны в сторону в Landmine со штангой"}}, {"item_id": "ea_plate_deficit_pushup", "source_content_version": "4bec5d8610cc8332dfe013e928ebc017", "title": "Plate Deficit Pushup", "summary": "Place two weight plates on the floor a little wider than shoulder width", "steps": ["Place two weight plates on the floor a little wider than shoulder width", "Take a push-up position with one hand on each plate and your body in a straight line", "Brace your stomach and glutes so your hips stay level", "Lower until your chest drops below the level of your hands", "Push back up to straight arms, keeping the elbows from flaring wide"], "tips": [], "equipment_id": "weight_plates", "muscles": ["chest"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Ладони на блинах позволяют груди опуститься ниже них — добавляется та часть амплитуды, которую отжимание от пола обрезает. Именно это растяжение внизу и даёт основной прирост.", "steps": ["Положите два блина на пол чуть шире плеч", "Примите упор лёжа, поставив по ладони на каждый блин, тело в прямой линии", "Напрягите живот и ягодицы, таз держите ровно", "Опускайтесь, пока грудь не окажется ниже уровня ладоней", "Отожмитесь до прямых рук, не разводя локти широко"], "summary": "Положите два блина на пол чуть шире плеч", "title": "Отжимания с диском с увеличенной амплитудой"}}, {"item_id": "ea_incline_push_up_on_box", "source_content_version": "a6a5ef5656b3ac1ce352ac1f5f601983", "title": "Incline Push-up (on Box)", "summary": "Stand facing a sturdy box and place your hands on top, close to the edge, slightly wider than shoulder-width apart. Step your feet back to extend your legs behind you, forming a straight line from your head to your heels", "steps": ["Stand facing a sturdy box and place your hands on top, close to the edge, slightly wider than shoulder-width apart. Step your feet back to extend your legs behind you, forming a straight line from your head to your heels", "Engage your core and keep your body straight. Lower your chest towards the box by bending your elbows, keeping them at a 45-degree angle to your body", "Lower yourself until your chest is close to the box, then push through your hands to extend your arms and return to the starting position", "Repeat for the desired number of repetitions"], "tips": ["Exhale as you push up and inhale as you lower yourself down", "Use a sturdy box or bench that can support your weight without moving", "Keep your core engaged to maintain a straight body line and avoid sagging your hips"], "equipment_id": "plyo_box", "muscles": ["chest", "triceps", "shoulders", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте лицом к прочному ящику и поставьте руки на его верхнюю часть, близко к краю, немного шире плеч. Отставьте ноги назад, выпрямляя их за собой, образуя прямую линию от головы до пяток.", "Напрягите пресс и держите тело прямо. Опустите грудь к ящику, сгибая локти и держа их под углом 45 градусов к телу.", "Опускайтесь, пока грудь не окажется близко к ящику, затем оттолкнитесь руками, выпрямляя их, и вернитесь в исходное положение.", "Повторите желаемое количество повторений."], "summary": "Встаньте лицом к прочному ящику и поставьте руки на его верхнюю часть, близко к краю, немного шире плеч. Отставьте ноги назад, выпрямляя их за собой, образуя прямую линию от головы до пяток.", "tips": ["Выдыхайте при подъёме и вдыхайте при опускании.", "Используйте прочный ящик или скамью, которые выдержат ваш вес без движения.", "Держите пресс напряжённым, чтобы сохранять прямую линию тела и избегать провисания бёдер."], "title": "Отжимания от возвышенности (от ящика)"}}, {"item_id": "ea_cable_triceps_push_down_ez_bar_close_grip", "source_content_version": "0b8e1d8ed33e5ba62ebc388b5a94650a", "title": "Cable Triceps Push Down Ez Bar Close Grip", "summary": "Stand facing the cable machine with your feet shoulder-width apart, keeping your spine neutral and knees slightly bent", "steps": ["Stand facing the cable machine with your feet shoulder-width apart, keeping your spine neutral and knees slightly bent", "Grasp the EZ bar attached to the high pulley with both hands, palms facing down, and place your hands closer than shoulder-width apart. Bend your elbows at a 90-degree angle, keeping your elbows close to your body", "Push the EZ bar down towards your thighs by straightening your elbows, keeping your upper arms stationary", "Slowly return to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Keep your elbows close to your body and avoid moving your upper arms", "Focus on squeezing your triceps at the bottom of the movement", "Exhale as you push the EZ bar down and inhale as you return to the starting position"], "equipment_id": "cable_machine", "muscles": ["triceps", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте лицом к блочному тренажеру, ноги на ширине плеч, держите спину в нейтральном положении и колени слегка согнуты.", "Возьмитесь за EZ-гриф, прикрепленный к верхнему блоку, обеими руками, ладони вниз, руки уже ширины плеч. Согните локти под углом 90 градусов, держа локти близко к телу.", "Опустите EZ-гриф вниз к бедрам, выпрямляя локти и удерживая плечи неподвижными.", "Медленно и подконтрольно вернитесь в исходное положение. Повторите желаемое количество повторений."], "summary": "Встаньте лицом к блочному тренажеру, ноги на ширине плеч, держите спину в нейтральном положении и колени слегка согнуты.", "tips": ["Держите локти прижатыми к телу и избегайте движения плечами.", "Сосредоточьтесь на сокращении трицепсов в нижней точке движения.", "Выдыхайте, опуская EZ-гриф вниз, и вдыхайте, возвращаясь в исходное положение."], "title": "Разгибания на трицепс с EZ-грифом на блоке узким хватом"}}, {"item_id": "ea_heavy_bag_sled_drag", "source_content_version": "a8db6d6ef4144ec35055902ce87e8b5f", "title": "Heavy Bag Sled Drag", "summary": "Attach a strap from the bag or sled and hold one end in each hand", "steps": ["Attach a strap from the bag or sled and hold one end in each hand", "Face the load and lean back slightly with your arms straight", "Keep your chest up and your stomach braced", "Walk backwards with short steps, pulling the load toward you", "Cover the set distance, then reset and go again"], "tips": [], "equipment_id": "punching_bag", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Протяжка спиной вперёд нагружает именно переднюю поверхность бёдер, и, поскольку уступающей фазы нет, она позволяет тяжело нагрузить колени с относительно небольшой крепатурой после. Именно поэтому приём иногда включают в программы реабилитации колена под наблюдением — но любое реабилитационное применение должен вести специалист, а не эта страница.", "steps": ["Закрепите лямку на мешке или санях и возьмите по концу в каждую руку", "Встаньте лицом к грузу и слегка отклонитесь назад, руки прямые", "Грудь поднята, живот напряжён", "Идите назад короткими шагами, подтягивая груз к себе", "Пройдите заданное расстояние, вернитесь и повторите"], "summary": "Закрепите лямку на мешке или санях и возьмите по концу в каждую руку", "title": "Перетаскивание саней с тяжелым мешком"}}, {"item_id": "ea_resistance_band_standing_single_arm_shoulder_flexion", "source_content_version": "33b17911f6e572e5ddad3b0ad8ce5b79", "title": "Resistance Band Standing Single Arm Shoulder Flexion", "summary": "Attach one end of a resistance band to a sturdy anchor point at hips height. Stand with your back facing the anchor point and hold the other end of the band in your right hand", "steps": ["Attach one end of a resistance band to a sturdy anchor point at hips height. Stand with your back facing the anchor point and hold the other end of the band in your right hand", "Extend your right arm back, pointing to the anchor point, with your palm facing forward", "Pull the band forward, keeping your arm straight, and until it reaches your lower chest height", "Slowly return your arm to the starting position with control. Repeat for the desired number of repetitions, then switch to the left arm"], "tips": ["Focus on engaging your shoulder and upper back muscles throughout the movement", "Keep your elbow slightly bent to reduce strain on your joints", "Ensure the resistance band stays taut throughout the exercise"], "equipment_id": "resistance_bands", "muscles": ["shoulders", "biceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Прикрепите один конец резиновой ленты к надёжной точке опоры на уровне бёдер. Встаньте спиной к точке опоры и возьмите другой конец ленты в правую руку.", "Вытяните правую руку назад, указывая на точку опоры, ладонью вперёд.", "Тяните ленту вперёд, сохраняя руку прямой, пока она не достигнет уровня нижней части груди.", "Медленно и подконтрольно верните руку в исходное положение. Повторите желаемое количество повторений, затем поменяйте руку."], "summary": "Прикрепите один конец резиновой ленты к надёжной точке опоры на уровне бёдер. Встаньте спиной к точке опоры и возьмите другой конец ленты в правую руку.", "tips": ["Сосредоточьтесь на работе мышц плеча и верхней части спины на протяжении всего движения.", "Держите локоть слегка согнутым, чтобы уменьшить нагрузку на суставы.", "Убедитесь, что резиновая лента остаётся натянутой на протяжении всего упражнения."], "title": "Сгибание плеча одной рукой стоя с резиновой лентой"}}, {"item_id": "ea_kettlebell_split_squat", "source_content_version": "bcf26c686dfbd938b2bd80b01f9cf570", "title": "Kettlebell Split Squat", "summary": "Stand with your feet hip-width apart, holding a kettlebell in each hand with your arms hanging by your sides. Take a step forward with your right foot and position your left foot back, standing on the ball of your left foot", "steps": ["Stand with your feet hip-width apart, holding a kettlebell in each hand with your arms hanging by your sides. Take a step forward with your right foot and position your left foot back, standing on the ball of your left foot", "Bend both knees to lower your body into a split squat. Your back knee should hover just above the floor, and your front thigh should be parallel to the floor", "Push through your right heel to return to the starting position, fully extending both legs", "Repeat for the desired number of repetitions, then switch legs and perform the same number of repetitions on the other side"], "tips": ["Keep your chest up and your back straight throughout the movement", "Ensure your front knee stays aligned with your ankle, not extending past your toes", "Keep your feet hip-width apart to maintain proper alignment and balance"], "equipment_id": "kettlebell", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив ноги на ширине бёдер, держа по гире в каждой руке, руки опущены по бокам. Сделайте шаг вперёд правой ногой и отведите левую ногу назад, стоя на носке левой стопы.", "Согните оба колена, чтобы опустить тело в раздельный присед. Ваше заднее колено должно находиться чуть выше пола, а переднее бедро — параллельно полу.", "Оттолкнитесь правой пяткой, чтобы вернуться в исходное положение, полностью выпрямив обе ноги.", "Повторите желаемое количество повторений, затем поменяйте ноги и выполните такое же количество повторений на другой стороне."], "summary": "Встаньте, расставив ноги на ширине бёдер, держа по гире в каждой руке, руки опущены по бокам. Сделайте шаг вперёд правой ногой и отведите левую ногу назад, стоя на носке левой стопы.", "tips": ["Держите грудь поднятой, а спину прямой на протяжении всего движения.", "Убедитесь, что ваше переднее колено находится на одной линии с лодыжкой и не выходит за пределы носка.", "Держите ноги на ширине бёдер для поддержания правильного положения и равновесия."], "title": "Раздельный присед с гирями"}}, {"item_id": "ea_box_jump_squats", "source_content_version": "47af82493057af6c0b1bc84d6726e7e9", "title": "Box Jump Squats", "summary": "Stand with your feet shoulder-width apart in front of a box", "steps": ["Stand with your feet shoulder-width apart in front of a box", "Bend your knees and hips, swinging your arms back to prepare for the jump", "Explosively jump onto the box, landing softly in a squat position", "Jump back down to the floor, returning to the starting position and repeat"], "tips": ["Focus on landing softly to reduce impact on your joints", "Engage your core throughout the jump to maintain stability and control", "Use your arms to generate momentum and help propel your body upward"], "equipment_id": "plyo_box", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, перед коробкой.", "Согните колени и бёдра, отводя руки назад, чтобы подготовиться к прыжку.", "Взрывным движением запрыгните на коробку, мягко приземляясь в положение приседа.", "Спрыгните обратно на пол, возвращаясь в исходное положение, и повторите."], "summary": "Встаньте, поставив стопы на ширине плеч, перед коробкой.", "tips": ["Сосредоточьтесь на мягком приземлении, чтобы уменьшить нагрузку на суставы.", "Держите мышцы кора напряжёнными на протяжении всего прыжка для поддержания стабильности и контроля.", "Используйте руки для создания импульса и помощи в подъёме тела вверх."], "title": "Приседания с прыжком на коробку"}}, {"item_id": "ea_bodyweight_overhead_triceps_extension", "source_content_version": "4cfeeef32242af49de87388bdcf019a7", "title": "Bodyweight Overhead Triceps Extension", "summary": "Stand with your feet shoulder-width apart and your arms extended overhead with hands holding together, elbows slightly bent", "steps": ["Stand with your feet shoulder-width apart and your arms extended overhead with hands holding together, elbows slightly bent", "Bend your elbows to lower your hands behind your head, engaging your triceps", "Extend your arms back to the starting overhead position", "Repeat the movement for the desired number of repetitions"], "tips": ["Keep your upper arms stationary and close to your ears throughout the exercise to effectively target the triceps", "Engage your core to maintain stability and avoid arching your back", "Perform the movement slowly and with control to maximize muscle activation and prevent injury"], "equipment_id": null, "muscles": ["triceps", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив ноги на ширине плеч, и вытяните руки над головой, соединив ладони, локти слегка согнуты.", "Согните локти, опуская руки за голову, задействуя трицепсы.", "Выпрямите руки обратно в исходное положение над головой.", "Повторите движение желаемое количество повторений."], "summary": "Встаньте, расставив ноги на ширине плеч, и вытяните руки над головой, соединив ладони, локти слегка согнуты.", "tips": ["Держите плечи неподвижными и близко к ушам на протяжении всего упражнения, чтобы эффективно задействовать трицепсы.", "Напрягите мышцы кора, чтобы сохранять стабильность и избегать прогиба в спине.", "Выполняйте движение медленно и подконтрольно, чтобы максимизировать активацию мышц и предотвратить травмы."], "title": "Разгибание рук над головой на трицепс собственным весом"}}, {"item_id": "ea_push_up_and_rotation", "source_content_version": "df0d57a79b590165292d6ea0cb424337", "title": "Push Up and Rotation", "summary": "Begin in a plank position with your hands placed shoulder-width apart and your feet together. Your body should form a straight line from head to heels", "steps": ["Begin in a plank position with your hands placed shoulder-width apart and your feet together. Your body should form a straight line from head to heels", "Lower your body towards the floor by bending your elbows, keeping them close to your body. Perform a push-up", "As you push back up, shift your weight onto your left hand and rotate your torso to the right, raising your right arm towards the ceiling. Your body should form a T-shape", "Return your right hand to the floor and lower your body into another push-up. Repeat the movement, this time rotating to the left and raising your left arm towards the ceiling. Alternate sides for the desired number of repetitions"], "tips": ["Breathe steadily, exhaling as you push up and rotate, and inhaling as you lower your body", "Ensure your body forms a straight line during the push-up and rotation, avoiding any sagging or arching of the back", "Keep your feet hip-width apart to provide a stable base for the rotation"], "equipment_id": null, "muscles": ["chest", "shoulders", "core", "traps", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Примите положение планки, поставив руки на ширине плеч, а ноги вместе. Ваше тело должно образовывать прямую линию от головы до пяток.", "Опустите тело к полу, сгибая локти и держа их близко к телу. Выполните отжимание.", "Поднимаясь, перенесите вес на левую руку и поверните корпус вправо, поднимая правую руку к потолку. Ваше тело должно образовать Т-образную форму.", "Верните правую руку на пол и опустите тело для выполнения еще одного отжимания. Повторите движение, на этот раз поворачиваясь влево и поднимая левую руку к потолку. Чередуйте стороны желаемое количество повторений."], "summary": "Примите положение планки, поставив руки на ширине плеч, а ноги вместе. Ваше тело должно образовывать прямую линию от головы до пяток.", "tips": ["Дышите ровно, выдыхая при подъеме и повороте, и вдыхая при опускании тела.", "Убедитесь, что ваше тело образует прямую линию во  "summary": "Встаньте, стопы на ширине бёдер, положите полотенце под правую стопу.", "tips": ["Выполняйте движение контролируемо, чтобы максимально задействовать мышцы и предотвратить травмы.", "Убедитесь, что переднее колено не выходит за носок, чтобы защитить колени от перегрузки.", "Сосредоточьтесь на отталкивании пяткой при возвращении в исходное положение, чтобы задействовать ягодичные мышцы.", "Используйте гладкую поверхность, чтобы полотенце легко скользило и уменьшало трение."], "title": "Выпады-реверанс со скольжением и полотенцем"}}, {"item_id": "ea_plate_good_morning", "source_content_version": "b1689016ba524144573d5cf3319d6a05", "title": "Plate Good Morning", "summary": "Hold a weight plate against your chest with both hands, feet shoulder width apart", "steps": ["Hold a weight plate against your chest with both hands, feet shoulder width apart", "Soften the knees and set your spine neutral", "Push your hips straight back and lower your chest toward the floor", "Keep the plate glued to your chest and your neck in line with your spine", "Stop at a strong stretch behind the thighs, then squeeze the glutes to stand"], "tips": [], "equipment_id": "weight_plates", "muscles": ["back"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Учит наклону от таза с весом, который можно держать где угодно, — это домашний вариант. Блин у груди вместо штанги на спине нагружает позвоночник гораздо мягче.", "steps": ["Прижмите блин к груди двумя руками, стопы на ширине плеч", "Слегка согните колени и приведите спину в нейтральное положение", "Отведите таз строго назад и опускайте грудь к полу", "Блин остаётся прижатым к груди, шея на одной линии с позвоночником", "Дойдите до сильного растяжения задней поверхности бёдер и выпрямитесь ягодицами"], "summary": "Прижмите блин к груди двумя руками, стопы на ширине плеч", "title": "Наклоны «Доброе утро» с диском"}}, {"item_id": "ea_bent_leg_side_kick_kneeling", "source_content_version": "9d71ca35dffc12dbd5ec6cc7af38f9ef", "title": "Bent Leg Side Kick (kneeling)", "summary": "Start on your hands and knees in a tabletop position, with your wrists aligned under your shoulders and your knees under your hips", "steps": ["Start on your hands and knees in a tabletop position, with your wrists aligned under your shoulders and your knees under your hips", "Lift your right knee off the floor in a swift motion and raise it sideways until it is level with your hip, keeping your leg bent at a 90-degree angle", "Lower your right knee back to the starting position", "Repeat the movement for the desired number of repetitions, then switch to the left leg"], "tips": ["Ensure your hands are directly under your shoulders to provide a stable base for the movement", "Focus on engaging your glutes as you lift your leg to enhance muscle activation", "Avoid leaning to the side; keep your upper body stable during the exercise"], "equipment_id": null, "muscles": ["glutes", "quads", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте на четвереньки в позу стола, запястья под плечами, колени под бедрами.", "Быстрым движением поднимите правое колено от пола и поднимите его в сторону, пока оно не окажется на уровне бедра, сохраняя ногу согнутой под углом 90 градусов.", "Опустите правое колено обратно в исходное положение.", "Повторите движение желаемое количество повторений, затем переключитесь на левую ногу."], "summary": "Встаньте на четвереньки в позу стола, запястья под плечами, колени под бедрами.", "tips": ["Убедитесь, что руки находятся прямо под плечами, чтобы обеспечить стабильную опору для движения.", "Сосредоточьтесь на задействовании ягодичных мышц при подъеме ноги для усиления активации мышц.", "Избегайте наклона в сторону; держите верхнюю часть тела стабильной во время упражнения."], "title": "Отведение согнутой ноги в сторону (на коленях)"}}, {"item_id": "ea_front_squats_dumbbell_over_shoulders", "source_content_version": "e45f7ba0244ad103b58326d30b72f73a", "title": "Front Squats Dumbbell Over Shoulders", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand. Position the dumbbells over your shoulders with your palms facing forward and elbows pointing down", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand. Position the dumbbells over your shoulders with your palms facing forward and elbows pointing down", "Lower your body into a squat by bending your knees and hinging at your hips, pushing your knees lightly outwards as you descend", "Continue lowering yourself until your thighs are just lower than parallel to the floor", "Push through your heels to return to the starting position, extending your hips and knees. Repeat for the desired number of repetitions"], "tips": ["Ensure your knees track over your toes and do not cave inward during the squat", "Maintain a straight back and avoid leaning forward excessively", "Keep your chest up and your shoulders back to maintain proper posture"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа по гантели в каждой руке. Расположите гантели над плечами, ладони обращены вперёд, локти направлены вниз.", "Опуститесь в присед, сгибая колени и отводя бёдра назад, слегка разводя колени в стороны при опускании.", "Продолжайте опускаться, пока бёдра не окажутся чуть ниже параллели с полом.", "Оттолкнитесь пятками, чтобы вернуться в исходное положение, выпрямляя бёдра и колени. Повторите желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, держа по гантели в каждой руке. Расположите гантели над плечами, ладони обращены вперёд, локти направлены вниз.", "tips": ["Следите, чтобы колени двигались над носками и не заваливались внутрь во время приседа.", "Держите спину прямо и избегайте чрезмерного наклона вперёд.", "Держите грудь поднятой, а плечи отведёнными назад, чтобы сохранять правильную осанку."], "title": "Приседания с гантелями на плечах"}}, {"item_id": "ea_dumbbell_overhead_lunge", "source_content_version": "5278c05dc381e6af092201cc20a12fd8", "title": "Dumbbell Overhead Lunge", "summary": "Stand with your feet hip-width apart, holding a dumbbell in each hand. Extend your arms fully overhead with your palms facing each other", "steps": ["Stand with your feet hip-width apart, holding a dumbbell in each hand. Extend your arms fully overhead with your palms facing each other", "Step forward with your right foot, lowering your hips until both knees are bent at approximately 90 degrees. Your back knee should hover just above the floor", "Push through your front heel to return to the starting position, maintaining the dumbbells overhead throughout the movement", "Alternate legs and repeat the movement for the desired number of repetitions"], "tips": ["Maintain a controlled motion to prevent any wobbling or loss of balance", "Avoid leaning forward; keep your torso upright throughout the exercise", "Inhale as you step forward and lower into the lunge, and exhale as you push back to the starting position"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "shoulders", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширину бёдер, держа по гантели в каждой руке. Полностью вытяните руки над головой, ладонями друг к другу.", "Сделайте шаг вперёд правой ногой, опуская бёдра, пока оба колена не согнутся примерно на 90 градусов. Заднее колено должно находиться чуть выше пола.", "Оттолкнитесь передней пяткой, чтобы вернуться в исходное положение, удерживая гантели над головой на протяжении всего движения.", "Чередуйте ноги и повторите движение желаемое количество повторений."], "summary": "Встаньте, расставив стопы на ширину бёдер, держа по гантели в каждой руке. Полностью вытяните руки над головой, ладонями друг к другу.", "tips": ["Сохраняйте контролируемое движение, чтобы предотвратить шатание или потерю равновесия.", "Избегайте наклона вперёд; держите корпус прямо на протяжении всего упражнения.", "Вдыхайте, делая шаг вперёд и опускаясь в выпад, и выдыхайте, отталкиваясь обратно в исходное положение."], "title": "Выпад с гантелями над головой"}}, {"item_id": "ea_seated_calf_raises_dumbbell_on_knee", "source_content_version": "ef8fae8a1836899afff16491dfaad47d", "title": "Seated Calf Raises Dumbbell on Knee", "summary": "Sit on a bench with your forefeet on the edge of a plate, close together, allowing your heels to hang off. Place a dumbbell on both knees, holding them securely with your hands", "steps": ["Sit on a bench with your forefeet on the edge of a plate, close together, allowing your heels to hang off. Place a dumbbell on both knees, holding them securely with your hands", "Raise your heels as high as you can control, pushing through your forefeet and lifting the dumbbells", "Lower your heels back down to the starting position in a controlled manner. Repeat for the desired number of repetitions, then switch to the left leg and repeat"], "tips": ["Focus on using your calf muscles to lift and lower your heel", "Keep the movement slow and controlled to maximize muscle engagement", "Avoid bouncing or using momentum to lift the weight"], "equipment_id": "bench_press", "muscles": ["calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью, поставив переднюю часть стопы на край блина, близко друг к другу, позволяя пяткам свисать. Положите гантель на оба колена, надежно удерживая их руками.", "Поднимите пятки на максимальную высоту, которую можете контролировать, отталкиваясь передней частью стопы и поднимая гантели.", "Медленно опустите пятки обратно в исходное положение. Повторите желаемое количество повторений, затем переключитесь на левую ногу и повторите."], "summary": "Сядьте на скамью, поставив переднюю часть стопы на край блина, близко друг к другу, позволяя пяткам свисать. Положите гантель на оба колена, надежно удерживая их руками.", "tips": ["Сосредоточьтесь на использовании икроножных мышц для подъема и опускания пятки.", "Держите движение медленным и контролируемым, чтобы максимально задействовать мышцы.", "Избегайте подпрыгивания или использования инерции для подъема веса."], "title": "Подъемы на носки сидя с гантелью на колене"}}, {"item_id": "ea_ez_bar_standing_front_raise", "source_content_version": "7358ae403b0ad7aa7ae8a3ac309cf49b", "title": "EZ Bar Standing Front Raise", "summary": "Stand with your feet shoulder-width apart, holding an EZ bar with an overhand grip (palms facing down), hands placed slightly wider than shoulder-width apart. Let the bar hang in front of your thighs", "steps": ["Stand with your feet shoulder-width apart, holding an EZ bar with an overhand grip (palms facing down), hands placed slightly wider than shoulder-width apart. Let the bar hang in front of your thighs", "Raise the EZ bar directly in front of you to shoulder height until parallel to the floor", "Pause briefly at the top of the movement, squeezing your shoulder muscles", "Lower the bar back to the starting position in a controlled manner"], "tips": ["Avoid using momentum to lift the bar; focus on a controlled motion", "Exhale as you lift the bar and inhale as you lower it", "Keep your wrists in a neutral position to avoid strain"], "equipment_id": "ez_curl_bar", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив ноги на ширину плеч, держа EZ-гриф верхним хватом (ладони смотрят вниз), руки расположены чуть шире плеч. Позвольте грифу свободно свисать перед бедрами.", "Поднимите EZ-гриф прямо перед собой до уровня плеч, пока он не станет параллелен полу.", "Кратковременно задержитесь в верхней точке движения, сжимая мышцы плеч.", "Подконтрольно опустите гриф обратно в исходное положение."], "summary": "Встаньте, расставив ноги на ширину плеч, держа EZ-гриф верхним хватом (ладони смотрят вниз), руки расположены чуть шире плеч. Позвольте грифу свободно свисать перед бедрами.", "tips": ["Избегайте использования инерции для подъема грифа; сосредоточьтесь на контролируемом движении.", "Выдыхайте, поднимая гриф, и вдыхайте, опуская его.", "Держите запястья в нейтральном положении, чтобы избежать напряжения."], "title": "Подъём EZ-грифа перед собой стоя"}}, {"item_id": "ea_bodyweight_rear_lunge_front_raise", "source_content_version": "89cfb667e5752507f93a73a9d9b8afff", "title": "Bodyweight Rear Lunge Front Raise", "summary": "Stand with your feet shoulder-width apart and your arms by your sides", "steps": ["Stand with your feet shoulder-width apart and your arms by your sides", "Step backward with your right foot and lower your body into a lunge position while simultaneously raising your arms in front of you to shoulder level", "Ensure your front knee is aligned over your ankle and your back knee is close to the floor", "Push through your front heel to return to the starting position, lowering your arms back to your sides. Repeat the movement with your left foot stepping backward, alternating legs"], "tips": ["Maintain a steady breathing pattern, inhaling as you lunge down and exhaling as you push back up", "Keep your arms straight and parallel to the floor during the front raise to maximize shoulder activation", "Avoid locking your knees when returning to the standing position to keep the tension on your muscles and prevent injury"], "equipment_id": null, "muscles": ["quads", "shoulders", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив ноги на ширине плеч, руки по бокам.", "Шагните правой ногой назад и опустите тело в положение выпада, одновременно поднимая руки перед собой до уровня плеч.", "Убедитесь, что переднее колено находится над лодыжкой, а заднее колено близко к полу.", "Оттолкнитесь передней пяткой, чтобы вернуться в исходное положение, опуская руки обратно по бокам. Повторите движение, шагая левой ногой назад, чередуя ноги."], "summary": "Встаньте, расставив ноги на ширине плеч, руки по бокам.", "tips": ["Поддерживайте ровное дыхание, вдыхая при опускании в выпад и выдыхая при подъеме.", "Держите руки прямыми и параллельными полу во время подъема рук вперед, чтобы максимально задействовать плечи.", "Избегайте блокировки коленей при возвращении в положение стоя, чтобы сохранить напряжение в мышцах и предотвратить травмы."], "title": "Выпады назад с подъемом рук вперед собственным весом"}}, {"item_id": "ea_in_and_out_squats_jump_bodyweight_2", "source_content_version": "eaa5b5b23264fc02c49832fc229fbfa7", "title": "In and Out Squats Jump Bodyweight (2)", "summary": "Stand tall with your spine neutral, feet shoulder-width apart, and clasp your hands in front of your chest", "steps": ["Stand tall with your spine neutral, feet shoulder-width apart, and clasp your hands in front of your chest", "Lower your hips, jump up and land into a squat position with your knees bent, thighs parallel to the floor, and feet placed wider than your shoulder width", "Then lower your hips again, jump up, and land into a squat position with your knees bent, thighs parallel to the floor, and feet placed hip-width apart this time", "Repeat by jumping in and out alternately"], "tips": ["Land softly on your forefeet to reduce impact on your joints", "Ensure your knees are aligned with your toes when you squat to avoid strain", "Move quickly but with control to maximize the effectiveness of the exercise and prevent injury"], "equipment_id": null, "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте прямо, спина в нейтральном положении, стопы на ширине плеч, руки сцеплены перед грудью.", "Опустите бедра, выпрыгните вверх и приземлитесь в положение приседа с согнутыми коленями, бедрами параллельно полу и стопами шире плеч.", "Затем снова опустите бедра, выпрыгните вверх и приземлитесь в положение приседа с согнутыми коленями, бедрами параллельно полу, но на этот раз стопы на ширине бедер.", "Повторяйте, чередуя прыжки внутрь и наружу."], "summary": "Встаньте прямо, спина в нейтральном положении, стопы на ширине плеч, руки сцеплены перед грудью.", "tips": ["Приземляйтесь мягко на переднюю часть стопы, чтобы уменьшить нагрузку на суставы.", "Убедитесь, что колени находятся на одной линии с носками при приседании, чтобы избежать перенапряжения.", "Двигайтесь быстро, но подконтрольно, чтобы максимизировать эффективность упражнения и предотвратить травмы."], "title": "Приседания с прыжками внутрь и наружу (собственный вес) (2)"}}, {"item_id": "ea_dumbbell_one_arm_lateral_raise", "source_content_version": "e5b8f0d74921abd609f4facaa9858b81", "title": "Dumbbell One Arm Lateral Raise", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in one hand by your side with your palm facing your body. Keep your other hand on your hip or relaxed by your side", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in one hand by your side with your palm facing your body. Keep your other hand on your hip or relaxed by your side", "Lift the dumbbell out to the side, maintaining a slight bend in your elbow. Raise your arm until it is parallel to the floor", "Lower the dumbbell back to the starting position, keeping the movement smooth and controlled", "Repeat for the desired number of repetitions, then switch arms"], "tips": ["Perform the movement slowly and deliberately for maximum control", "Avoid using momentum or swinging the dumbbell", "Keep your wrist straight and aligned with your forearm"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ступни на ширине плеч, держа гантель в одной руке сбоку, ладонь смотрит на тело. Другую руку держите на бедре или расслабленно вдоль тела.", "Поднимите гантель в сторону, сохраняя небольшой сгиб в локте. Поднимите руку, пока она не станет параллельна полу.", "Опустите гантель обратно в исходное положение, сохраняя движение плавным и контролируемым.", "Повторите желаемое количество повторений, затем поменяйте руки."], "summary": "Встаньте, поставив ступни на ширине плеч, держа гантель в одной руке сбоку, ладонь смотрит на тело. Другую руку держите на бедре или расслабленно вдоль тела.", "tips": ["Выполняйте движение медленно и обдуманно для максимального контроля.", "Избегайте использования инерции или раскачивания гантели.", "Держите запястье прямым и на одной линии с предплечьем."], "title": "Подъём гантели одной рукой в сторону"}}, {"item_id": "ea_landmine_lunge_to_overhead_press", "source_content_version": "0ad0860cda71f185530a57ec3c3bea01", "title": "Landmine Lunge to Overhead Press", "summary": "Hold the loaded bar end at one shoulder, facing away from the anchor", "steps": ["Hold the loaded bar end at one shoulder, facing away from the anchor", "Step back into a reverse lunge until the back knee nearly touches the floor", "Drive through the whole foot, keeping the heel grounded, to stand back up", "As you finish standing, press the bar up and forward to a straight arm", "Bring the bar back to the shoulder and repeat, alternating legs"], "tips": [], "equipment_id": "barbell", "muscles": ["quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Одно движение нагружает последовательно ноги и плечи, поэтому пульс растёт, а тренируется и то и другое. Пригодится, когда времени мало, а закрыть нужно всё тело.", "steps": ["Держите нагруженный конец грифа у плеча, спиной к точке крепления", "Шагните назад в обратный выпад, пока заднее колено почти не коснётся пола", "Оттолкнитесь всей стопой, удерживая пятку прижатой к полу, и встаньте", "В момент выпрямления выжмите гриф вверх и вперёд до прямой руки", "Верните гриф к плечу и повторите, чередуя ноги"], "summary": "Держите нагруженный конец грифа у плеча, спиной к точке крепления", "title": "Выпад с жимом над головой в Landmine"}}, {"item_id": "ea_barbell_one_leg_hip_thrust", "source_content_version": "032c43051db7bde16309e1dd85776046", "title": "Barbell One Leg Hip Thrust", "summary": "Sit on the floor with your upper back resting against a bench, knees bent, and feet flat on the floor. Place a barbell across your hips, holding it securely with both hands. Lift one leg off the floor, extending it bent out in front of you", "steps": ["Sit on the floor with your upper back resting against a bench, knees bent, and feet flat on the floor. Place a barbell across your hips, holding it securely with both hands. Lift one leg off the floor, extending it bent out in front of you", "Push through the heel of the foot that remains on the floor to lift your hips off the floor until your body forms a straight line from your shoulders to your extended leg", "Squeeze your glutes at the top of the movement and hold for a brief moment, ensuring your hips are fully extended", "Lower your hips back to the starting position with control, stopping just before your glutes touch the floor. Repeat for the desired number of repetitions, then switch to the other leg"], "tips": ["Drive through your heel to engage your glutes and hamstrings effectively", "Focus on the squeeze at the top to maximize glute activation", "Use a pad or towel on the barbell for added comfort on your hips"], "equipment_id": "bench_press", "muscles": ["glutes", "hamstrings", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на пол, уперевшись верхней частью спины в скамью, колени согнуты, стопы на полу. Положите штангу на бедра, крепко удерживая ее обеими руками. Поднимите одну ногу от пола, вытянув ее согнутой перед собой.", "Оттолкнитесь пяткой ноги, которая остается на полу, чтобы поднять бедра от пола, пока ваше тело не образует прямую линию от плеч до вытянутой ноги.", "Сожмите ягодицы в верхней точке движения и задержитесь на короткое мгновение, убедившись, что бедра полностью разогнуты.", "Контролируемо опустите бедра обратно в исходное положение, остановившись непосредственно перед тем, как ягодицы коснутся пола. Повторите желаемое количество повторений, затем поменяйте ногу."], "summary": "Сядьте на пол, уперевшись верхней частью спины в скамью, колени согнуты, стопы на полу. Положите штангу на бедра, крепко удерживая ее обеими руками. Поднимите одну ногу от пола, вытянув ее согнутой перед собой.", "tips": ["Отталкивайтесь пяткой, чтобы эффективно задействовать ягодичные мышцы и бицепсы бедра.", "Сосредоточьтесь на сжатии в верхней точке, чтобы максимально активировать ягодицы.", "Используйте подушку или полотенце на штанге для дополнительного комфорта на бедрах."], "title": "Ягодичный мост со штангой на одной ноге"}}, {"item_id": "ea_lawnmower_row", "source_content_version": "a2dd22eac80e7a50a690d597aa95e79e", "title": "Lawnmower Row", "summary": "Stand in a split stance with a dumbbell in the hand opposite your front foot", "steps": ["Stand in a split stance with a dumbbell in the hand opposite your front foot", "Rest your free hand on the front thigh and hinge forward with a neutral spine", "Let the dumbbell hang low and slightly across your body", "Pull it up past your ribs while opening the chest toward the working side", "Lower it slowly back across the body, then finish the set and switch sides"], "tips": [], "equipment_id": "dumbbell", "muscles": ["back"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Название от движения при запуске газонокосилки, и польза та же: тренируется тяга с лёгким разворотом всего тела — так вы и тянете вещи в жизни, а не в зале.", "steps": ["Встаньте в разножку, гантель в руке, разноимённой передней ноге", "Свободную ладонь положите на переднее бедро и наклонитесь вперёд, сохраняя нейтральное положение позвоночника", "Гантель висит низко и немного поперёк тела", "Тяните её вверх мимо рёбер, раскрывая грудь в сторону рабочей руки", "Медленно опустите обратно поперёк тела, доделайте подход и смените сторону"], "summary": "Встаньте в разножку, гантель в руке, разноимённой передней ноге", "title": "Тяга гантели в наклоне «газонокосильщик»"}}, {"item_id": "ea_bent_arm_chest_stretch", "source_content_version": "246955974c461f1ac7990b5096a3b2e1", "title": "Bent Arm Chest Stretch", "summary": "Stand beside a wall and place your bent arm (elbow at a 90-degree angle) against the wall, with your forearm and hand flat against the wall", "steps": ["Stand beside a wall and place your bent arm (elbow at a 90-degree angle) against the wall, with your forearm and hand flat against the wall", "Gently rotate your torso away from the wall to feel a stretch in your chest", "Hold this position for 15-30 seconds, then switch sides and repeat"], "tips": ["Keep your shoulder down and away from your ear to avoid strain and ensure proper alignment", "Rotate your torso slowly to control the intensity of the stretch and prevent overstretching", "Breathe deeply and steadily to help relax your muscles and enhance the stretch"], "equipment_id": null, "muscles": ["chest", "shoulders", "traps"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте рядом со стеной и прижмите согнутую руку (локоть под углом 90 градусов) к стене, предплечьем и ладонью плоско к стене.", "Аккуратно поверните корпус от стены, чтобы почувствовать растяжение в груди.", "Удерживайте это положение 15-30 секунд, затем поменяйте стороны и повторите."], "summary": "Встаньте рядом со стеной и прижмите согнутую руку (локоть под углом 90 градусов) к стене, предплечьем и ладонью плоско к стене.", "tips": ["Держите плечо опущенным и подальше от уха, чтобы избежать напряжения и обеспечить правильное выравнивание.", "Медленно поворачивайте корпус, чтобы контролировать интенсивность растяжки и предотвратить перерастяжение.", "Дышите глубоко и ровно, чтобы помочь расслабить мышцы и усилить растяжку."], "title": "Растяжка груди согнутой рукой"}}, {"item_id": ости, чтобы безопасно встать на полотно.", "tips": ["Держите голову поднятой и смотрите вперед, избегая взгляда на свои стопы.", "Используйте плавный, естественный шаг, чтобы уменьшить нагрузку на суставы.", "Убедитесь, что скорость беговой дорожки установлена на комфортном уровне, позволяющем сохранять правильную технику."], "title": "Бег на беговой дорожке"}}, {"item_id": "ea_dumbbell_lateral_to_front_raise", "source_content_version": "800f8471172e5295675c8ec87b4a739c", "title": "Dumbbell Lateral to Front Raise", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms at your sides and palms facing your body", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms at your sides and palms facing your body", "Lift the dumbbells laterally to shoulder height, keeping a slight bend in your elbows", "From the lateral position, move the dumbbells forward until they are directly in front of you, keeping them at shoulder height", "Lower the dumbbells back to the starting position with control. Repeat the movement for the desired number of repetitions"], "tips": ["Maintain a slight bend in your elbows to protect your joints", "Keep your shoulders down and back to avoid straining your neck", "Use a weight that allows you to perform the exercise with proper form"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ноги на ширине плеч, держа гантель в каждой руке, руки по бокам и ладони обращены к телу.", "Поднимите гантели в стороны до уровня плеч, сохраняя небольшой сгиб в локтях.", "Из бокового положения переместите гантели вперед, пока они не окажутся прямо перед вами, держа их на уровне плеч.", "Контролируемо опустите гантели обратно в исходное положение. Повторите движение желаемое количество повторений."], "summary": "Встаньте, поставив ноги на ширине плеч, держа гантель в каждой руке, руки по бокам и ладони обращены к телу.", "tips": ["Сохраняйте небольшой сгиб в локтях, чтобы защитить суставы.", "Держите плечи опущенными и отведенными назад, чтобы избежать напряжения в шее.", "Используйте вес, который позволяет выполнять упражнение с правильной техникой."], "title": "Подъём гантелей в стороны, затем вперёд"}}, {"item_id": "ea_45_degree_twisting_hyperextension", "source_content_version": "29cbed27c4561fbed60f0b86693a4c0a", "title": "45 Degree Twisting Hyperextension", "summary": "Fix your feet to the footrests and press your thighs against the padded platform", "steps": ["Fix your feet to the footrests and press your thighs against the padded platform", "Place your hands behind your head and lean forward", "Raise yourself by leaning backward and twisting your torso to a side", "Hold for a second, return to the initial position, and repeat"], "tips": ["Perform the twisting motion smoothly and avoid jerking to prevent strain on your back", "Engage your core muscles throughout the exercise to maintain stability and support your spine", "Breathe steadily, exhaling as you lift and twist, and inhaling as you lower back down"], "equipment_id": "back_extension", "muscles": ["lower_back", "core", "glutes"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Зафиксируйте стопы в упорах для ног и прижмите бёдра к мягкой платформе.", "Положите руки за голову и наклонитесь вперёд.", "Поднимитесь, отклоняясь назад и поворачивая корпус в сторону.", "Задержитесь на секунду, вернитесь в исходное положение и повторите."], "summary": "Зафиксируйте стопы в упорах для ног и прижмите бёдра к мягкой платформе.", "tips": ["Выполняйте поворот плавно и избегайте рывков, чтобы предотвратить нагрузку на спину.", "Напрягайте мышцы кора на протяжении всего упражнения, чтобы сохранить стабильность и поддерживать позвоночник.", "Дышите ровно: выдыхайте при подъёме и повороте, и вдыхайте при опускании."], "title": "Гиперэкстензия с поворотом под углом 45 градусов"}}, {"item_id": "ea_dumbbell_curl_press_extend", "source_content_version": "4c2d55835bf3e076bcae3b4d1a780d6c", "title": "Dumbbell Curl Press Extend", "summary": "Stand tall with a dumbbell in each hand, arms by your sides", "steps": ["Stand tall with a dumbbell in each hand, arms by your sides", "Curl both dumbbells up to your shoulders", "Press them straight overhead until the arms lock out", "Bend the elbows to lower the weights behind your head, then extend back up", "Lower to the shoulders and down to your sides — that is one repetition"], "tips": [], "equipment_id": "dumbbell", "muscles": [], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Три упражнения на руки подряд без опускания гантелей: бицепс, плечи и трицепс работают одним непрерывным подходом. Эффективно, когда мало времени и вес небольшой.", "steps": ["Встаньте прямо, гантели в опущенных руках", "Поднимите обе гантели к плечам", "Выжмите их строго над головой до выпрямления рук", "Согните локти, опуская гантели за голову, затем разогните обратно", "Опустите к плечам и вниз к бокам — это одно повторение"], "summary": "Встаньте прямо, гантели в опущенных руках", "title": "Сгибание рук, жим и разгибание с гантелями"}}, {"item_id": "ea_barbell_good_morning", "source_content_version": "9aee124631ffc99699b67b70e75a5228", "title": "Barbell Good Morning", "summary": "Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with your hands slightly wider than shoulder-width apart", "steps": ["Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with your hands slightly wider than shoulder-width apart", "Slightly bend your knees and hinge at your hips to lower your torso forward. Keep your spine neutral and your head in line with your spine", "Continue to lower your torso until it is nearly parallel to the floor, feeling a stretch in your hamstrings and glutes", "Engage your glutes and hamstrings to raise your torso back to the starting position, keeping your spine neutral and core engaged. Repeat for the desired number of repetitions"], "tips": ["Maintain a neutral spine throughout the movement to prevent lower back strain", "Engage your core to support your lower back and maintain stability", "Hinge at your hips rather than bending your back to ensure proper form"], "equipment_id": "barbell", "muscles": ["lower_back", "hamstrings", "glutes"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив ноги на ширине плеч, держа штангу на верхней части спины. Возьмитесь за гриф руками чуть шире плеч.", "Слегка согните колени и наклонитесь в тазобедренных суставах, чтобы опустить корпус вперед. Держите спину в нейтральном положении и голову на одной линии с позвоночником.", "Продолжайте опускать корпус, пока он не станет почти параллелен полу, чувствуя растяжение в бицепсах бедра и ягодичных мышцах.", "Задействуйте ягодичные мышцы и бицепсы бедра, чтобы поднять корпус обратно в исходное положение, держа спину в нейтральном положении и мышцы кора напряженными. Повторите желаемое количество повторений."], "summary": "Встаньте, поставив ноги на ширине плеч, держа штангу на верхней части спины. Возьмитесь за гриф руками чуть шире плеч.", "tips": ["Сохраняйте нейтральное положение позвоночника на протяжении всего движения, чтобы предотвратить напряжение в пояснице.", "Напрягите мышцы кора, чтобы поддержать поясницу и сохранить стабильность.", "Наклоняйтесь в тазобедренных суставах, а не сгибайте спину, чтобы обеспечить правильную технику."], "title": "Наклоны со штангой на плечах (Good Morning)"}}, {"item_id": "ea_barbell_lying_extension", "source_content_version": "f1cf8040393f957edd7f28d9059b60aa", "title": "Barbell Lying Extension", "summary": "Lie on a flat bench with your feet flat on the floor, holding a barbell with an overhand grip, hands shoulder-width apart. Your arms should be fully extended above your chest", "steps": ["Lie on a flat bench with your feet flat on the floor, holding a barbell with an overhand grip, hands shoulder-width apart. Your arms should be fully extended above your chest", "Slowly lower the barbell by bending your elbows, bringing the barbell towards over your forehead", "When the barbell is behind your head, reverse the movement by extending your elbows to return the barbell to the starting position", "Repeat for the desired number of repetitions, then carefully rack the barbell back onto the bench press rack"], "tips": ["Keep your upper arms stationary and only move your forearms to isolate the triceps", "Lower the barbell slowly and with control to maximize muscle engagement and prevent injury", "Ensure a firm grip on the barbell to maintain control and proper alignment throughout the movement"], "equipment_id": "bench_press", "muscles": ["triceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на плоскую скамью, поставив стопы на пол, держа штангу верхним хватом, руки на ширине плеч. Руки должны быть полностью выпрямлены над грудью", "Медленно опустите штангу, сгибая локти, приближая штангу ко лбу", "Когда штанга окажется за головой, измените движение, выпрямляя локти, чтобы вернуть штангу в исходное положение", "Повторите заданное количество повторений, затем аккуратно верните штангу на стойки"], "summary": "Лягте на плоскую скамью, поставив стопы на пол, держа штангу верхним хватом, руки на ширине плеч. Руки должны быть полностью выпрямлены над грудью", "tips": ["Держите верхнюю часть рук неподвижной и двигайте только предплечьями, чтобы изолировать трицепсы", "Опускайте штангу медленно и под контролем, чтобы максимально задействовать мышцы и предотвратить травмы", "Обеспечьте крепкий хват штанги для поддержания контроля и правильного положения на протяжении всего движения"], "title": "Разгибание рук со штангой лёжа"}}, {"item_id": "ea_dumbbell_face_down_lying_shoulder_press", "source_content_version": "3937778afc687ee506e1a27f3ec5cb70 льности во время упражнения."], "title": "Скручивания сидя на полу"}}]}</script>
<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const KEY = 'ct1:' + P.batch_id + ':' + P.slot;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
let cur = 0;

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function rec(id) {
  if (!state[id]) state[id] = { answers: {}, reason_codes: [], note: '',
                                needs_domain_review: false, review_status: null };
  return state[id];
}
function complete(id) {
  const r = state[id];
  if (!r) return false;
  if (r.review_status === 'SKIPPED') return true;
  return P.questions.every(q => r.answers[q.id]);
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); paintNav(); }

function paintNav() {
  const n = document.getElementById('nav');
  n.innerHTML = P.items.map((it, i) =>
    `<button data-i="${i}" class="${complete(it.item_id) ? 'done' : ''} ${i === cur ? 'cur' : ''}">`
    + `${i + 1}. ${esc(it.title || it.item_id)}</button>`).join('');
  const done = P.items.filter(it => complete(it.item_id)).length;
  document.getElementById('progress').textContent =
    done + ' / ' + P.items.length + ' answered';
}

function paint() {
  const it = P.items[cur], r = rec(it.item_id);
  const ru = it.ru || {};
  const list = (label, arr) => (arr && arr.length)
    ? `<h3>${label}</h3><ol>${arr.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '';
  document.getElementById('content').innerHTML =
    `<h2>${esc(it.title)}</h2>`
    + `<p class="muted">${esc(it.item_id)}</p>`
    + (it.summary ? `<p>${esc(it.summary)}</p>` : '')
    + list('Steps', it.steps)
    + ((it.tips && it.tips.length)
        ? `<h3>Tips</h3><ul>${it.tips.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '')
    + `<h3>Metadata</h3><dl>`
    + `<dt>Equipment</dt><dd>${esc(it.equipment_id) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Muscles</dt><dd>${esc((it.muscles || []).join(', ')) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Difficulty</dt><dd>${esc(it.difficulty) || '<span class="muted">none</span>'}</dd>`
    + `<dt>Stretch</dt><dd>${it.is_stretch ? 'yes' : 'no'}</dd></dl>`
    + `<h3>Russian</h3>`
    + (Object.keys(ru).length
        ? `<p><b>${esc(ru.title)}</b></p>` + (ru.summary ? `<p>${esc(ru.summary)}</p>` : '')
          + list('', ru.steps)
        : `<p class="muted">no Russian row</p>`);

  document.getElementById('questions').innerHTML = P.questions.map(q =>
    `<div class="q"><p>${esc(q.text)}</p><div class="opts">`
    + P.verdicts.map(v =>
        `<label><input type="radio" name="${q.id}" value="${v.id}"`
        + `${r.answers[q.id] === v.id ? ' checked' : ''}><span>${esc(v.text)}</span></label>`
      ).join('')
    + `</div></div>`).join('');

  document.getElementById('reasons').innerHTML = P.reasons.map(c =>
    `<label><input type="checkbox" value="${c.id}"`
    + `${r.reason_codes.includes(c.id) ? ' checked' : ''}> ${esc(c.text)}</label>`).join('');

  document.getElementById('note').value = r.note || '';
  document.getElementById('domain').checked = !!r.needs_domain_review;
  document.getElementById('pos').textContent = (cur + 1) + ' of ' + P.items.length;
  paintNav();
  window.scrollTo(0, 0);
}

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cur = +b.dataset.i; paint();
});
document.getElementById('questions').addEventListener('change', e => {
  const r = rec(P.items[cur].item_id);
  r.answers[e.target.name] = e.target.value;
  r.review_status = 'COMPLETE';
  save();
});
document.getElementById('reasons').addEventListener('change', () => {
  const r = rec(P.items[cur].item_id);
  r.reason_codes = [...document.querySelectorAll('#reasons input:checked')].map(i => i.value);
  save();
});
document.getElementById('note').addEventListener('input', e => {
  rec(P.items[cur].item_id).note = e.target.value; save();
});
document.getElementById('domain').addEventListener('change', e => {
  rec(P.items[cur].item_id).needs_domain_review = e.target.checked; save();
});
document.getElementById('skip').addEventListener('click', () => {
  const r = rec(P.items[cur].item_id);
  r.review_status = 'SKIPPED'; r.answers = {};
  save(); paint();
});
document.getElementById('prev').addEventListener('click', () => {
  if (cur > 0) { cur--; paint(); }
});
document.getElementById('next').addEventListener('click', () => {
  if (cur < P.items.length - 1) { cur++; paint(); }
});

document.getElementById('export').addEventListener('click', () => {
  const now = new Date().toISOString();
  const reviews = [];
  for (const it of P.items) {
    const r = state[it.item_id];
    if (!r || !r.review_status) continue;   // never opened: stays UNKNOWN
    const status = r.review_status === 'SKIPPED' ? 'SKIPPED'
      : (P.questions.every(q => r.answers[q.id]) ? 'COMPLETE' : null);
    if (!status) continue;                  // partially answered: not a review
    reviews.push({
      item_id: it.item_id,
      source_content_version: it.source_content_version,
      review_timestamp: r.at || now,
      review_status: status,
      answers: status === 'SKIPPED' ? {} : r.answers,
      reason_codes: r.reason_codes || [],
      note: r.note || '',
      needs_domain_review: !!r.needs_domain_review
    });
  }
  const who = document.getElementById('who').value.trim();
  const out = {
    batch_id: P.batch_id,
    review_schema_version: P.review_schema_version,
    reviewer: who,
    reviewer_slot: P.slot,
    reviewer_kind: 'HUMAN',
    submitted_at: now,
    reviews: reviews
  };
  const text = JSON.stringify(out, null, 2);
  const box = document.getElementById('out');
  box.value = text; box.hidden = false; box.select();
  const a = document.getElementById('dl');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = P.batch_id + '.' + (who || P.slot) + '.json';
  a.hidden = false;
  document.getElementById('exportnote').textContent =
    reviews.length + ' of ' + P.items.length + ' rows returned. Rows you did '
    + 'not open are absent from the file and count as NOT REVIEWED, not as clean.';
});

paint();
</script>
</body>
</html>
