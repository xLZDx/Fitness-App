:root{--bg:#fbfaf7;--fg:#1c1b19;--muted:#6b6862;--line:#ddd9d1;--card:#fff;

body{margin:0;background:var(--bg);color:var(--fg);

header{position:sticky;top:0;z-index:5;background:var(--card);
border-bottom:1px solid var(--line);padding:10px 16px;display:flex;
gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
.grow{flex:1}
.muted{color:var(--muted)}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;
align-items:start}
nav{border-right:1px solid var(--line);height:calc(100vh - 46px);
overflow:auto;position:sticky;top:46px;background:var(--card)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;
padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;
border-left:3px solid transparent;color:var(--muted)}
nav button.done{color:var(--fg)}
nav button.cur{border-left-color:var(--accent);background:#eef2f6;color:var(--fg)}
main{padding:20px 24px 80px;max-width:74ch}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;
padding:16px 18px;margin:0 0 16px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
color:var(--muted);margin:16px 0 6px;font-weight:650}
ol,ul{margin:0;padding-left:22px}
li{margin:3px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;
font-size:14px}
dt{color:var(--muted)}
dd{margin:0}
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:14px;padding:3px 12px;
cursor:pointer;font-size:14px;user-select:none}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.opts label:has(input[value=ok]:checked){background:var(--ok);color:#fff;
border-color:var(--ok)}
.opts label:has(input[value=problem]:checked){background:var(--prob);color:#fff;
border-color:var(--prob)}
.opts label:has(input[value=unsure]:checked){background:var(--uns);color:#fff;
border-color:var(--uns)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:2px 14px;font-size:14px}
.reasons label{cursor:pointer}
textarea{width:100%;min-height:72px;font:inherit;padding:8px;
border:1px solid var(--line);border-radius:4px;background:var(--bg);
color:var(--fg);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button.act{font:inherit;padding:6px 14px;border-radius:4px;cursor:pointer;
border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme:dark){
:root{--bg:#16181a;--fg:#e8e6e1;--muted:#9a968e;--line:#33363a;--card:#1e2124;
--ok:#4e9a6b;--prob:#c05a45;--uns:#a3894b;--accent:#7aa2c8}
nav button.cur{background:#242a31}
}
</style>
</head>

"fad7ade22ca33886c06a90e54938141b", "title": "Ski Ergometer Cross Country Ski Squat Wide Lat Pull", "summary": "Stand in front of the ski ergometer machine with your feet shoulder-width apart, holding the handles with both hands. Engage your core and maintain an upright posture", "steps": ["Stand in front of the ski ergometer machine with your feet shoulder-width apart, holding the handles with both hands. Engage your core and maintain an upright posture", "Begin by pulling both handles down in a wide arc motion while simultaneously lowering into a squat position, bending your knees, and pushing your hips back", "Continue pulling the handles down towards your sides until they are at hip level, then slowly return your arms to the starting position with control, and stand back up from the squat", "Repeat the movement for the desired duration or number of repetitions"], "tips": ["Adjust the resistance level if needed to provide a challenging but manageable workout", "Keep your upper body relaxed and avoid tensing your shoulders", "Focus on using both your arms and legs to distribute the effort evenly and prevent fatigue"], "equipment_id": "ski_erg", "muscles": ["quads", "glutes", "lats", "shoulders", "hamstrings", "calves", "traps", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте перед ски-эргометром, поставив стопы на ширине плеч, держа рукоятки обеими руками. Напрягите корпус и сохраняйте прямую осанку.", "Начните тянуть обе рукоятки вниз широкой дугой, одновременно опускаясь в присед, сгибая колени и отводя бедра назад.", "Продолжайте тянуть рукоятки вниз к бокам, пока они не окажутся на уровне бедер, затем медленно и контролируемо верните руки в исходное положение и поднимитесь из приседа.", "Повторяйте движение в течение желаемого времени или количества повторений."], "summary": "Встаньте перед ски-эргометром, поставив стопы на ширине плеч, держа рукоятки обеими руками. Напрягите корпус и сохраняйте прямую осанку.", "tips": ["При необходимости отрегулируйте уровень сопротивления, чтобы тренировка была сложной, но выполнимой.", "Держите верхнюю часть тела расслабленной и избегайте напряжения плеч.", "Сосредоточьтесь на использовании как рук, так и ног, чтобы равномерно распределить нагрузку и предотвратить утомление."], "title": "Ски-эргометр: Тяга широким хватом с приседом"}}, {"item_id": "ea_dumbbell_frog_jumps", "source_content_version": "d5dc22bc1e2fd2b416d8ecb8dedf5cdc", "title": "Dumbbell Frog Jumps", "summary": "Bend your knees and lower into a deep squat while keeping your chest up, with your feet wider than shoulder-width, holding a dumbbell in each hand hanging between your legs", "steps": ["Bend your knees and lower into a deep squat while keeping your chest up, with your feet wider than shoulder-width, holding a dumbbell in each hand hanging between your legs", "Push through your heels and extend your legs to stand upright, bringing the dumbbells to your sides", "Explosively jump straight up from the squat position, extending through your hips, knees, and ankles", "Land softly back into the squat position with control and immediately go into the next rep"], "tips": ["Use explosive power from your legs to jump up", "Land with soft knees to reduce impact on joints", "Engage your core throughout the movement"], "equipment_id": "dumbbell", "muscles": ["quads", "glutes", "calves", "hamstrings", "core", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Согните колени и опуститесь в глубокий присед, держа грудь прямо, стопы шире плеч, с гантелью в каждой руке, свисающей между ног.", "Оттолкнитесь пятками и выпрямите ноги, чтобы встать, поднося гантели к бокам.", "Взрывным движением выпрыгните вверх из положения приседа, разгибаясь в бёдрах, коленях и лодыжках.", "Мягко и контролируемо приземлитесь обратно в положение приседа и немедленно переходите к следующему повторению."], "summary": "Согните колени и опуститесь в глубокий присед, держа грудь прямо, стопы шире плеч, с гантелью в каждой руке, свисающей между ног.", "tips": ["Используйте взрывную силу ног для прыжка вверх.", "Приземляйтесь на мягкие колени, чтобы уменьшить нагрузку на суставы.", "Держите корпус напряжённым на протяжении всего движения."], "title": "Прыжки лягушкой с гантелями"}}, {"item_id": "ea_bicycle_air_legs", "source_content_version": "53264039fde48461a5c3c82d65739b76", "title": "Bicycle Air Legs", "summary": "Lie on your back and lift your hips off the floor, supporting them with your hands while keeping your elbows on the floor", "steps": ["Lie on your back and lift your hips off the floor, supporting them with your hands while keeping your elbows on the floor", "Perform a bicycle motion with your legs by extending your right leg straight forward while bending your left knee towards the floor", "Switch legs by extending your left leg straight forward and bending your right knee towards the floor, continuing the bicycle motion", "Maintain a controlled and steady pace throughout the exercise"], "tips": ["Ensure your hands are firmly supporting your lower back to maintain proper alignment and stability", "Focus on engaging your core muscles to control the movement of your legs and prevent lower back strain", "Ensure your movements are smooth and controlled to maximize muscle activation and prevent injury"], "equipment_id": null, "muscles": ["core", "lower_back", "quads", "hamstrings"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на спину и поднимите бёдра от пола, поддерживая их руками, при этом локти остаются на полу.", "Выполняйте движение «велосипед» ногами, выпрямляя правую ногу вперёд и сгибая левое колено к полу.", "Поменяйте ноги, выпрямляя левую ногу вперёд и сгибая правое колено к полу, продолжая движение «велосипед».", "Поддерживайте контролируемый и равномерный темп на протяжении всего упражнения."], "summary": "Лягте на спину и поднимите бёдра от пола, поддерживая их руками, при этом локти остаются на полу.", "tips": ["Убедитесь, что руки надёжно поддерживают поясницу, чтобы сохранить правильное положение и стабильность.", "Сосредоточьтесь на задействовании мышц кора для контроля движения ног и предотвращения нагрузки на поясницу.", "Убедитесь, что ваши движения плавные и подконтрольные, чтобы максимально задействовать мышцы и предотвратить травмы."], "title": "Велосипед ногами в воздухе"}}, {"item_id": "ea_dumbbell_one_arm_floor_press", "source_content_version": "d2ecc60abdf9cc55ff62362d24fafb0a", "title": "Dumbbell One Arm Floor Press", "summary": "Lie on your back on the floor with your legs straight on the floor. Hold a dumbbell in one hand with your arm extended straight up towards the ceiling, palm facing forward. Keep your free hand on the floor for support", "steps": ["Lie on your back on the floor with your legs straight on the floor. Hold a dumbbell in one hand with your arm extended straight up towards the ceiling, palm facing forward. Keep your free hand on the floor for support", "Lower the dumbbell by bending your elbow until your upper arm touches the floor, bringing your elbow at a 45-degree angle to your body", "Press the dumbbell back up to the starting position by extending your elbow, squeezing your chest at the top of the movement", "Repeat for the desired number of repetitions, then switch to the other arm"], "tips": ["Avoid letting your back arch off the floor; keep it flat and supported", "Focus on using your chest and triceps to lift the dumbbell", "Keep your wrist straight and aligned with your forearm during the exercise"], "equipment_id": "dumbbell", "muscles": ["chest", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину на пол, ноги прямые. Держите гантель в одной руке, рука вытянута прямо вверх к потолку, ладонь смотрит вперёд. Свободную руку держите на полу для опоры.", "Опустите гантель, сгибая локоть, пока плечо не коснётся пола, локоть находится под углом 45 градусов к телу.", "Выжмите гантель обратно в исходное положение, выпрямляя локоть, сжимая грудь в верхней точке движения.", "Повторите желаемое количество повторений, затем поменяйте руку."], "summary": "Лягте на спину на пол, ноги прямые. Держите гантель в одной руке, рука вытянута прямо вверх к потолку, ладонь смотрит вперёд. Свободную руку держите на полу для опоры.", "tips": ["Избегайте прогиба спины от пола; держите её ровной и поддерживаемой.", "Сосредоточьтесь на использовании мышц груди и трицепсов для подъёма гантели.", "Держите запястье прямым и на одной линии с предплечьем во время упражнения."], "title": "Жим гантели одной рукой лёжа на полу"}}, {"item_id": "ea_reverse_prayer", "source_content_version": "7425dec0166902ac1ac3a30bbd0badc1", "title": "Reverse Prayer", "summary": "Stand or sit tall with your shoulders rolled back and down", "steps": ["Stand or sit tall with your shoulders rolled back and down", "Bring both hands behind your back with the fingers pointing down", "Rotate the hands until the fingers point up and the palms meet", "Press the palms together and draw the elbows back to open the chest", "Hold for twenty to thirty seconds, breathing steadily"], "tips": [], "equipment_id": null, "muscles": [], "difficulty": "beginner", "is_stretch": true, "ru": {"purpose": "Ладони, сложенные за спиной, требуют от плеч и запястий больше, чем почти любая другая растяжка. Если поза недоступна, захват противоположных локтей за спиной делает то же самое мягче.", "steps": ["Встаньте или сядьте прямо, плечи отведены назад и вниз", "Заведите обе кисти за спину пальцами вниз", "Разверните кисти так, чтобы пальцы смотрели вверх, а ладони сошлись", "Сожмите ладони и отведите локти назад, раскрывая грудь", "Удерживайте двадцать-тридцать секунд, ровно дыша"], "summary": "Встаньте или сядьте прямо, плечи отведены назад и вниз", "title": "Поза обратной молитвы"}}, {"item_id": "ea_low_resistance_band_lying_bicep_curl_half_repetition", "source_content_version": "67878b6b996f1f2b3427f5fac55931eb", "title": "Low Resistance Band Lying Bicep Curl Half Repetition", "summary": "Attach the middle of the resistance band to a low anchor point in front of you. Lie on a bench with your feet flat on the floor, holding a handle in each hand with your palms facing up and your arms extended straight by your sides", "steps": ["Attach the middle of the resistance band to a low anchor point in front of you. Lie on a bench with your feet flat on the floor, holding a handle in each hand with your palms facing up and your arms extended straight by your sides", "Curl the handles halfway towards your shoulders by bending your elbows until your forearms are parallel to the floor, keeping your upper arms stationary", "Slowly return to the starting position with control, fully extending your arms", "Repeat for the desired number of repetitions"], "tips": ["Keep your back flat on the bench and avoid arching your spine", "Focus on engaging your biceps throughout the movement", "Exhale as you curl the handles up and inhale as you lower them back down"], "equipment_id": "cable_machine", "muscles": ["biceps", "forearms", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Прикрепите середину резиновой ленты к низкой точке крепления перед собой. Лягте на скамью, стопы на полу, держа рукоятку в каждой руке ладонями вверх, руки вытянуты прямо вдоль тела.", "Согните руки в локтях, подтягивая рукоятки наполовину к плечам, пока предплечья не станут параллельны полу, держите плечи неподвижно.", "Медленно и подконтрольно вернитесь в исходное положение, полностью выпрямив руки.", "Повторите желаемое количество повторений."], "summary": "Прикрепите середину резиновой ленты к низкой точке крепления перед собой. Лягте на скамью, стопы на полу, держа рукоятку в каждой руке ладонями вверх, руки вытянуты прямо вдоль тела.", "tips": ["Держите спину прижатой к скамье и избегайте прогиба в пояснице.", "Сосредоточьтесь на работе бицепсов на протяжении всего движения.", "Выдыхайте, когда поднимаете рукоятки, и вдыхайте, когда опускаете их обратно."], "title": "Сгибание на бицепс лежа с резиновой лентой от нижнего крепления (половина повторения)"}}, {"item_id": "ea_exercise_ball_lower_back_prone_stretch", "source_content_version": "a5c8e428f8bd2e8948c10670a3cd2b65", "title": "Exercise Ball Lower Back Prone Stretch", "summary": "Begin on your hands and feet with your arms and legs straight, positioning an exercise ball under your hips", "steps": ["Begin on your hands and feet with your arms and legs straight, positioning an exercise ball under your hips", "Slowly lower your body onto the ball, allowing it to support your hips and torso, while keeping your arms and legs straight and your hips bent", "Relax into the stretch, letting your back gently arch over the ball and feeling a stretch in your lower back", "Hold the stretch for 15-30 seconds. Repeat for the desired number of repetitions"], "tips": ["Focus on deep, steady breathing, inhaling as you lower onto the ball and exhaling as you return to the starting position", "Ensure the exercise ball is properly inflated to provide adequate support and facilitate smooth movement", "Avoid overextending your back; only lower onto the ball as far as is comfortable without causing strain"], "equipment_id": "stability_ball", "muscles": ["lower_back", "traps", "shoulders"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте на руки и стопы, выпрямив руки и ноги, расположив фитбол под бёдрами.", "Медленно опустите тело на мяч, позволяя ему поддерживать ваши бёдра и туловище, при этом держите руки и ноги прямыми, а бёдра согнутыми.", "Расслабьтесь в растяжке, позволяя спине мягко прогнуться над мячом и ощущая растяжение в пояснице.", "Удерживайте растяжку 15-30 секунд. Повторите желаемое количество повторений."], "summary": "Встаньте на руки и стопы, выпрямив руки и ноги, расположив фитбол под бёдрами.", "tips": ["Сосредоточьтесь на глубоком, ровном дыхании, вдыхая при опускании на мяч и выдыхая при возвращении в исходное положение.", "Убедитесь, что фитбол правильно накачан, чтобы обеспечить адекватную поддержку и облегчить плавное движение.", "Избегайте чрезмерного прогиба в спине; опускайтесь на мяч только до комфортного уровня, не вызывая напряжения."], "title": "Растяжка поясницы лёжа на фитболе"}}, {"item_id": "ea_kettlebell_lateral_lunge", "source_content_version": "79f14305e5f27f7b3660d790037ed46b", "title": "Kettlebell Lateral Lunge", "summary": "Stand tall holding a kettlebell at your chest with both hands, feet together", "steps": ["Stand tall holding a kettlebell at your chest with both hands, feet together", "Take a big step directly out to one side", "Bend that knee and push your hips back, keeping the other leg completely straight", "Lower until you feel a stretch along the inside of the straight leg, chest staying up", "Push off the bent leg to return to standing, then step to the other side"], "tips": [], "equipment_id": "kettlebell", "muscles": ["quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Почти вся тренировка идёт вперёд и назад — это движение вбок. Нагружает внутреннюю поверхность бедра и боковую часть таза, а это как раз то направление, к которому большинство хуже всего готово при поскальзывании или смене направления.", "steps": ["Встаньте прямо, гиря у груди в двух руках, стопы вместе", "Сделайте широкий шаг строго в сторону", "Согните это колено и отведите таз назад, вторая нога остаётся полностью прямой", "Опуститесь до растяжения по внутренней стороне прямой ноги, грудь поднята", "Оттолкнитесь согнутой ногой и вернитесь, затем шагните в другую сторону"], "summary": "Встаньте прямо, гиря у груди в двух руках, стопы вместе", "title": "Боковой выпад с гирей"}}, {"item_id": "ea_seated_resistance_band_cable_rows", "source_content_version": "de7cdaf9cd5283c4c5b4c14b3c6f937a", "title": "Seated Resistance Band - Cable Rows", "summary": "Sit on the floor with your legs fully extended and feet together, anchoring the resistance band around the soles of your feet. Hold the handles with both hands, arms extended forward, palms facing each other", "steps": ["Sit on the floor with your legs fully extended and feet together, anchoring the resistance band around the soles of your feet. Hold the handles with both hands, arms extended forward, palms facing each other", "Keep your spine neutral, chest up, and core engaged to stabilize your body", "Pull the handles towards your torso by bending your elbows, keeping your arms close to your body. Focus on squeezing your shoulder blades together at the peak of the movement", "Slowly extend your arms back to the starting position, maintaining control over the resistance band. Repeat for the desired number of repetitions"], "tips": ["Keep your back straight and avoid slouching to maintain proper form", "Engage your core to prevent any rocking or unnecessary movement during the exercise", "Use a controlled motion to pull and release the resistance band, avoiding jerking movements"], "equipment_id": "resistance_bands", "muscles": ["lats", "traps", "biceps", "core"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на пол, полностью вытянув ноги и соединив стопы, закрепив резиновую ленту вокруг подошв стоп. Держите рукоятки обеими руками, вытянув руки вперёд, ладонями друг к другу.", "Держите спину в нейтральном положении, грудь приподнятой, а пресс напряжённым для стабилизации тела.", "Потяните рукоятки к туловищу, сгибая локти и держа руки близко к телу. Сосредоточьтесь на сведении лопаток вместе в верхней точке движения.", "Медленно вытяните руки обратно в исходное положение, сохраняя контроль над резиновой лентой. Повторите желаемое количество повторений."], "summary": "Сядьте на пол, полностью вытянув ноги и соединив стопы, закрепив резиновую ленту вокруг подошв стоп. Держите рукоятки обеими руками, вытянув руки вперёд, ладонями друг к другу.", "tips": ["Держите спину прямо и избегайте сутулости для поддержания правильной техники.", "Напрягите пресс, чтобы предотвратить раскачивание или ненужные движения во время упражнения.", "Используйте контролируемое движение для натяжения и ослабления резиновой ленты, избегая рывков."], "title": "Тяга резиновой ленты сидя"}}, {"item_id": "ea_side_lying_leg_lift_left", "source_content_version": "041b7abf7a16933fd7863a229ba12e33", "title": "Side Lying Leg Lift Left", "summary": "Lie on your right side with your legs extended straight and stacked on top of each other. Rest your head on your right arm and place your left hand on your hips", "steps": ["Lie on your right side with your legs extended straight and stacked on top of each other. Rest your head on your right arm and place your left hand on your hips", "Slowly lift your left leg straight up towards the ceiling, keeping it straight and in line with your body", "Hold the top position for a moment, feeling the contraction in your outer thigh and hip", "Slowly lower your leg back to the starting position with control. Repeat for the desired number of repetitions, then switch to your left side and perform the exercise with your right leg"], "tips": ["Breathe steadily, exhaling as you lift your leg and inhaling as you lower it", "Ensure your leg stays straight and in line with your body throughout the movement", "Avoid using momentum to lift your leg; focus on using your hip and thigh muscles"], "equipment_id": null, "muscles": ["glutes"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на правый бок, ноги вытянуты прямо и сложены друг на друга. Положите голову на правую руку и положите левую руку на бедро.", "Медленно поднимите левую ногу прямо вверх к потолку, держа ее прямой и на одной линии с телом.", "Задержитесь в верхней точке на мгновение, чувствуя сокращение во внешней части бедра и бедре.", "Медленно и подконтрольно опустите ногу обратно в исходное положение. Повторите желаемое количество повторений, затем перевернитесь на левый бок и выполните упражнение правой ногой."], "summary": "Лягте на правый бок, ноги вытянуты прямо и сложены друг на друга. Положите голову на правую руку и положите левую руку на бедро.", "tips": ["Дышите ровно, выдыхая при подъеме ноги и вдыхая при опускании.", "Убедитесь, что нога остается прямой и на одной линии с телом на протяжении всего движения.", "Избегайте использования инерции для подъема ноги; сосредоточьтесь на работе мышц бедра и ягодиц."], "title": "Подъём левой ноги лежа на боку"}}, {"item_id": "ea_standing_front_raise_dumbbell", "source_content_version": "25ea5c5beb0e7aad1ae2781f1c1e3261", "title": "Standing Front Raise Dumbbell", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms fully extended in front of your hips and palms facing your thighs", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms fully extended in front of your hips and palms facing your thighs", "Raise both arms straight in front of you until they are parallel to the floor, keeping a slight bend in your elbows", "Lower your arms back to the starting position with control", "Repeat the movement for the desired number of repetitions"], "tips": ["Warm up your shoulders with light exercises before starting to prevent injury", "Keep your head and neck in a neutral position to avoid unnecessary strain", "Focus on your breathing: exhale as you lift the dumbbell and inhale as you lower it"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширину плеч, держа по гантели в каждой руке, руки полностью выпрямлены перед бедрами, ладони обращены к бедрам.", "Поднимите обе руки прямо перед собой, пока они не станут параллельны полу, сохраняя легкий изгиб в локтях.", "Контролируемо опустите руки обратно в исходное положение.", "Повторите движение желаемое количество повторений."], "summary": "Встаньте, расставив стопы на ширину плеч, держа по гантели в каждой руке, руки полностью выпрямлены перед бедрами, ладони обращены к бедрам.", "tips": ["Разогрейте плечи легкими упражнениями перед началом, чтобы предотвратить травмы.", "Держите голову и шею в нейтральном положении, чтобы избежать ненужной нагрузки.", "Сосредоточьтесь на дыхании: выдыхайте при подъеме гантели и вдыхайте при опускании."], "title": "Подъёмы гантелей перед собой стоя"}}, {"item_id": "ea_barbell_bulgarian_split_squat_left_front_back_view", "source_content_version": "2a0f293516f9530b0fe4f16d0a9c66c3", "title": "Barbell Bulgarian Split Squat Left Front-back View", "summary": "Stand with your back turned to a box, holding a barbell across your upper back. Grip the bar with your hands slightly wider than shoulder-width apart", "steps": ["Stand with your back turned to a box, holding a barbell across your upper back. Grip the bar with your hands slightly wider than shoulder-width apart", "Place one foot behind you on the box, ensuring the top of your foot is resting on the box", "Keep your chest up, and maintain a neutral spine. Begin the squat by bending your front knee and lowering your body until your back knee nearly touches the floor", "Push through the heel of your front foot to return to the starting position, extending your hip and knee fully. Repeat for the desired number of repetitions, then switch legs"], "tips": ["Ensure your front knee tracks over your toes to prevent knee injuries and ensure proper form", "Lower your body slowly and with control to maximize muscle engagement and prevent injury", "Breathe steadily, exhaling as you push up and inhaling as you lower down"], "equipment_id": "barbell", "muscles": ["quads", "glutes", "hamstrings", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте спиной к ящику, держа штангу на верхней части спины. Возьмите гриф руками чуть шире плеч.", "Поставьте одну ступню позади себя на ящик, убедившись, что верхняя часть ступни лежит на ящике.", "Держите грудь поднятой и сохраняйте нейтральное положение позвоночника. Начните приседание, сгибая переднее колено и опуская тело, пока заднее колено почти не коснётся пола.", "Оттолкнитесь пяткой передней ступни, чтобы вернуться в исходное положение, полностью выпрямив бедро и колено. Повторите желаемое количество повторений, затем поменяйте ноги."], "summary": "Встаньте спиной к ящику, держа штангу на верхней части спины. Возьмите гриф руками чуть шире плеч.", "tips": ["Убедитесь, что переднее колено движется над носком, чтобы предотвратить травмы коленей и обеспечить правильную технику.", "Опускайте тело медленно и подконтрольно, чтобы максимально задействовать мышцы и предотвратить травмы.", "Дышите ровно, выдыхая при подъёме и вдыхая при опускании."], "title": "Болгарские приседания со штангой, левая нога впереди (вид спереди-сзади)"}}, {"item_id": "ea_intermediate_hip_flexor_and_quad_stretch", "source_content_version": "c7709e4f1b5ad3316ed0e4cd76c09f4b", "title": "Intermediate Hip Flexor and Quad Stretch", "summary": "Lie on your stomach with your legs extended and your arms at your sides. Position an elastic cable around your right ankle", "steps": ["Lie on your stomach with your legs extended and your arms at your sides. Position an elastic cable around your right ankle", "Bend your right knee to bring your foot towards your glutes, holding the elastic cable in your both hands", "Gently pull on the cable to bring your foot closer to your glutes, feeling the stretch in your quadriceps. Hold this position for a moment", "Extend your right leg lightly backwards, allowing the cable to provide resistance and deepen the stretch in your hip flexor and quadriceps. Repeat the movement for the desired number of repetitions, then switch to the left leg"], "tips": ["Focus on deep, steady breathing, inhaling as you extend your leg and exhaling as you pull your foot towards your glutes", "If you find it difficult to reach the cable, use a longer strap or adjust the tension to ensure a comfortable stretch", "Ensure your head and neck remain in a neutral position, looking down towards the floor to avoid strain", "Perform the stretch on a comfortable surface, such as a yoga mat, to prevent discomfort or injury"], "equipment_id": "resistance_bands", "muscles": ["quads", "lower_back", "glutes"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на живот, вытянув ноги и расположив руки по бокам. Закрепите резиновую ленту вокруг правой лодыжки.", "Согните правое колено, чтобы подтянуть стопу к ягодицам, держа резиновую ленту обеими руками.", "Аккуратно потяните за ленту, чтобы подтянуть стопу ближе к ягодицам, чувствуя растяжение в квадрицепсах. Удерживайте это положение на мгновение.", "Слегка вытяните правую ногу назад, позволяя ленте создавать сопротивление и углублять растяжку сгибателей бедра и квадрицепсов. Повторите движение желаемое количество повторений, затем переключитесь на левую ногу."], "summary": "Лягте на живот, вытянув ноги и расположив руки по бокам. Закрепите резиновую ленту вокруг правой лодыжки.", "tips": ["Сосредоточьтесь на глубоком, ровном дыхании, вдыхая при вытягивании ноги и выдыхая при подтягивании стопы к ягодицам.", "Если вам трудно дотянуться до ленты, используйте более длинный ремень или отрегулируйте натяжение, чтобы обеспечить комфортную растяжку.", "Убедитесь, что голова и шея остаются в нейтральном положении, смотрите вниз на пол, чтобы избежать напряжения.", "Выполняйте растяжку на удобной поверхности, например, на коврике для йоги, чтобы предотвратить дискомфорт или травмы."], "title": "Растяжка сгибателей бедра и квадрицепсов (средний уровень)"}}, {"item_id": "ea_barbell_lunges_on_the_spot", "source_content_version": "17183fa3eb00974da67a1a0b8efc336e", "title": "Barbell Lunges on the Spot", "summary": "Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with your hands shoulder-width apart, and keep your elbows pointing forward", "steps": ["Stand with your feet shoulder-width apart, holding a barbell across your upper back. Grip the bar with your hands shoulder-width apart, and keep your elbows pointing forward", "Step forward with your right leg, lowering your body until your right thigh is parallel to the floor and your left knee nearly touches the floor", "Push through your front heel to return to the starting position. Repeat the movement with the same leg"], "tips": ["Use a weight that allows for proper form and technique throughout the exercise", "Drive through the heel of your front foot to engage your glutes and quadriceps more effectively", "Keep your head up and eyes forward to maintain balance and proper form"], "equipment_id": "barbell", "muscles": ["quads", "glutes", "hamstrings", "calves"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширине плеч, держа штангу на верхней части спины. Возьмитесь за гриф руками на ширине плеч и держите локти направленными вперед", "Сделайте шаг вперед правой ногой, опуская тело, пока правое бедро не станет параллельно полу, а левое колено почти не коснется пола", "Оттолкнитесь пяткой передней ноги, чтобы вернуться в исходное положение. Повторите движение той же ногой"], "summary": "Встаньте, расставив стопы на ширине плеч, держа штангу на верхней части спины. Возьмитесь за гриф руками на ширине плеч и держите локти направленными вперед", "tips": ["Используйте вес, который позволяет сохранять правильную форму и технику на протяжении всего упражнения", "Отталкивайтесь пяткой передней ноги, чтобы эффективнее задействовать ягодичные мышцы и квадрицепсы", "Держите голову поднятой, а взгляд направленным вперед для поддержания баланса и правильной формы"], "title": "Выпады со штангой на месте"}}, {"item_id": "ea_dumbbell_standing_alternate_raise", "source_content_version": "7796c5a60e6d114c51b5a495a76fc023", "title": "Dumbbell Standing Alternate Raise", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms hanging by your sides and palms facing backward", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your arms hanging by your sides and palms facing backward", "Raise the right dumbbell in front of you until your arm is parallel to the floor, keeping a slight bend in your elbow", "Lower the right dumbbell back to the starting position and then raise the left dumbbell in front of you until your arm is parallel to the floor", "Continue alternating the raise between your right and left arms for the desired number of repetitions"], "tips": ["Use a controlled motion to avoid swinging the weights and maintain proper form", "Keep your head and neck in a neutral position, looking straight ahead", "Avoid locking your elbows at the top of the movement to reduce joint strain"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа гантель в каждой руке, руки свисают по бокам, ладони обращены назад.", "Поднимите правую гантель перед собой, пока рука не станет параллельна полу, сохраняя лёгкий сгиб в локте.", "Опустите правую гантель обратно в исходное положение, затем поднимите левую гантель перед собой, пока рука не станет параллельна полу.", "Продолжайте попеременно выполнять подъёмы правой и левой рукой желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, держа гантель в каждой руке, руки свисают по бокам, ладони обращены назад.", "tips": ["Используйте контролируемое движение, чтобы избежать раскачивания веса и сохранить правильную технику.", "Держите голову и шею в нейтральном положении, смотря прямо перед собой.", "Избегайте блокировки локтей в верхней точке движения, чтобы уменьшить нагрузку на суставы."], "title": "Подъёмы гантелей перед собой стоя попеременно"}}, {"item_id": "ea_standing_oblique_crunch", "source_content_version": "26ea7117be73d23d526c4344cbf64432", "title": "Standing Oblique Crunch", "summary": "Stand with your feet shoulder-width apart, placing your hands behind your head with your elbows flared out to the sides. Engage your core and maintain an upright posture", "steps": ["Stand with your feet shoulder-width apart, placing your hands behind your head with your elbows flared out to the sides. Engage your core and maintain an upright posture", "Lift your right knee towards your right elbow while simultaneously bending your torso to the right to bring your elbow and knee closer together", "Return to the starting position by lowering your right leg and straightening your torso", "Repeat the movement on the left side, lifting your left knee towards your left elbow. Continue alternating sides for the desired number of repetitions"], "tips": ["Breathe steadily: exhale as you crunch to the side and inhale as you return to the starting position", "Ensure your standing leg remains slightly bent to maintain balance", "Keep your back straight and avoid leaning forward or backward during the exercise"], "equipment_id": null, "muscles": ["core", "lower_back", "shoulders", "quads"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, руки за головой, локти разведены в стороны. Напрягите пресс и сохраняйте прямую осанку.", "Поднимите правое колено к правому локтю, одновременно сгибая корпус вправо, чтобы сблизить локоть и колено.", "Вернитесь в исходное положение, опуская правую ногу и выпрямляя корпус.", "Повторите движение на левую сторону, поднимая левое колено к левому локтю. Продолжайте чередовать стороны желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, руки за головой, локти разведены в стороны. Напрягите пресс и сохраняйте прямую осанку.", "tips": ["Дышите ровно: выдыхайте при скручивании в сторону и вдыхайте при возвращении в исходное положение.", "Убедитесь, что опорная нога остается слегка согнутой для сохранения равновесия.", "Держите спину прямо и избегайте наклонов вперед или назад во время упражнения."], "title": "Скручивания на косые мышцы стоя"}}, {"item_id": "ea_dumbbell_scott_press_360_degrees", "source_content_version": "6b44212997ee9379aa0e1a6f0ca820ee", "title": "Dumbbell Scott Press (360 Degrees)", "summary": "Stand with your feet shoulder-width apart, holding a dumbbell in each hand in front of your face, arms bent at 90 degrees, upper arms parallel to the floor", "steps": ["Stand with your feet shoulder-width apart, holding a dumbbell in each hand in front of your face, arms bent at 90 degrees, upper arms parallel to the floor", "Move the dumbbells outward in an arc motion, keeping your elbows bent and slightly raised, until your arms are extended to your sides just higher than shoulder height", "Bring the dumbbells back to the starting position in front of your face, maintaining the 90-degree bend in your elbows", "Repeat the arc motion for the desired number of repetitions"], "tips": ["Keep your wrists straight and aligned with your forearms", "Focus on using your shoulder muscles to move the weights", "Avoid using excessive weights that compromise your form"], "equipment_id": "dumbbell", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, ноги на ширине плеч, держа гантель в каждой руке перед лицом, руки согнуты под углом 90 градусов, плечи параллельны полу.", "Разведите гантели в стороны по дуге, держа локти согнутыми и слегка приподнятыми, пока руки не будут вытянуты в стороны чуть выше уровня плеч.", "Верните гантели в исходное положение перед лицом, сохраняя сгиб в локтях под углом 90 градусов.", "Повторите движение по дуге желаемое количество повторений."], "summary": "Встаньте, ноги на ширине плеч, держа гантель в каждой руке перед лицом, руки согнуты под углом 90 градусов, плечи параллельны полу.", "tips": ["Держите запястья прямыми и на одной линии с предплечьями.", "Сосредоточьтесь на использовании мышц плеч для перемещения веса.", "Избегайте использования чрезмерного веса, который может нарушить технику выполнения."], "title": "Жим Скотта с гантелями (360 градусов)"}}, {"item_id": "ea_incline_lateral_raises_dumbbell", "source_content_version": "f687ae427c10fe08550cfe9e6cc331ce", "title": "Incline Lateral Raises Dumbbell", "summary": "Adjust an incline bench to a 45-degree angle and lie chest-first against it, with your feet firmly planted on the floor for stability", "steps": ["Adjust an incline bench to a 45-degree angle and lie chest-first against it, with your feet firmly planted on the floor for stability", "Hold a dumbbell in each hand with a neutral grip (palms facing each other), allowing the dumbbells to hang down towards the floor in line with your shoulders", "Keeping your arms slightly bent at the elbows, raise the dumbbells up and out to the sides until they reach shoulder height", "Lower the dumbbells back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Maintain a slight bend in your elbows throughout the movement to reduce joint strain", "Keep your body stabilized against the bench to isolate your shoulder muscles", "Use a slow and controlled motion to maximize muscle engagement"], "equipment_id": "bench_press", "muscles": ["shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Установите наклонную скамью под углом 45 градусов и лягте на нее грудью, плотно поставив стопы на пол для стабильности.", "Возьмите по гантели в каждую руку нейтральным хватом (ладони смотрят друг на друга), позволяя гантелям свободно свисать к полу на уровне плеч.", "Держа руки слегка согнутыми в локтях, поднимите гантели вверх и в стороны, пока они не достигнут уровня плеч.", "Опустите гантели обратно в исходное положение контролируемым движением. Повторите желаемое количество повторений."], "summary": "Установите наклонную скамью под углом 45 градусов и лягте на нее грудью, плотно поставив стопы на пол для стабильности.", "tips": ["Сохраняйте легкий изгиб в локтях на протяжении всего движения, чтобы уменьшить нагрузку на суставы.", "Держите тело стабилизированным на скамье, чтобы изолировать мышцы плеч.", "Используйте медленное и контролируемое движение, чтобы максимизировать работу мышц."], "title": "Подъемы гантелей в стороны на наклонной скамье"}}, {"item_id": "ea_good_mornings_barbell", "source_content_version": "1615afe8aa34ffa3c16eeb357422431c", "title": "Good Mornings Barbell", "summary": "Stand with your feet shoulder-width apart, holding a barbell across your upper back with an overhand grip", "steps": ["Stand with your feet shoulder-width apart, holding a barbell across your upper back with an overhand grip", "Begin to hinge at your hips, pushing your hips back while lowering your torso towards the floor", "Continue to lower your torso until it is almost parallel to the floor", "Return to the starting position by driving your hips forward and raising your torso back up. Repeat for the desired number of repetitions"], "tips": ["Maintain a straight back and avoid rounding your spine", "Focus on hinging at the hips rather than bending at the waist", "Keep a slight bend in your knees to reduce stress on your lower back"], "equipment_id": "barbell", "muscles": ["lower_back", "hamstrings", "glutes"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, держа штангу на верхней части спины прямым хватом.", "Начните наклоняться в тазобедренных суставах, отводя бёдра назад и опуская туловище к полу.", "Продолжайте опускать туловище, пока оно не станет почти параллельно полу.", "Вернитесь в исходное положение, подавая бёдра вперёд и поднимая туловище. Повторите желаемое количество повторений."], "summary": "Встаньте, поставив стопы на ширине плеч, держа штангу на верхней части спины прямым хватом.", "tips": ["Держите спину прямо и избегайте округления позвоночника.", "Сосредоточьтесь на сгибании в тазобедренных суставах, а не в пояснице.", "Держите колени слегка согнутыми, чтобы уменьшить нагрузку на поясницу."], "title": "Наклоны «Доброе утро» со штангой"}}, {"item_id": "ea_bench_triceps_dip_straight_legs", "source_content_version": "7f8766d0896760a1c8f4dc943ff4014a", "title": "Bench Triceps Dip Straight Legs", "summary": "Sit down on a bench and place your hands on the edge near your hips", "steps": ["Sit down on a bench and place your hands on the edge near your hips", "Walk your feet out, straighten your legs, and lift your hips off the bench while holding the bench", "Lower your hips down by folding your arms", "As your arms form a 90-degree angle, raise your hips, and repeat"], "tips": ["Keep your elbows pointed backward and close to your body to engage your triceps effectively", "Maintain a straight line from your hips to your heels to ensure proper form", "Perform the movement slowly and with control to maximize muscle activation and prevent injury"], "equipment_id": "bench_press", "muscles": ["triceps", "chest", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на скамью и положите руки на ее край рядом с бедрами.", "Выдвиньте ноги вперед, выпрямите их и оторвите бедра от скамьи, удерживая ее.", "Опустите бедра, сгибая руки.", "Когда руки образуют угол 90 градусов, поднимите бедра и повторите."], "summary": "Сядьте на скамью и положите руки на ее край рядом с бедрами.", "tips": ["Держите локти направленными назад и близко к телу для эффективной работы трицепсов.", "Сохраняйте прямую линию от бедер до пяток для обеспечения правильной техники.", "Выполняйте движение медленно и подконтрольно для максимальной активации мышц и предотвращения травм."], "title": "Отжимания на трицепс от скамьи с прямыми ногами"}}, {"item_id": "ea_dumbbell_decline_bench_press", "source_content_version": "bd379a083f0ba865c564173f339c99ff", "title": "Dumbbell Decline Bench Press", "summary": "Begin by lying on a decline bench with your feet secured and a dumbbell in each hand, arms lowered and elbows bent at a 90-degree angle, palms facing forward", "steps": ["Begin by lying on a decline bench with your feet secured and a dumbbell in each hand, arms lowered and elbows bent at a 90-degree angle, palms facing forward", "Press both dumbbells upward simultaneously until your arms are fully extended, keeping the motion controlled", "Lower the dumbbells back to the starting position with controlled motion until your elbows are at a 90-degree angle", "Repeat the press and lowering motion for the desired number of repetitions, maintaining stability throughout the exercise"], "tips": ["Keep your feet firmly planted and secured to avoid slipping", "Maintain a slight bend in your elbows at the top of the movement to protect your joints", "Concentrate on using your chest muscles to press the weights, minimizing shoulder involvement"], "equipment_id": "bench_press", "muscles": ["chest", "shoulders", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на наклонную скамью головой вниз, зафиксировав стопы и взяв по гантели в каждую руку, руки опущены, локти согнуты под углом 90 градусов, ладони направлены вперёд.", "Одновременно выжмите обе гантели вверх, пока руки не будут полностью выпрямлены, сохраняя движение контролируемым.", "Контролируемо опустите гантели обратно в исходное положение, пока локти не будут согнуты под углом 90 градусов.", "Повторите жим и опускание желаемое количество повторений, сохраняя стабильность на протяжении всего упражнения."], "summary": "Лягте на наклонную скамью головой вниз, зафиксировав стопы и взяв по гантели в каждую руку, руки опущены, локти согнуты под углом 90 градусов, ладони направлены вперёд.", "tips": ["Держите стопы плотно прижатыми и зафиксированными, чтобы избежать скольжения.", "Сохраняйте небольшой сгиб в локтях в верхней точке движения, чтобы защитить суставы.", "Сосредоточьтесь на использовании грудных мышц для жима весов, минимизируя участие плеч."], "title": "Жим гантелей лёжа на наклонной скамье головой вниз"}}, {"item_id": "ea_band_palloff_press", "source_content_version": "83618ef0a3301ab6f1a72d0883cd4cb8", "title": "Band Palloff Press", "summary": "Attach a resistance band to a sturdy anchor point at chest height. Stand perpendicular to the anchor point, holding the handle of the band with both hands close to your chest", "steps": ["Attach a resistance band to a sturdy anchor point at chest height. Stand perpendicular to the anchor point, holding the handle of the band with both hands close to your chest", "Push the band straight out in front of you, extending your arms fully and squeezing your chest muscles at the peak of the movement", "Slowly return your hands to your chest, maintaining control", "Repeat the movement for the desired number of repetitions, then switch sides"], "tips": ["Maintain an upright posture and avoid leaning towards or away from the anchor point", "Engage your core to resist the rotational pull of the band", "Adjust the band’s tension or your distance from the anchor for an appropriate challenge", "Breathe steadily, exhaling as you push the band forward and inhaling as you return to the starting position"], "equipment_id": "resistance_bands", "muscles": ["chest", "shoulders", "triceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Прикрепите резиновую ленту к прочной точке опоры на уровне груди. Встаньте перпендикулярно точке опоры, держа рукоятку ленты обеими руками близко к груди.", "Вытолкните ленту прямо перед собой, полностью выпрямляя руки и сжимая мышцы груди в пиковой точке движения.", "Медленно верните руки к груди, сохраняя контроль.", "Повторите движение для желаемого количества повторений, затем поменяйте стороны."], "summary": "Прикрепите резиновую ленту к прочной точке опоры на уровне груди. Встаньте перпендикулярно точке опоры, держа рукоятку ленты обеими руками близко к груди.", "tips": ["Сохраняйте прямую осанку и избегайте наклонов к точке опоры или от нее.", "Напрягите корпус, чтобы противостоять вращательному натяжению ленты.", "Отрегулируйте натяжение ленты или расстояние от опоры для соответствующей нагрузки.", "Дышите ровно, выдыхая при выталкивании ленты вперед и вдыхая при возвращении в исходное положение."], "title": "Жим Паллофа с резиновой лентой"}}, {"item_id": "ea_dynamic_leg_swing", "source_content_version": "1268222191fbef962f0907aeb69cd7f3", "title": "Dynamic Leg Swing", "summary": "Stand next to a wall or sturdy object, using your right hand to support yourself and left hand on your hip. Position your feet hip-width apart", "steps": ["Stand next to a wall or sturdy object, using your right hand to support yourself and left hand on your hip. Position your feet hip-width apart", "Swing your left leg forward and backward in a controlled, yet dynamic motion while lightly rotating your hips. Keep your leg straight but not locked at the knee", "Allow the movement to be fluid, swinging your leg as high forward and backward as your flexibility allows", "After completing the desired number of repetitions, switch sides and repeat the movement with your right leg while supporting yourself with your left hand"], "tips": ["Keep the swinging leg straight, but avoid locking the knee to reduce strain on the joint", "Perform the swings in a controlled manner to maximize the stretch and avoid any sudden jerks", "Focus on smooth, fluid movements, gradually increasing the range of motion as your muscles warm up"], "equipment_id": "squat_rack", "muscles": ["lower_back", "hamstrings", "quads", "glutes"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте рядом со стеной или прочным предметом, используя правую руку для опоры, а левую руку положите на бедро. Поставьте стопы на ширине бёдер.", "Махайте левой ногой вперёд и назад контролируемым, но динамичным движением, слегка вращая бёдрами. Держите ногу прямой, но не блокируйте колено.", "Позвольте движению быть плавным, махайте ногой максимально высоко вперёд и назад, насколько позволяет ваша гибкость.", "После выполнения желаемого количества повторений, поменяйте стороны и повторите движение правой ногой, опираясь на левую руку."], "summary": "Встаньте рядом со стеной или прочным предметом, используя правую руку для опоры, а левую руку положите на бедро. Поставьте стопы на ширине бёдер.", "tips": ["Держите маховую ногу прямой, но избегайте блокировки колена, чтобы уменьшить нагрузку на сустав.", "Выполняйте махи контролируемо, чтобы максимизировать растяжку и избежать резких движений.", "Сосредоточьтесь на плавных, текучих движениях, постепенно увеличивая амплитуду по мере разогрева мышц."], "title": "Динамические махи ногами"}}, {"item_id": "ea_barbell_coan_deadlift", "source_content_version": "3e6f77edae5732c7034e21ac6c6b6640", "title": "Barbell Coan Deadlift", "summary": "Stand with the bar over your mid-foot, feet about hip width apart", "steps": ["Stand with the bar over your mid-foot, feet about hip width apart", "Grip the bar just outside your knees and set your hips higher than in a normal deadlift", "Pull the slack out of the bar and lock your upper back tight before anything moves", "Push the floor away and drag the bar up your shins, keeping it touching your legs", "Stand fully upright, then lower along the same path without rounding your back"], "tips": [], "equipment_id": "barbell", "muscles": ["back"], "difficulty": "beginner", "is_stretch": false, "ru": {"purpose": "Становая с более высоким положением таза и грифом, который тянут вплотную к ногам: работа смещается на верх спины и заднюю поверхность бедра. Это вариант из силового спорта — браться за него стоит, только когда обычная становая идёт уверенно.", "steps": ["Встаньте так, чтобы гриф был над серединой стопы, ноги на ширине таза", "Возьмите гриф чуть шире коленей и поставьте таз выше, чем в обычной становой", "Выберите люфт грифа и жёстко зафиксируйте верх спины до начала движения", "Оттолкнитесь ногами от пола и тяните гриф по голеням, не отрывая его от ног", "Полностью выпрямитесь, затем опустите по той же траектории, не круглая спину"], "summary": "Встаньте так, чтобы гриф был над серединой стопы, ноги на ширине таза", "title": "Становая тяга Коана со штангой"}}, {"item_id": "ea_seated_single_leg_hamstring_stretch", "source_content_version": "418b16c180e4c66b26e8df6d6d2a53ce", "title": "Seated Single Leg Hamstring Stretch", "summary": "Sit on the floor with your legs extended straight in front of you", "steps": ["Sit on the floor with your legs extended straight in front of you", "Bend your left knee and place the sole of your left foot against your right inner thigh. Keep your right leg extended and straight", "Reach forward with both hands towards your right foot, keeping your spine neutral. Aim to grasp your toes or reach as far as comfortable", "Hold the stretch for 15-30 seconds, feeling the stretch in your right hamstring. Slowly release and return to the starting position. Repeat on the other side by extending your left leg and bending your right knee"], "tips": ["Keep your extended leg straight and avoid locking your knee to protect the joint", "Ensure your bent knee is relaxed and the sole of your foot is comfortably placed against your inner thigh", "Move into the stretch gradually and with control to prevent muscle strain or injury"], "equipment_id": null, "muscles": ["hamstrings", "calves"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Сядьте на пол, вытянув ноги прямо перед собой.", "Согните левое колено и прижмите подошву левой стопы к внутренней стороне правого бедра. Держите правую ногу вытянутой и прямой.", "Потянитесь вперёд обеими руками к правой стопе, держа спину в нейтральном положении. Старайтесь дотянуться до пальцев ног или насколько это комфортно.", "Удерживайте растяжку 15-30 секунд, чувствуя растяжение в правом подколенном сухожилии. Медленно расслабьтесь и вернитесь в исходное положение. Повторите на другой стороне, вытянув левую ногу и согнув правое колено."], "summary": "Сядьте на пол, вытянув ноги прямо перед собой.", "tips": ["Держите вытянутую ногу прямо и избегайте блокировки колена, чтобы защитить сустав.", "Убедитесь, что согнутое колено расслаблено, а подошва стопы удобно прижата к внутренней стороне бедра.", "Входите в растяжку постепенно и с контролем, чтобы предотвратить мышечное напряжение или травму."], "title": "Растяжка задней поверхности бедра сидя одной ногой"}}, {"item_id": "ea_reverse_grip_lat_pull_down", "source_content_version": "ae8e7c2216ee86292f1a1f7cb12e929a", "title": "Reverse Grip Lat Pull Down", "summary": "Sit at a lat pulldown machine with your feet flat on the floor and knees secured under the pads. Grasp the bar with an underhand grip (palms facing you) at shoulder-width apart, arms fully extended above you", "steps": ["Sit at a lat pulldown machine with your feet flat on the floor and knees secured under the pads. Grasp the bar with an underhand grip (palms facing you) at shoulder-width apart, arms fully extended above you", "Engage your core and keep your spine neutral. Lean back slightly to create a natural arch in your lower back", "Pull the bar towards your upper chest, bringing your elbows down to your sides while squeezing your shoulder blades together", "Slowly return the bar to the starting position with control, fully extending your arms. Repeat for the desired number of repetitions"], "tips": ["Exhale as you pull the bar down and inhale as you return it to the starting position", "Avoid using momentum or swinging your body to lift the weight", "Keep your wrists straight and avoid letting them bend backward"], "equipment_id": "lat_pulldown", "muscles": ["back", "biceps", "forearms"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте в тренажёр для тяги верхнего блока, поставив стопы на пол и закрепив колени под валиками. Возьмитесь за рукоять обратным хва id unnecessary strain"], "equipment_id": null, "muscles": ["core", "lower_back"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, согните колени, стопы на полу на ширине бёдер.", "Положите руки за голову, локти разведите в стороны.", "Напрягите пресс и оторвите лопатки от пола, скручивая верхнюю часть корпуса к коленям.", "Контролируемо опустите лопатки обратно на пол, сохраняя напряжение в прессе. Повторите движение желаемое количество повторений."], "summary": "Лягте на спину, согните колени, стопы на полу на ширине бёдер.", "tips": ["Избегайте тянуть шею руками; сосредоточьтесь на использовании мышц пресса для подъёма плеч.", "Выполняйте движение контролируемо, чтобы максимально задействовать мышцы и предотвратить травмы.", "Дышите ровно на протяжении всего упражнения, выдыхая при подъёме плеч и вдыхая при опускании.", "Убедитесь, что поясница остаётся прижатой к полу, чтобы избежать излишней нагрузки."], "title": "Скручивания на полу"}}, {"item_id": "ea_lying_bench_internal_rotation_stretch", "source_content_version": "240083cbe6eda76afd85ac6c4db5cb73", "title": "Lying Bench Internal Rotation Stretch", "summary": "Lie on your back on a bench with your arms extended out to the sides, your elbows bent at 90 degrees, and your forearms hanging off the sides of the bench, perpendicular to the floor in line with your torso", "steps": ["Lie on your back on a bench with your arms extended out to the sides, your elbows bent at 90 degrees, and your forearms hanging off the sides of the bench, perpendicular to the floor in line with your torso", "Rotate your shoulders to lift your forearms upward until they are vertical to the floor, maintaining the 90-degree angle at your elbows throughout the movement", "Slowly lower your forearms back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Keep your core engaged and your back flat against the bench to maintain stability", "Move slowly and with control to maximize muscle engagement and prevent injury", "Keep your elbows fixed at a 90-degree angle throughout the movement to isolate the shoulder rotation"], "equipment_id": "bench_press", "muscles": ["shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину на скамью, руки разведены в стороны, локти согнуты под углом 90 градусов, предплечья свисают по бокам скамьи, перпендикулярно полу, на одной линии с корпусом.", "Вращайте плечи, чтобы поднять предплечья вверх, пока они не станут вертикальны полу, сохраняя угол 90 градусов в локтях на протяжении всего движения.", "Медленно и подконтрольно опустите предплечья обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину на скамью, руки разведены в стороны, локти согнуты под углом 90 градусов, предплечья свисают по бокам скамьи, перпендикулярно полу, на одной линии с корпусом.", "tips": ["Держите корпус напряженным, а спину прижатой к скамье для поддержания устойчивости.", "Двигайтесь медленно и подконтрольно, чтобы максимально задействовать мышцы и предотвратить травмы.", "Держите локти зафиксированными под углом 90 градусов на протяжении всего движения, чтобы изолировать вращение плеча."], "title": "Растяжка внутреннего вращения плеча лежа на скамье"}}, {"item_id": "ea_hammer_strength_plate_loaded_combination_iso_lateral_chest_chest_press_alternate_arm", "source_content_version": "946cdb9bf504204e3bc556bb4fad247b", "title": "Hammer Strength Plate-loaded Combination Iso-lateral Chest - Chest Press Alternate Arm", "summary": "Sit on the Hammer Strength Plate-Loaded Iso-Lateral Chest Press machine, back pressed against the backrest and feet flat on the floor. Grasp the handles with both hands, palms facing down", "steps": ["Sit on the Hammer Strength Plate-Loaded Iso-Lateral Chest Press machine, back pressed against the backrest and feet flat on the floor. Grasp the handles with both hands, palms facing down", "Press one handle forward by extending your arm, keeping your elbow slightly bent at the end of the movement", "Squeeze your chest muscles at the top of the movement and slowly return the handle to the starting position with control", "Repeat with the other arm, alternating arms for the desired number of repetitions"], "tips": ["Keep your back pressed against the backrest throughout the exercise", "Focus on engaging your chest muscles throughout the movement", "Exhale as you press the handles forward and inhale as you return them to the starting position"], "equipment_id": "chest_press_machine", "muscles": ["chest", "shoulders"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте на тренажер Hammer Strength Iso-Lateral для жима груди с дисками, прижав спину к спинке и поставив стопы на пол. Возьмитесь за рукоятки обеими руками, ладони направлены вниз.", "Выжмите одну рукоятку вперед, выпрямляя руку, при этом локоть остается слегка согнутым в конце движения.", "Сократите мышцы груди в верхней точке движения и медленно, подконтрольно верните рукоятку в исходное положение.", "Повторите то же самое другой рукой, чередуя руки для желаемого количества повторений."], "summary": "Сядьте на тренажер Hammer Strength Iso-Lateral для жима груди с дисками, прижав спину к спинке и поставив стопы на пол. Возьмитесь за рукоятки обеими руками, ладони направлены вниз.", "tips": ["Держите спину прижатой к спинке на протяжении всего упражнения.", "Сосредоточьтесь на работе мышц груди на протяжении всего движения.", "Выдыхайте, когда выжимаете рукоятки вперед, и вдыхайте, когда возвращаете их в исходное положение."], "title": "Hammer Strength Жим груди Iso-Lateral с дисками поочередно руками"}}, {"item_id": "ea_elbow_extension_and_supination_pronation_forearm_stretch", "source_content_version": "2ec50dda30445e732fc9166264cfed86", "title": "Elbow Extension and Supination Pronation Forearm Stretch", "summary": "Stand with your feet shoulder-width apart and your arms extended in front of you at hip level, palms open and over each other, with one hand crossing over the other", "steps": ["Stand with your feet shoulder-width apart and your arms extended in front of you at hip level, palms open and over each other, with one hand crossing over the other", "Keep your palms crossed over each other and perform a wrist curl by bending your wrists upward", "Extend your wrists back down to the starting position", "Repeat the wrist curl and extension movements for the desired number of repetitions, then switch the position of your hands and repeat"], "tips": ["Ensure your wrists and forearms do the majority of the movement, minimizing shoulder involvement", "Maintain straight arms and avoid bending your elbows during the stretch", "Perform the stretch with both hand positions to maintain muscle balance and flexibility"], "equipment_id": null, "muscles": ["forearms", "biceps"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Встаньте, поставив стопы на ширине плеч, руки вытянуты перед собой на уровне бёдер, ладони открыты и наложены друг на друга, одна рука перекрещивается с другой.", "Держите ладони перекрещенными и выполните сгибание запястий, сгибая их вверх.", "Разогните запястья обратно в исходное положение.", "Повторите движения сгибания и разгибания запястий желаемое количество повторений, затем поменяйте положение рук и повторите."], "summary": "Встаньте, поставив стопы на ширине плеч, руки вытянуты перед собой на уровне бёдер, ладони открыты и наложены друг на друга, одна рука перекрещивается с другой.", "tips": ["Убедитесь, что основную часть движения выполняют запястья и предплечья, минимизируя участие плеч.", "Держите руки прямыми и избегайте сгибания локтей во время растяжки.", "Выполняйте растяжку с обеими позициями рук для поддержания мышечного баланса и гибкости."], "title": "Растяжка предплечий: разгибание локтя, супинация и пронация"}}, {"item_id": "ea_reverse_plank", "source_content_version": "7f39e44351036e7da761b917f8bfbe4c", "title" head, inhale as you lower into the squat", "Choose an appropriate weight to maintain control throughout the exercise", "Keep your wrists straight and aligned with your forearms"], "equipment_id": "kettlebell", "muscles": ["shoulders", "quads", "glutes", "hamstrings"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Встаньте, расставив стопы на ширине плеч, держа по гире в каждой руке на уровне плеч, ладонями внутрь. Держите локти близко к телу.", "Опуститесь в присед, сгибая бёдра и колени, пока бёдра не станут параллельны полу.", "Оттолкнитесь пятками, чтобы встать, одновременно выжимая гири над головой. Полностью выпрямите руки в верхней точке движения.", "Опустите гири обратно до уровня плеч, готовясь к следующему повторению. Повторите желаемое количество повторений."], "summary": "Встаньте, расставив стопы на ширине плеч, держа по гире в каждой руке на уровне плеч, ладонями внутрь. Держите локти близко к телу.", "tips": ["Выдыхайте, когда выжимаете гири над головой, вдыхайте, когда опускаетесь в присед.", "Выберите подходящий вес, чтобы сохранять контроль на протяжении всего упражнения.", "Держите запястья прямыми и на одной линии с предплечьями."], "title": "Жим гирь из приседа"}}, {"item_id": "ea_resistance_band_glute_bridge_abduction", "source_content_version": "f93ebfb5ed19e7cb09e01d46ee93162c", "title": "Resistance Band Glute Bridge Abduction", "summary": "Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Place a loop resistance band just above your knees. Keep your hands extended by your sides with hands firm on the floor", "steps": ["Lie on your back with your knees bent and feet flat on the floor, hip-width apart. Place a loop resistance band just above your knees. Keep your hands extended by your sides with hands firm on the floor", "Engage your core and glutes, and lift your hips towards the ceiling, forming a straight line from your shoulders to your knees", "While holding the bridge position, press your knees outward against the resistance band to stretch them as far as you can control", "Slowly bring your knees back together, then lower your hips back to the starting position. Repeat for the desired number of repetitions"], "tips": ["Avoid arching your lower back; keep a straight line from your shoulders to your knees", "Focus on engaging your glutes and hip abductors throughout the movement", "Exhale as you lift your hips and press your knees outward, and inhale as you bring your knees back together and lower your hips"], "equipment_id": "resistance_bands", "muscles": ["glutes", "core", "hamstrings"], "difficulty": "beginner", "is_stretch": true, "ru": {"steps": ["Лягте на спину, колени согнуты, стопы плотно прижаты к полу, на ширине бедер. Поместите петлевую резиновую ленту чуть выше коленей. Держите руки вытянутыми вдоль тела, ладони плотно прижаты к полу.", "Напрягите корпус и ягодицы, и поднимите бедра к потолку, образуя прямую линию от плеч до коленей.", "Удерживая положение моста, разведите колени в стороны против сопротивления резиновой ленты настолько, насколько уверенно контролируете разведение.", "Медленно сведите колени обратно, затем опустите бедра обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину, колени согнуты, стопы плотно прижаты к полу, на ширине бедер. Поместите петлевую резиновую ленту чуть выше коленей. Держите руки вытянутыми вдоль тела, ладони плотно прижаты к полу.", "tips": ["Избегайте прогиба в пояснице; держите прямую линию от плеч до коленей.", "Сосредоточьтесь на задействовании ягодичных мышц и отводящих мышц бедра на протяжении всего движения.", "Выдыхайте, когда поднимаете бедра и разводите колени в стороны, и вдыхайте, когда сводите колени обратно и опускаете бедра."], "title": "Ягодичный мост с отведением бедер с резиновой лентой"}}, {"item_id": "ea_over_head_weight_sit_up", "source_content_version": "86bc7e4c1e191dc7ea273b98d3e2e670", "title": "Over Head Weight Sit Up", "summary": "Begin by lying flat on your back with your legs slightly bent and your feet together. Hold a weight plate with both hands, extending your arms straight above your chest", "steps": ["Begin by lying flat on your back with your legs slightly bent and your feet together. Hold a weight plate with both hands, extending your arms straight above your chest", "Engage your core muscles and lift your upper body off the floor into a sitting position while keeping the weight extended straight up", "As you sit up, ensure your back remains straight and your chest is lifted, bringing your torso to an upright position", "Lower your upper body back to the starting position with control. Repeat for the desired number of repetitions"], "tips": ["Keep your core engaged throughout the entire movement to maintain stability and proper form", "Avoid using momentum to lift your upper body; focus on using your abdominal muscles to perform the sit-up", "Exhale as you sit up and inhale as you lower back down"], "equipment_id": "weight_plates", "muscles": ["core", "lower_back", "shoulders", "traps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Лягте на спину, ноги слегка согнуты, стопы вместе. Держите блин от штанги обеими руками, вытянув руки прямо над грудью.", "Напрягите мышцы кора и поднимите верхнюю часть тела от пола в сидячее положение, удерживая вес вытянутым прямо вверх.", "При подъеме убедитесь, что спина остается прямой, а грудь поднята, приводя корпус в вертикальное положение.", "Контролируемо опустите верхнюю часть тела обратно в исходное положение. Повторите желаемое количество повторений."], "summary": "Лягте на спину, ноги слегка согнуты, стопы вместе. Держите блин от штанги обеими руками, вытянув руки прямо над грудью.", "tips": ["Держите мышцы кора напряженными на протяжении всего движения для поддержания стабильности и правильной формы.", "Избегайте использования инерции для подъема верхней части тела; сосредоточьтесь на использовании мышц пресса для выполнения подъема.", "Выдыхайте при подъеме и вдыхайте при опускании."], "title": "Подъемы корпуса с весом над головой"}}, {"item_id": "ea_pec_deck_fly_machine", "source_content_version": "e927866799cd6603c5f7f01294c589aa", "title": "Pec Deck Fly Machine", "summary": "Sit on the Pec Deck machine with your feet flat on the floor and your back pressed firmly against the backrest. Bend your arms at 90 degrees and rest your elbows on the elbow pads and grasp the handles, upper arms parallel to the floor and palms facing forward", "steps": ["Sit on the Pec Deck machine with your feet flat on the floor and your back pressed firmly against the backrest. Bend your arms at 90 degrees and rest your elbows on the elbow pads and grasp the handles, upper arms parallel to the floor and palms facing forward", "Squeeze your chest muscles to bring the handles together in front of your chest", "Slowly return to the starting position with control, bringing your elbows back to your sides", "Repeat for the desired number of repetitions"], "tips": ["Keep your back pressed against the backrest throughout the exercise to maintain proper form", "Focus on engaging your chest muscles throughout the movement", "Exhale as you bring your elbows together and inhale as you return them to the starting position"], "equipment_id": "pec_deck", "muscles": ["chest", "biceps"], "difficulty": "beginner", "is_stretch": false, "ru": {"steps": ["Сядьте в тренажер Pec Deck, стопы на полу, спина плотно прижата к спинке. Согните руки под углом 90 градусов, положите локти на подушки для локтей и возьмитесь за рукоятки, плечи параллельны полу, ладони обращены вперед.", "Сожмите грудные мышцы, чтобы свести рукоятки вместе перед грудью.", "Медленно и контролируемо вернитесь в исходное положение, отводя локти обратно в стороны.", "Повторите желаемое количество повторений."], "summary": "Сядьте в тренажер Pec Deck, стопы на полу, спина плотно прижата к спинке. Согните руки под углом 90 градусов, положите локти на
