name: fitness_app
description: "Fitness app: QR-coded gym equipment with personalized workouts and celebrity-led videos"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+14

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Localization. Russian is the app's default language; English is the
  # source locale the ARB keys are authored in. See l10n.yaml + lib/l10n/.
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  video_player: ^2.10.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  cloud_functions: ^6.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  crypto: ^3.0.6
  health: ^11.0.0
  google_mlkit_pose_detection: ^0.14.0
  camera: ^0.11.0+2
  image: ^4.3.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  # Three short synthesised cues for the set timer (tick / start / end).
  # A dedicated player rather than SystemSound: the platform sounds are a
  # single fixed click with no volume of their own, which is inaudible in a
  # gym and cannot carry "go" versus "stop".
  audioplayers: ^6.1.0
  encrypt: ^5.0.3
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.32.12
  # tflite_flutter REMOVED 2026-08-07. It was never imported -- `grep -rn
  # "package:tflite_flutter" lib/ test/` returns nothing, and the only mention
  # anywhere is the comment in mlkit_visual_equipment_service.dart explaining
  # why ML Kit's labeler is used INSTEAD of it. As a declared dependency it
  # still shipped libtensorflowlite_jni.so (3.7 MB) and
  # libtensorflowlite_gpu_jni.so (3.5 MB) into every APK: 7.2 MB of native
  # code with no call site, per ABI.
  #
  # The bundled equipment model is still TFLite -- it is loaded by ML Kit's
  # own interpreter via LocalLabelerOptions, which is why nothing breaks.
  # If a future change needs raw tensor access (custom pre/post-processing
  # ML Kit will not do), add it back deliberately and pay the 7.2 MB then.
  google_mlkit_image_labeling: ^0.14.0
  # B5b, the text anchor. Measured on the operator's own 30 gym photos: 18 of
  # them carry the machine's name legibly on its own shroud, and the v2
  # classifier scored 5 of those same 18. Reading what the manufacturer
  # already printed beats guessing from shape, whenever it is in frame.
  # Latin script only -- gym equipment is labelled in English worldwide.
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  google_sign_in: ^7.1.1
  flutter_svg: ^2.2.0
  google_mlkit_commons: ^0.11.0
  firebase_ai: 3.3.0
  firebase_crashlytics: ^5.2.0
  firebase_app_check: ^0.4.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  # Test-only. `font_bundle_test.dart` reads the `fonts:` block below as data
  # and checks it against the family constants the theme uses. Parsing it with
  # a regex instead would be a second, worse YAML parser whose disagreements
  # with the real one are exactly the drift the test exists to catch.
  yaml: ^3.1.2
  # Test-only. `image_picker` re-exports XFile and ImageSource but NOT
  # ImagePickerPlatform, and that class is the seam that makes the scanner's
  # own gallery path reachable from a host widget test: both entry points into
  # _classify cross a platform boundary, and the camera one also reads the file
  # off disk. Swapping ImagePickerPlatform.instance removes the only obstacle
  # on the gallery side without touching production code.
  image_picker_platform_interface: ^2.11.0
  # Drives the real app on a real device/emulator. The unit + widget suite runs
  # against fakes and cannot see the two things that broke on the operator's
  # phone: the native ML Kit bridge and what actually ends up in the APK.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb on every build/pub get.
  generate: true

  assets:
    - assets/data/
    - assets/models/
    # `assets/exercises/` (132 files, 8.1 MB of demo photographs) was declared
    # here until 2026-08-04. It became unreachable when the clip-only rule
    # landed and only the pre-purchase catalog ever referenced it; both are
    # now gone, and so is the dead weight in the APK.
    # Anatomical muscle chart, front and back. CC BY 4.0 — credited on the
    # /licences screen, which is a condition of shipping it.
    - assets/anatomy/
    # One still per clip, per body: the frame half a second in. Bundled rather
    # than hosted so the demo has something to show INSTANTLY and with no
    # network at all — the operator's report was that a clip loads in seconds
    # but shows a spinner until it does, and offline shows nothing whatsoever.
    # 2,979 files, 13.5 MB, affordable only because these clips are 3D renders
    # on flat white, which JPEG takes to ~5 KB at 400px. (Said 653 files /
    # 3.6 MB until 2026-08-06 — measured, and stale by more than 4x. A wrong
    # number here is the kind that gets believed during a size review.)
    #
    # Two entries, not one `assets/posters/`: a pubspec directory entry does
    # not recurse, and that exact mistake once shipped an APK with no demo
    # images at all. `integration_test/app_test.dart` guards it on device.
    #
    # 440 of these files (2.1 MB) are named by no catalog row.
    # `scripts/catalog/sweep_orphan_posters.py` exists for that; not run here.
    - assets/posters/girl/
    - assets/posters/men/
    # Generated by scripts/catalog/make_cue_sounds.py — arithmetic, not a
    # sound library, so there is no licence attached to 200 KB of audio.
    - assets/sounds/
    # Ten scenes the form coach stands the user in when the camera is replaced
    # by the avatar. 1440x2560 WebP, 2.2 MB for all ten — the panel is 9:16 and
    # a phone at 3x wants ~1440 wide, so this is the size that is used rather
    # than a size that gets downscaled.
    #
    # Bundled rather than fetched: this is the FIRST thing on screen when the
    # coach opens, and a scene that arrives a second late means the user watches
    # their own figure appear over nothing. The same argument the posters entry
    # above makes, for the same reason.
    #
    # No attribution entry: the operator generated these, so there is no third
    # party to credit. Stated because every other image directory here does have
    # one, and silence would read as an omission.
    - assets/coach_bg/
    # NOT bundled, deliberately: `assets/coach_demo/` is absent from this list.
    #
    # It held the Form Coach's squat demonstration, cropped from the design
    # reference's own clip. The comment that used to sit here said the crop
    # put "the prototype's baked-in chrome outside the frame", and G1.2
    # (2026-09-09) measured that claim and found it false. The source is a
    # screen recording of an older prototype: its coach line "stand tall to
    # start counting" is present in all 240 frames, it crosses the standing
    # figure's head so no crop can reach it, the rep counter reads 0
    # throughout, and a toast reads "Too dark or too blurry to read your
    # position". GPT-PM ruled the clip out of production until real
    # chrome-free footage exists (`core/DECISION_LOG.md`, 2026-09-09).
    #
    # The files stay on disk and in git — they are the record of what was
    # investigated, and deleting them is not this gate's call to make. Leaving
    # them undeclared is what keeps them out of the app: nothing in `lib/`
    # names them any more, and `coach_demo_test.dart` holds that.

  # The two families the design uses, bundled rather than fetched.
  #
  # `google_fonts` downloaded these at runtime on first launch. Every failure
  # mode of that is silent: offline, a captive portal, or a TLS-intercepting
  # proxy (this project has already hit one) all end in Flutter falling back to
  # the platform font, which is a different width — so the first launch of the
  # app in the situation where a person most needs it is the one that renders
  # in the wrong typeface and reflows once the download lands.
  #
  # Every weight the app requests, which is 500-900 plus Inter's 400 default.
  #
  # The first version of this block shipped only the three weights
  # `app_theme.dart` names directly, and that was wrong: `lib/` applies
  # `.copyWith(fontWeight:)` at 213 call sites, and the single most common
  # weight in the whole app is **w800** (105 uses) — which was not among them.
  # A weight with no bundled face does not fail; the engine synthesizes a fake
  # one, which is the same silent-degradation class as the runtime download
  # being removed here. Measured, not assumed:
  #   grep -rho "FontWeight\.w[0-9]00" lib/ | sort | uniq -c
  #   => w800 105 · w700 68 · w600 29 · w900 8 · w500 1
  # Material's own 2021 type scale additionally defaults `titleSmall` and the
  # `label*` roles to w500, which is why 500 is here for a single explicit use.
  #
  # ~2.4 MB against a 103 MB APK. Both families are SIL OFL; licences beside
  # the files.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: Barlow Condensed
      fonts:
        # w400 added 2026-08-19. Nothing named it before the HUD work, but
        # `font_bundle_test.dart` requires BOTH legacy families to carry every
        # weight `lib/` requests -- and the HUD type scale requests w400. The
        # face is 103 KB and the alternative was weakening that guard.
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    # The HUD redesign's two families, instanced from the Google Fonts variable
    # masters at wdth=100 and the six/four weights the handoff asks for. SIL
    # OFL, licences beside the files, credited on /licences.
    #
    # Archivo cannot set Russian. Measured 2026-08-19 on the upstream master:
    # 0 of 256 codepoints in the Cyrillic block, no Ё, no ё; and Google's own
    # ofl/archivo/METADATA.pb declares `subsets: latin, latin-ext, menu,
    # vietnamese`. Since Russian is this app's DEFAULT language, naming Archivo
    # alone would have fallen every Russian string back to the platform font --
    # a different face on every device, and the exact silent degradation that
    # removing `google_fonts` was meant to end. `hud_typography.dart` lists
    # Inter as the per-glyph fallback, which is already bundled at every weight
    # Archivo is.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-Black.ttf
          weight: 900
    # The handoff asks for `ui-monospace` -- deliberately the system mono
    # rather than a brand face. Flutter cannot honour that portably:
    # `fontFamily: 'monospace'` is Roboto Mono on Android and Courier on iOS,
    # which is a different design and has no place in this interface. Roboto
    # Mono IS the Android system mono, and it carries full Cyrillic (64/64 plus
    # Ё/ё, verified), so bundling it makes both platforms render the same
    # technical values.
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
    # SCAN-G1 (core/SCAN_G1_SCOPE.md, R6). The design reference draws the
    # Scan screen's glyphs with Google's Material Symbols Sharp; the app used
    # to draw them with Flutter's Material Icons, whose shapes differ, so the
    # reference-fidelity gate would have had to mask every icon. This is a
    # six-glyph variable subset (FILL, GRAD, opsz, wght kept) of that font,
    # 10.7 KB, built by tools/design/build_symbols_subset.py; Apache-2.0,
    # notice in assets/fonts/LICENSE-MaterialSymbols.txt. Weight 300 is what
    # the reference asks for (`opsz,wght,FILL,GRAD@20..48,300,0,0`) and is
    # selected at draw time through `fontVariations`, so the single face is
    # declared at the default weight.
    - family: Material Symbols Sharp
      fonts:
        - asset: assets/fonts/MaterialSymbolsSharp-scan.ttf
          weight: 400

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
