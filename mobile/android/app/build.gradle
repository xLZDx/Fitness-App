plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // R0. Uploads native (non-Dart) crash symbols + mapping files on every
    // release build; the Dart-side reporting is wired in main.dart.
    id "com.google.firebase.crashlytics"
}

// R0 — real release signing, with the debug fallback this file shipped with
// preserved rather than removed.
//
// WHY THIS FILE DOES NOT CONTAIN A KEY
//
// A signing key is not a config value: once a real one signs a listing
// published to Google Play, Play permanently binds that listing to it —
// there is no "rotate the key" undo, the same class of one-way action as a
// live data migration (see the operator's own framing for this gate). The
// operator generates their own key with `keytool`, outside this repo, and
// keeps it somewhere `git` never sees:
//
//   keytool -genkey -v -keystore <path>/upload-keystore.jks \
//     -keyalg RSA -keysize 2048 -validity 10000 -alias upload
//
// Then create android/key.properties (already in android/.gitignore
// alongside every *.jks/*.keystore) from android/key.properties.example,
// filling in the real values.
//
// WHY THE BUILD STILL WORKS WITHOUT ONE
//
// `flutter run --release` and every other Windows dev workflow this project
// has used all session must keep working today, with no key.properties on
// disk anywhere. Falling back to debug signing when the file is absent —
// exactly the prior behaviour of this file — is what makes that true; the
// alternative (failing the build outright) would have blocked every
// non-Play use of a release build.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasRealSigningConfig = keystorePropertiesFile.exists()
if (hasRealSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    // Fail loud and specific here rather than letting a typo'd/missing
    // field reach `signingConfigs` below as a silent null -- that would
    // surface later as an opaque NPE deep in Android's own signing task
    // instead of at the one place that actually knows which key is
    // missing (silent-failure-hunter + flutter-reviewer finding, R0).
    ['keyAlias', 'keyPassword', 'storeFile', 'storePassword'].each { key ->
        assert keystoreProperties[key] :
            "android/key.properties is missing '${key}' -- see android/key.properties.example"
    }
} else if (gradle.startParameter.taskNames.any { it.contains('Release') || it.contains('Bundle') }) {
    // Gated to release-shaped tasks only (assembleRelease, bundleRelease,
    // ...) -- every plain `flutter run` / `flutter run --release` dev build
    // hits this branch too per "WHY THE BUILD STILL WORKS WITHOUT ONE"
    // above, and warning on every single one of those would be exactly the
    // noise the operator's "clean banner" standard exists to filter out,
    // defeating the point of a warning meant to stand out on the one build
    // that actually matters (silent-failure-hunter finding, R0).
    logger.warn(
        "R0: android/key.properties not found at ${keystorePropertiesFile} " +
        "-- this build will be DEBUG-SIGNED, not suitable for Play Store upload."
    )
}

android {
    namespace = "com.fitnessapp.fitness_app"
    // P1. Pinned, not `flutter.compileSdkVersion`, for the same reason as
    // `ndkVersion` below: the Flutter SDK's default resolves to 35 here, and
    // two plugins compile against 36 — `flutter_secure_storage` and
    // `flutter_tts`. Every release build printed the mismatch, ending in
    // Gradle's own instruction to set this value:
    //
    //   Your project is configured to compile against Android SDK 35, but the
    //   following plugin(s) require to be compiled against a higher Android
    //   SDK version: - flutter_secure_storage compiles against Android SDK 36
    //   - flutter_tts compiles against Android SDK 36
    //
    // Raising compileSdk is not the same as raising `targetSdk` (still
    // `flutter.targetSdkVersion` below): compileSdk decides which APIs the
    // code may reference and is backward compatible, while targetSdk changes
    // the runtime behaviour Android applies to the app. Only the first one is
    // needed to clear this, so only the first one moves.
    compileSdk = 36
    // 20 of our plugins now require NDK 27. flutter.ndkVersion still
    // resolves to the SDK default (older) — pin explicitly so the
    // build doesn't print 20 warning lines on every run.
    ndkVersion = "27.0.12077973"

    compileOptions {
        // flutter_local_notifications requires core library desugaring for
        // java.time on minSdk 23.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // `com.fitnessapp.fitness_app` was rejected by the Play Console on
        // 2026-08-07: "This package name is already in use." A package name is
        // burned permanently once taken -- by anyone, including an earlier
        // draft of your own -- so the suffix is the only way forward, not a
        // preference.
        //
        // Lowercase `sptr`, not `SPTR`: segments are conventionally lowercase,
        // and mixed case has bitten toolchains and case-insensitive file
        // systems before.
        //
        // This value can never be changed again after the first Play upload.
        //
        // NOT the same as `namespace` above (still `com.fitnessapp.fitness_app`).
        // That one is the Kotlin/R-class namespace and is deliberately left
        // alone -- changing it would mean moving `MainActivity.kt` for no gain.
        applicationId = "com.fitnessapp.fitness_app.sptr"
        // health package needs Android 8.0+ (API 26). Health Connect
        // itself ships from 14+ but the plugin auto-falls back to
        // Google Fit on 26–33.
        minSdk = 26
        // MVP1.G2. Pinned explicitly, not `flutter.targetSdkVersion` (currently resolves to
        // 35) -- Google requires new app updates to target API 36 (Android 16) from
        // 2026-08-31, with an extension path to 2026-11-01. Raising targetSdk (unlike
        // compileSdk above) changes the runtime behaviour Android applies to the app; the
        // primary expected regression category is edge-to-edge/inset handling, audited and
        // verified separately under this gate.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasRealSigningConfig) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        // P2. `debug` and `release` used to share `applicationId`, which had
        // two costs. First, once a real signing key exists (see
        // `hasRealSigningConfig` below), Android's own signature check
        // blocks a debug install from landing over a release one -- but the
        // failure the operator would see for that is a bare
        // "INSTALL_FAILED_UPDATE_INCOMPATIBLE" from `adb`/`flutter run`,
        // which explains nothing. Second, and worse, BEFORE that key
        // existed -- every debug build shipped this way until R0 -- nothing
        // stopped a same-signature debug build silently overwriting a
        // same-signature release install's SharedPreferences.
        //
        // `applicationIdSuffix` here is the fix, not the signing key: it
        // gives every debug build its own package id
        // (`com.fitnessapp.fitness_app.sptr.debug`), so `flutter run` and a
        // sideloaded release build are two DIFFERENT apps to the OS
        // regardless of which key either is signed with. `release` keeps
        // the bare id untouched -- that is the one `wear/build.gradle.kts`
        // pairs against (`applicationId` there "MUST equal the phone
        // module's"), so changing it would have silently unpaired the
        // watch, which is the opposite of what this gate is for.
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            // Real signing when key.properties exists (see the comment
            // above `keystorePropertiesFile`); the original debug-signed
            // fallback otherwise, so this build never breaks for lack of a
            // key nobody has generated yet.
            signingConfig = hasRealSigningConfig
                ? signingConfigs.release
                : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Wearable Data Layer — used by MainActivity to push WearWorkoutState
    // to the paired watch APK (see wear/ for the watch side).
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
