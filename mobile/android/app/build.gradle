plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.fitnessapp.fitness_app"
    compileSdk = flutter.compileSdkVersion
    // 20 of our plugins now require NDK 27. flutter.ndkVersion still
    // resolves to the SDK default (older) — pin explicitly so the
    // build doesn't print 20 warning lines on every run.
    ndkVersion = "27.0.12077973"

    compileOptions {
        // flutter_local_notifications requires core library desugaring for
        // java.time on minSdk 23.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.fitnessapp.fitness_app"
        // health package needs Android 8.0+ (API 26). Health Connect
        // itself ships from 14+ but the plugin auto-falls back to
        // Google Fit on 26–33.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Wearable Data Layer — used by MainActivity to push WearWorkoutState
    // to the paired watch APK (see wear/ for the watch side).
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
